{
  id: 'likert', name: 'Likert item analysis', family: 'scales',
  tags: ['Likert', 'questionnaire', 'survey', 'items', 'agreement', 'diverging bars', 'neutral', 'ordinal'],
  purpose: 'Summarise every Likert item at once: its distribution, median, share agreeing and disagreeing, and a test of each item against the neutral point.',
  when: 'Survey items read one at a time, which is how design-research questionnaires are usually analysed: "The method library was easy to search", and so on.',
  assumptions: ['Each item is ordinal, so medians and distributions are reported rather than means.', 'All items share one response scale.', 'Respondents answered independently.'],
  caution: 'Testing many items inflates false positives. The correction is on by default; if you switch it off, say so in the write-up.',
  input: { kind: 'items', label: 'One row per respondent, one column per item, numeric responses (e.g. 1–5). Blank cells are allowed.', numeric: true, cols: 1 },
  options: [
    { id: 'scale', type: 'select', label: 'Response scale', choices: ['Detect from data', '1–5', '1–7', '1–4', '1–6', '0–10'], def: 0 },
    { id: 'ref', type: 'number', label: 'Reference value (blank = scale midpoint)', def: '', step: 'any' },
    { id: 'adj', type: 'select', label: 'Correction across items', choices: ['Benjamini–Hochberg', 'Holm', 'none'], def: 0 }],
  run: function (d, o) {
    var M = d.matrix, w = M[0].length, i, j;
    var cols = [];
    for (j = 0; j < w; j++) {
      var c = [];
      for (i = 0; i < M.length; i++) { var s = M[i][j]; if (s !== '' && s != null && isFinite(parseFloat(s))) c.push(parseFloat(s)); }
      cols.push(c);
    }
    var all = [];
    cols.forEach(function (c) { all.push.apply(all, c); });
    if (!all.length) throw new Error('No numeric responses found.');
    var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    var SC = [null, [1, 5], [1, 7], [1, 4], [1, 6], [0, 10]][o.scale || 0], lo, hi, flags = [];
    if (SC) {
      lo = SC[0]; hi = SC[1];
      if (mn < lo || mx > hi) throw new Error('Some responses (' + mn + ' to ' + mx + ') fall outside the ' + lo + '–' + hi + ' scale you chose.');
    } else {
      lo = mn <= 0 ? 0 : 1; hi = mx;
      if (hi - lo < 2) throw new Error('The responses span too little of a scale to detect it. Choose the response scale explicitly.');
      flags.push(H.flag('info', 'Scale read from the data as ' + lo + '–' + hi + '. If nobody used an end point, set the scale explicitly so the midpoint is right.'));
    }
    var ref = (o.ref === '' || o.ref == null || isNaN(o.ref)) ? (lo + hi) / 2 : +o.ref;
    var whole = all.every(function (v) { return v === Math.round(v); });
    var cats = [];
    if (whole) for (var v = lo; v <= hi; v++) cats.push(v);
    else flags.push(H.flag('info', 'Some values are not whole numbers, so these look like averaged scale scores rather than item responses. The distribution chart is skipped.'));
    var items = [], chart = [];
    cols.forEach(function (c, jj) {
      if (!c.length) return;
      var wc = X.wilcoxonCore(c.map(function (x) { return x - ref; }), 0);
      items.push({
        name: d.names[jj] || ('Item ' + (jj + 1)), n: c.length, c: c, w: wc, p: wc ? wc.p : 1,
        below: c.filter(function (x) { return x < ref; }).length, at: c.filter(function (x) { return x === ref; }).length,
        above: c.filter(function (x) { return x > ref; }).length
      });
      if (whole) chart.push({ name: d.names[jj] || ('Item ' + (jj + 1)), pct: cats.map(function (k) { return 100 * c.filter(function (x) { return x === k; }).length / c.length; }) });
    });
    var meth = ['bh', 'holm', null][o.adj || 0], qLab = ['q (BH)', 'p (Holm)', null][o.adj || 0];
    var ps = items.map(function (it) { return it.p; }), qs = meth ? adjustP(ps, meth) : ps.slice();
    var up = 0, down = 0;
    items.forEach(function (it, k) {
      it.q = qs[k];
      if (it.w && it.q < 0.05) { if (it.w.rb > 0) up++; else down++; }
    });
    var anyTied = items.some(function (it) { return it.w && !it.w.exact; });
    if (anyTied) flags.push(H.flag('info', 'Items with tied responses use the normal approximation, which is the usual situation with Likert data.'));
    var pc = function (k, n) { return H.num(100 * k / n, 0) + '%'; };
    var head = ['Item', 'n', 'Mdn', 'IQR', 'Mode', 'Below', 'At ref', 'Above', 'V', 'p'];
    if (qLab) head.push(qLab);
    head.push('r');
    var rows = items.map(function (it) {
      var row = [it.name, it.n, H.num(S.median(it.c), 1), H.num(S.quantile(it.c, 0.25), 1) + '–' + H.num(S.quantile(it.c, 0.75), 1),
        String(X.modeOf(it.c)), pc(it.below, it.n), pc(it.at, it.n), pc(it.above, it.n),
        it.w ? H.num(it.w.Wp, 1) : '—', it.w ? H.pfmt(it.p) : '—'];
      if (qLab) row.push(it.w ? H.pfmt(it.q) : '—');
      row.push(it.w ? H.num(it.w.rb, 2) : '—');
      return row;
    });
    var nMax = Math.max.apply(null, items.map(function (it) { return it.n; }));
    var corr = meth === 'bh' ? 'Benjamini–Hochberg-adjusted' : meth === 'holm' ? 'Holm-adjusted' : 'unadjusted';
    return {
      stats: [H.stat('Items', items.length, 0), H.stat('Respondents', nMax, 0), H.stat('Reference', ref, 2),
              H.stat('Above reference', up, 0, 'after correction'), H.stat('Below reference', down, 0, 'after correction')],
      p: null, flags: flags,
      likert: whole ? { cats: cats, ref: ref, items: chart } : null,
      tables: [{ title: 'Items against the reference value (one-sample Wilcoxon signed-rank)', head: head, rows: rows }],
      apa: 'Of ' + items.length + ' items, ' + up + ' were rated above the reference value of ' + H.num(ref, 1) + ' and ' + down +
        ' below it (one-sample Wilcoxon signed-rank tests, ' + corr + ' p < .05).'
    };
  },
  next: function () {
    return [
      { title: 'Combining items into a scale?', body: 'Check internal consistency with Cronbach’s alpha before you average items into one score.', testId: 'cronbach' },
      { title: 'Compare groups on an item', body: 'Mann–Whitney U for two groups, Kruskal–Wallis for three or more stakeholder groups.', testId: 'mannwhitney' },
      { title: 'A single item in detail', body: 'The one-sample Wilcoxon page adds a sign test and the Hodges–Lehmann estimate.', testId: 'wilcoxon_one' }
    ];
  }
},
{
  id: 'nasa_tlx', name: 'NASA-TLX workload scoring', family: 'scales',
  tags: ['NASA-TLX', 'TLX', 'workload', 'usability', 'cognitive load', 'questionnaire', 'HCI'],
  purpose: 'Score NASA-TLX responses into an overall workload per participant and a subscale profile, raw or weighted.',
  when: 'After a usability or design task, to report perceived workload. Paste six ratings per participant, or twelve columns to include the pairwise-comparison weights.',
  assumptions: ['Subscales in the standard order: mental, physical, temporal, performance, effort, frustration.', 'Weights, if given, come from the 15 pairwise comparisons and sum to 15 per participant.'],
  caution: 'On the standard form, performance runs from perfect (0) to failure (100), so a higher number always means more workload. If your form asked how successful people felt, set the performance scale to reversed.',
  input: { kind: 'items', label: 'One row per participant: six ratings, optionally followed by six weights', numeric: true, cols: 6 },
  options: [
    { id: 'scale', type: 'select', label: 'Ratings recorded on', choices: ['0–100', '0–20 (21 marks, converted ×5)'], def: 0 },
    { id: 'perf', type: 'select', label: 'Performance scale', choices: ['standard (0 = perfect)', 'reversed (100 = perfect)'], def: 0 }],
  run: function (d, o) {
    var rows = numericCells(d.matrix);
    if (!rows.length) throw new Error('No complete rows found. Every participant needs all six ratings.');
    var k = rows[0].length;
    if (k !== 6 && k !== 12) throw new Error('NASA-TLX needs 6 columns of ratings in the standard order, or 12 with the six weights after them. Found ' + k + '.');
    var mult = o.scale === 1 ? 5 : 1, maxRaw = o.scale === 1 ? 20 : 100, weighted = k === 12, R = [], W = [];
    rows.forEach(function (r, i) {
      var rr = r.slice(0, 6);
      rr.forEach(function (v) {
        if (v < 0 || v > maxRaw) throw new Error('Participant ' + (i + 1) + ' has a rating of ' + v + ', outside 0–' + maxRaw + '. Check the "Ratings recorded on" option.');
      });
      rr = rr.map(function (v) { return v * mult; });
      if (o.perf === 1) rr[3] = 100 - rr[3];
      R.push(rr);
      if (weighted) {
        var w = r.slice(6), sw = X.sum(w);
        if (w.some(function (v) { return v < 0 || v > 5 || v !== Math.round(v); }) || sw !== 15) {
          throw new Error('Participant ' + (i + 1) + '’s weights must be whole numbers from 0 to 5 that sum to 15. They sum to ' + sw + '.');
        }
        W.push(w);
      }
    });
    var overall = R.map(function (rr, i) {
      if (!weighted) return S.mean(rr);

      for (var j = 0; j < 6; j++) s += rr[j] * W[i][j];
      return s / 15;
    });
    var n = overall.length, m = S.mean(overall), sd = n > 1 ? S.sd(overall) : 0, tc = n > 1 ? S.tInv(0.975, n - 1) : 0;
    var half = tc * sd / Math.sqrt(n);
    var NAMES = ['Mental demand', 'Physical demand', 'Temporal demand', 'Performance', 'Effort', 'Frustration'];
    var sub = NAMES.map(function (nm, j) {
      var c = R.map(function (r) { return r[j]; }), sm = S.mean(c), ss = n > 1 ? S.sd(c) : 0, h = tc * ss / Math.sqrt(n);
      return { name: nm, c: c, mean: sm, sd: ss, lo: sm - h, hi: sm + h, w: weighted ? S.mean(W.map(function (w) { return w[j]; })) : null };
    });
    var top = sub.slice().sort(function (a, b) { return b.mean - a.mean; })[0];
    var subHead = ['Subscale', 'Mean', 'SD', 'Mdn', 'Min', 'Max'];
    if (weighted) subHead.push('Mean weight');
    var subRows = sub.map(function (s) {
      var row = [s.name, H.num(s.mean, 1), H.num(s.sd, 1), H.num(S.median(s.c), 1), H.num(Math.min.apply(null, s.c), 0), H.num(Math.max.apply(null, s.c), 0)];
      if (weighted) row.push(H.num(s.w, 2));
      return row;
    });
    var pRows = R.map(function (rr, i) { return ['P' + (i + 1)].concat(rr.map(function (v) { return H.num(v, 0); })).concat([H.num(overall[i], 1)]); });
    var flags = [H.flag('info', weighted ? 'Weighted TLX: each subscale is multiplied by how often the participant chose it in the 15 pairwise comparisons, then divided by 15.'
      : 'Raw TLX: the unweighted mean of the six subscales, the most common variant in recent studies. State which version you used.')];
    if (n < 2) flags.push(H.flag('warn', 'With one participant there is no spread, so no confidence interval.'));
    return {
      stats: [H.stat('Participants', n, 0), H.stat('Version', weighted ? 'Weighted TLX' : 'Raw TLX'), H.stat('Mean workload', m, 1),
              H.stat('SD', sd, 1), H.stat('95% CI', n > 1 ? '[' + H.num(m - half, 1) + ', ' + H.num(m + half, 1) + ']' : '—'),
              H.stat('Highest subscale', top.name, null, 'M = ' + H.num(top.mean, 1))],
      p: null, flags: flags,
      bars: sub.map(function (s) {
        var lo = n > 1 ? s.lo : s.mean, hi = n > 1 ? s.hi : s.mean;
        return { name: s.name, p: s.mean / 100, lo: Math.max(0, lo) / 100, hi: Math.min(100, hi) / 100, text: H.num(s.mean, 1) };
      }),
      barsTitle: 'SUBSCALE MEANS WITH 95% CONFIDENCE INTERVALS', barsScale: ['0', '25', '50', '75', '100'],
      tables: [{ title: 'Subscales', head: subHead, rows: subRows },
               { title: 'Participants', head: ['Participant', 'Mental', 'Physical', 'Temporal', 'Perform.', 'Effort', 'Frustr.', 'Overall'], rows: pRows }],
      apa: 'Mean ' + (weighted ? 'weighted' : 'raw') + ' NASA-TLX workload was ' + H.num(m, 1) + ' (SD = ' + H.num(sd, 1) +

      { title: 'Relate workload to usability', body: 'Spearman correlation between TLX and SUS scores.', testId: 'spearman' }

  }
},

{

  assumptions: ['Each participant belongs to exactly one group.', 'Counts are participants who raised the theme, not the number of coded segments.', 'Themes are tested one at a time, because one participant can raise several.'],
  caution: 'These must be counts of people. If one talkative participant mentions a theme ten times, count them once.',
  input: { kind: 'table', label: 'First column: theme names. One row labelled "n" with each group’s size, then one row per theme with how many participants in each group raised it.' },
  options: [
    { id: 'test', type: 'select', label: 'Test per theme', choices: ['Exact (Fisher–Freeman–Halton)', 'Chi-square'], def: 0 },
    { id: 'adj', type: 'select', label: 'Correction across themes', choices: ['Benjamini–Hochberg (FDR)', 'Holm', 'Bonferroni', 'none'], def: 0 },
    { id: 'alpha', type: 'number', label: 'Significance level', def: 0.05, min: 0.001, max: 0.2, step: 0.01 }],
  run: function (d, o) {
    var T = d.table, rn = d.rowNames, cn = d.colNames, i, j;
    if (!rn) throw new Error('Put the theme names in the first column, and add one row labelled "n" giving the size of each group.');
    var ni = -1;
    rn.forEach(function (r, k) { if (ni < 0 && /^\s*(n|total|totals|group size|sample size|participants)\s*$/i.test(r)) ni = k; });
    if (ni < 0) throw new Error('Add a row labelled "n" giving the number of participants in each group. Without it the percentages have no denominator.');
    var ns = T[ni], k = ns.length;
    if (k < 2) throw new Error('Needs at least two groups.');
    if (ns.some(function (n) { return !(n > 0); })) throw new Error('Every group size in the "n" row must be above zero.');
    var G = (cn && cn.length === k) ? cn : ns.map(function (_, q) { return 'Group ' + (q + 1); });
    var themes = [];
    rn.forEach(function (name, r) {
      if (r === ni) return;
      T[r].forEach(function (x, q) {
        if (x > ns[q]) throw new Error('Theme "' + name + '": ' + x + ' participants in ' + G[q] + ', but that group has only ' + ns[q] + '.');
      });
      themes.push({ name: name, x: T[r] });
    });
    if (!themes.length) throw new Error('No theme rows found besides the "n" row.');
    var useChi = o.test === 1, alpha = +o.alpha > 0 ? +o.alpha : 0.05, mc = false, N = X.sum(ns);
    themes.forEach(function (th, ti) {
      th.chi = X.chi2xk(th.x, ns);

      else {

      }
    });

    var qs = meth ? adjustP(themes.map(function (t) { return t.p; }), meth) : themes.map(function (t) { return t.p; });
    var sig = 0;
    themes.forEach(function (th, ti) {
      th.q = qs[ti];
      th.pairs = [];
      if (!(th.q < alpha)) return;
      sig++;
      var pr = [], lab = [];
      for (i = 0; i < k; i++) for (j = i + 1; j < k; j++) {

        pr.push(e ? e.p : X.ffhMC([th.x[i], th.x[j]], [ns[i], ns[j]], 50000, 7).p);
        lab.push([i, j]);

        }
      });
    });
    var qLab = meth ? (meth === 'bh' ? 'q (BH)' : meth === 'holm' ? 'p (Holm)' : 'p (Bonf.)') : null;
    var head = ['Theme'].concat(G.map(function (g, q) { return g + ' (n = ' + ns[q] + ')'; }));
    if (useChi) head.push('χ²');
    head.push('p');
    if (qLab) head.push(qLab);
    head.push('V', 'Groups that differ');

      if (useChi) row.push(H.num(th.chi.chi, 2));
      row.push(H.pfmt(th.p));
      if (qLab) row.push(H.pfmt(th.q));

      return row;
    });

      (meth === 'bh' ? 'Benjamini–Hochberg controls the false discovery rate across the ' + themes.length + ' themes.' : meth ? 'The correction controls the family-wise error rate across themes.' : 'No correction is applied across themes, so expect some false positives.'))];
    if (k > 2) flags.push(H.flag('info', 'For themes that differ overall, pairwise Fisher tests with a Holm correction within the theme show which groups differ.'));
    if (Math.min.apply(null, ns) < 10) flags.push(H.flag('warn', 'At least one group has fewer than 10 participants, so only large differences can reach significance.'));

      p: null, flags: flags,

      apa: sig ? 'Of ' + themes.length + ' themes, ' + sig + ' differed across groups (' + testLab + ', ' + corrLab + ', ' + (meth === 'bh' ? 'q' : 'p') + ' < ' + String(alpha).replace(/^0\./, '.') + '): ' +
          hits.slice(0, 6).join(', ') + (hits.length > 6 ? ', and others' : '') + '.'
        : 'None of the ' + themes.length + ' themes differed across groups (' + testLab + ', ' + corrLab + ', ' + (meth === 'bh' ? 'q' : 'p') + ' < ' + String(alpha).replace(/^0\./, '.') + ').'

  },
  next: function () {
    return [
      { title: 'Report prevalence with intervals', body: 'Wilson intervals for each theme within each group make the size of the differences visible.', testId: 'wilson_batch' },
      { title: 'Two groups? Say how much more likely', body: 'An odds ratio or risk ratio for a single theme reads better than a p-value alone.', testId: 'oddsratio' },
      { title: 'Compare correction methods', body: 'See which themes survive each adjustment method side by side.', testId: 'padjust' }
    ];
  }
},
{
  id: 'saturation', name: 'Thematic saturation', family: 'qual',
  tags: ['saturation', 'interviews', 'sample size', 'codes', 'qualitative', 'Guest Namey Chen', 'new information', 'how many interviews'],
  purpose: 'Show whether new interviews were still adding codes when you stopped, using the base size, run length and new-information threshold of Guest, Namey and Chen (2020).',
  when: 'During or after an interview study, to report saturation with evidence rather than by declaration.',
  assumptions: ['Interviews are entered in the order they were conducted or coded.', 'Each code counts once per interview, however often it appears.', 'The codebook sits at one level of granularity.'],
  caution: 'Saturation depends on how fine-grained your codes are: a coarse codebook saturates early, a fine one late. State the level you used, and treat the result as supporting evidence rather than proof.',
  input: { kind: 'codes', label: 'One row per interview, in the order conducted. List that interview’s codes across the row (tabs or commas), or paste a 0/1 matrix with one column per code. An ID in the first column is fine.' },
  options: [
    { id: 'base', type: 'select', label: 'Base size', choices: ['4 interviews', '5 interviews', '6 interviews'], def: 0 },
    { id: 'run', type: 'select', label: 'Run length', choices: ['2 interviews', '3 interviews'], def: 0 },
    { id: 'thr', type: 'select', label: 'New-information threshold', choices: ['≤5%', '0% (no new codes)'], def: 0 }],
  run: function (d, o) {
    var iv = d.interviews, n = iv.length, BASES = [4, 5, 6], RUNS = [2, 3];
    var base = BASES[o.base || 0], runL = RUNS[o.run || 0], zeroThr = o.thr === 1;
    if (n < base + runL) throw new Error('This needs at least ' + (base + runL) + ' interviews for a base of ' + base + ' and a run of ' + runL + '. You have ' + n + '.');
    var seen = Object.create(null), perNew = [], perCount = [], cum = [], total = 0;
    iv.forEach(function (it, i) {
      var here = Object.create(null), nw = 0, cnt = 0;
      it.codes.forEach(function (c) {
        var key = String(c).trim().toLowerCase();
        if (!key || here[key]) return;
        here[key] = 1; cnt++;
        if (!seen[key]) { seen[key] = i + 1; nw++; total++; }
      });
      perNew.push(nw); perCount.push(cnt); cum.push(total);
    });
    function assess(b, r, zero) {
      if (n < b + r) return null;
      var baseU = cum[b - 1], runs = [], hit = null;
      if (!baseU) return { baseU: 0, runs: runs, hit: null, point: null };
      for (var s = b; s + r <= n; s++) {
        var nw = 0;
        for (var q = s; q < s + r; q++) nw += perNew[q];
        var pct = nw / baseU, ok = zero ? nw === 0 : pct <= 0.05 + 1e-12;
        var run = { from: s + 1, to: s + r, nw: nw, pct: pct, ok: ok };
        runs.push(run);
        if (ok && !hit) hit = run;
      }
      return { baseU: baseU, runs: runs, hit: hit, point: hit ? hit.from - 1 : null };
    }
    var A = assess(base, runL, zeroThr);

    var thrLab = zeroThr ? '0%' : '≤5%', label = A.hit ? A.point + '+' + runL : 'not reached';
    var sens = BASES.map(function (b) {
      var row = ['Base ' + b];
      RUNS.forEach(function (r) {
        [false, true].forEach(function (z) {
          var s = assess(b, r, z);
          row.push(!s ? 'too few' : s.hit ? s.point + '+' + r : 'not reached');
        });
      });
      return row;
    });
    var byThen = A.hit ? cum[A.point - 1] / total : null;
    var flags = [];
    if (A.hit) flags.push(H.flag('info', 'The first run to meet the ' + thrLab + ' threshold was interviews ' + A.hit.from + '–' + A.hit.to +

    flags.push(H.flag('info', 'Order matters: new codes are counted against every earlier interview, so enter interviews in the order they were conducted or coded.'));

    if (empty.length) flags.push(H.flag('warn', 'No codes were read for: ' + empty.slice(0, 5).join(', ') + (empty.length > 5 ? ', …' : '') + '. Check that row.'));
    return {
      stats: [H.stat('Interviews', n, 0), H.stat('Distinct codes', total, 0), H.stat('Codes in the base', A.baseU, 0, 'first ' + base + ' interviews'),
              H.stat('Saturation', label, null, 'base ' + base + ', run ' + runL + ', ' + thrLab),
              H.stat('Codes found by then', byThen != null ? H.num(100 * byThen, 0) + '%' : '—', null, byThen != null ? 'of all codes in the data' : null)],
      p: null, flags: flags,
      curve: { y: cum, base: base, point: A.point, runTo: A.hit ? A.hit.to : null, label: A.hit ? 'saturation ' + label : null },
      tables: [
        { title: 'Runs (base ' + base + ' = ' + A.baseU + ' codes)', head: ['Run', 'Interviews', 'New codes', '% of base', 'Meets ' + thrLab],
          rows: A.runs.map(function (r, i) { return [String(i + 1), r.from + '–' + r.to, String(r.nw), H.num(100 * r.pct, 1) + '%', r.ok ? 'yes' : 'no']; }) },
        { title: 'Interviews', head: ['#', 'Interview', 'Codes', 'New', 'Cumulative'],
          rows: iv.map(function (it, i) { return [String(i + 1), it.label, String(perCount[i]), String(perNew[i]), String(cum[i])]; }) },
        { title: 'Other parameter choices (Guest et al. report these side by side)', head: ['Base size', 'Run 2, ≤5%', 'Run 2, 0%', 'Run 3, ≤5%', 'Run 3, 0%'], rows: sens }],
      apa: A.hit ? 'Using a base size of ' + base + ', a run length of ' + runL + ' and a ' + thrLab + ' new-information threshold (Guest, Namey & Chen, 2020), thematic saturation was reached at ' +
          label + ' interviews (N = ' + n + ' interviews; ' + total + ' distinct codes).'
        : 'Using a base size of ' + base + ', a run length of ' + runL + ' and a ' + thrLab + ' new-information threshold (Guest, Namey & Chen, 2020), saturation was not reached within ' +
          n + ' interviews (' + total + ' distinct codes).'
    };
  },
  next: function () {
    return [
      { title: 'Show the coding can be trusted', body: 'Saturation says you have enough interviews; inter-coder reliability says your coding of them holds up. Reviewers usually want both.', testId: 'kripp_alpha' },
      { title: 'Report how common each theme is', body: 'Wilson intervals on theme prevalence.', testId: 'wilson_batch' },
      { title: 'Several stakeholder groups?', body: 'Test whether each theme differs between them.', testId: 'theme_groups' }
    ];
  }
},

    } else if (m === 7) {

   parse.js — turn pasted text into the shape each test expects.
   No DOM. Exposed as global P so it can be exercised in Node.
   ============================================================ */
var P = (function () {
  'use strict';

  function splitRows(text) {
    var lines = String(text == null ? '' : text).replace(/\u00a0/g, ' ').split(/\r?\n/);
    lines = lines.filter(function (l) { return l.trim() !== ''; });
    if (!lines.length) return [];
    var delim;
    if (lines.some(function (l) { return l.indexOf('\t') >= 0; })) delim = '\t';
    else if (lines.some(function (l) { return l.indexOf(',') >= 0; })) delim = ',';
    else if (lines.some(function (l) { return l.indexOf(';') >= 0; })) delim = ';';
    else delim = null;
    var grid = lines.map(function (l) {
      var cells = delim ? l.split(delim) : l.trim().split(/\s+/);
      return cells.map(function (c) { return c.trim(); });
    });
    var w = 0;
    grid.forEach(function (r) { if (r.length > w) w = r.length; });
    grid.forEach(function (r) { while (r.length < w) r.push(''); });
    return grid;
  }

  function isNum(s) {
    if (s === '' || s == null) return false;
    var t = String(s).trim().replace(/[, ]/g, '').replace(/%$/, '');
    return t !== '' && /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t);
  }
  function toNum(s) {
    var t = String(s).trim().replace(/[, ]/g, '');
    if (/%$/.test(t)) return parseFloat(t) / 100;
    return parseFloat(t);
  }

  function vocabOf(cells) {
    var v = {};
    cells.forEach(function (c) { if (c !== '' && c != null) v[String(c).toLowerCase()] = 1; });
    return v;
  }

  function looksHeader(grid) {
    if (grid.length < 2) return false;
    var row0 = grid[0], rest = grid.slice(1);
    var w = row0.length, c, r;

    // columns whose body is predominantly numeric
    var numericCols = [];
    for (c = 0; c < w; c++) {
      var filled = 0, num = 0;
      for (r = 0; r < rest.length; r++) {
        if (rest[r][c] !== '' && rest[r][c] != null) { filled++; if (isNum(rest[r][c])) num++; }
      }
      if (filled > 0 && num / filled > 0.7) numericCols.push(c);
    }
    if (numericCols.length) {
      // a header row carries text, or nothing, where the body carries numbers
      var clean = numericCols.every(function (cc) { return !isNum(row0[cc]); });
      var named = numericCols.some(function (cc) { return row0[cc] !== '' && row0[cc] != null; });
      return clean && named;
    }

    // wholly categorical body: a header uses words the body never uses
    if (rest.length < 2) return false;
    var body = [];
    rest.forEach(function (rr) { rr.forEach(function (cc) { body.push(cc); }); });
    var vocab = vocabOf(body);
    var top = row0.filter(function (cc) { return cc !== ''; });
    if (!top.length) return false;
    return top.every(function (cc) { return !vocab[String(cc).toLowerCase()]; });
  }

  function looksRowLabel(body) {
    if (!body.length || body[0].length < 2) return false;
    var col0 = body.map(function (r) { return r[0]; });
    var filled = col0.filter(function (c) { return c !== '' && c != null; });
    if (!filled.length) return false;
    var nonNum = filled.filter(function (c) { return !isNum(c); });
    if (nonNum.length / filled.length <= 0.6) return false;

    var restCells = [];
    body.forEach(function (r) { for (var i = 1; i < r.length; i++) if (r[i] !== '' && r[i] != null) restCells.push(r[i]); });
    if (!restCells.length) return false;

    // text first column beside a numeric body is a label column
    var restNum = restCells.filter(isNum).length;
    if (restNum / restCells.length > 0.6) return true;

    // beside a categorical body, only unique values that the body never reuses
    var distinct = Object.keys(vocabOf(filled));
    if (distinct.length / filled.length <= 0.8) return false;
    var restVocab = vocabOf(restCells);
    var shared = distinct.filter(function (v) { return restVocab[v]; }).length;
    return shared / distinct.length < 0.34;
  }

  function shape(text, grid) {
    var raw = splitRows(text);
    if (!raw.length) return null;
    var g = grid || { orient: 0, header: 0, rowlab: 0 };
    var hasHeader = g.header === 0 ? looksHeader(raw) : g.header === 1;
    var body = hasHeader ? raw.slice(1) : raw;
    var names = hasHeader ? raw[0].slice() : [];
    if (!body.length) { body = raw; names = []; hasHeader = false; }
    var hasLab = g.rowlab === 0 ? looksRowLabel(body) : g.rowlab === 1;
    var rowNames = [];
    if (hasLab) {
      rowNames = body.map(function (r) { return r[0]; });
      body = body.map(function (r) { return r.slice(1); });
      var w2 = body[0] ? body[0].length : 0;
      if (names.length) {
        var trimmed = names.slice();
        while (trimmed.length && trimmed[trimmed.length - 1] === '') trimmed.pop();
        if (trimmed.length === w2) names = trimmed;              // header skipped the label column
        else if (names.length > w2) names = names.slice(names.length - w2);  // header included it
      }
    }
    var width = body[0] ? body[0].length : 0;
    if (!names.length) for (var i = 0; i < width; i++) names.push('Column ' + (i + 1));
    while (names.length < width) names.push('Column ' + (names.length + 1));
    return { body: body, names: names, rowNames: rowNames, hasHeader: hasHeader, hasLab: hasLab };
  }

  function columnsOf(sh, transpose) {
    var m = sh.body, names = sh.names, i, j;
    if (transpose) {
      var w = 0;
      m.forEach(function (r) { if (r.length > w) w = r.length; });
      var t = [];
      for (j = 0; j < w; j++) { t[j] = []; for (i = 0; i < m.length; i++) t[j][i] = m[i][j]; }
      m = t;
      names = sh.rowNames.length ? sh.rowNames.slice() : [];
    }
    var wid = 0;
    m.forEach(function (r) { if (r.length > wid) wid = r.length; });
    var cols = [], out = [];
    for (var c = 0; c < wid; c++) {
      var col = [];
      for (var r2 = 0; r2 < m.length; r2++) if (isNum(m[r2][c])) col.push(toNum(m[r2][c]));
      if (col.length) { cols.push(col); out.push(names[c] || ('Column ' + (c + 1))); }
    }
    return { cols: cols, names: out };
  }

  function stringMatrix(sh, transpose) {
    var m = sh.body.map(function (r) { return r.slice(); });
    var names = sh.names, rowNames = sh.rowNames, i, j;
    if (transpose) {
      var w = 0;
      m.forEach(function (r) { if (r.length > w) w = r.length; });
      var t = [];
      for (j = 0; j < w; j++) { t[j] = []; for (i = 0; i < m.length; i++) t[j][i] = m[i][j] == null ? '' : m[i][j]; }
      m = t;
      names = sh.rowNames.slice();
      rowNames = sh.names.slice();
    }
    return { matrix: m, names: names, rowNames: rowNames };
  }

  function labelOf(row, rowNames, i, fallback) {
    if (rowNames && rowNames[i]) return rowNames[i];
    for (var j = 0; j < row.length; j++) if (row[j] !== '' && !isNum(row[j])) return row[j];
    return fallback + ' ' + (i + 1);
  }

  function build(test, text, grid, nums) {
    var kind = test.input.kind;
    if (kind === 'none') return {};
    nums = nums || {};
    if (kind === 'kn') {
      if (!(nums.n > 0)) throw new Error('Enter a total greater than zero.');
      if (!(nums.k >= 0) || nums.k > nums.n) throw new Error('The count must be between 0 and the total.');
      return { k: nums.k, n: nums.n };
    }
    if (kind === 'kn2') {
      if (!(nums.n1 > 0) || !(nums.n2 > 0)) throw new Error('Enter a total greater than zero for both groups.');
      if (!(nums.k1 >= 0) || !(nums.k2 >= 0) || nums.k1 > nums.n1 || nums.k2 > nums.n2) throw new Error('Each count must be between 0 and its own total.');
      return { k1: nums.k1, n1: nums.n1, k2: nums.k2, n2: nums.n2 };
    }

    var sh = shape(text, grid);
    if (!sh || !sh.body.length) throw new Error('Paste your data into the box above. "Load example" shows the layout this test expects.');
    var transpose = grid && grid.orient === 1;

    if (kind === 'codes') {
      var raw = splitRows(text);
      var gg = grid || { header: 0, rowlab: 0 };
      var lab = gg.rowlab === 0 ? looksRowLabel(raw) : gg.rowlab === 1;
      var labels = lab ? raw.map(function (r) { return r[0]; }) : null;
      var cells = raw.map(function (r) { return lab ? r.slice(1) : r.slice(); });
      function bin(c) { return c === '' || c === '0' || c === '1'; }
      var headerBin = cells.length > 1 && cells[0].some(function (c) { return c !== '' && !isNum(c); }) &&
        cells.slice(1).every(function (r) { return r.every(bin); }) && cells.slice(1).some(function (r) { return r.indexOf('1') >= 0; });
      var pureBin = !headerBin && cells.every(function (r) { return r.every(bin); }) && cells.some(function (r) { return r.indexOf('1') >= 0; });
      var interviews = [], mode;
      if (headerBin || pureBin) {
        var cnames = headerBin ? cells[0] : cells[0].map(function (_, j) { return 'Code ' + (j + 1); });
        var rows = headerBin ? cells.slice(1) : cells, lbs = labels ? (headerBin ? labels.slice(1) : labels) : null;
        interviews = rows.map(function (r, i) {
          return { label: lbs && lbs[i] ? lbs[i] : 'Interview ' + (i + 1), codes: cnames.filter(function (nm, j) { return r[j] === '1'; }) };
        });
        mode = 'matrix';
      } else {
        var rows2 = cells, lbs2 = labels;
        if (gg.header === 1) { rows2 = cells.slice(1); lbs2 = labels ? labels.slice(1) : null; }
        interviews = rows2.map(function (r, i) {
          var cs = [];
          r.forEach(function (c) {
            if (c === '') return;
            c.split(/[;,]/).forEach(function (part) { part = part.trim(); if (part) cs.push(part); });
          });
          return { label: lbs2 && lbs2[i] ? lbs2[i] : 'Interview ' + (i + 1), codes: cs };
        });
        mode = 'list';
      }
      if (interviews.length < 3) throw new Error('Saturation needs one row per interview, and at least a handful of interviews. Found ' + interviews.length + '.');
      return { interviews: interviews, mode: mode };
    }

    if (kind === 'ratings' || kind === 'items') {
      var sm = stringMatrix(sh, transpose);
      var minc = test.input.cols || 2;
      if (!sm.matrix.length) throw new Error('No rows found.');
      var wid = sm.matrix[0].length;
      if (wid < minc) throw new Error('This test needs at least ' + minc + ' columns, one per coder or item. Found ' + wid + '. If your coders run across rows instead, switch "Layout" above.');
      return sm;
    }

    if (kind === 'table') {
      var T = [];
      sh.body.forEach(function (r) {
        var row = [];
        r.forEach(function (c) {
          if (c === '') return;
          if (!isNum(c)) throw new Error('A contingency table takes counts only, but found "' + c + '". If that is a label, set "First column" or "First row" above.');
          row.push(toNum(c));
        });
        if (row.length) T.push(row);
      });
      if (!T.length) throw new Error('No counts found.');
      var w0 = T[0].length;
      T.forEach(function (r) { if (r.length !== w0) throw new Error('Every row of the table must have the same number of counts. Found rows of length ' + T.map(function (x) { return x.length; }).join(' and ') + '.'); });
      if (T.some(function (r) { return r.some(function (v) { return v < 0 || v !== Math.round(v); }); })) throw new Error('Contingency tables need whole, non-negative counts.');
      return { table: T, rowNames: sh.rowNames.length ? sh.rowNames : null, colNames: sh.hasHeader ? sh.names : null };
    }

    if (kind === 'countsn') {
      var rowsN = sh.body.map(function (r, i) {
        var v = r.filter(isNum).map(toNum);
        var lab = labelOf(r, sh.rowNames, i, 'Item');
        if (v.length < 2) throw new Error('Row "' + lab + '" needs two numbers: the count and the total.');
        if (v[0] > v[1]) throw new Error('Row "' + lab + '": the count (' + v[0] + ') exceeds the total (' + v[1] + ').');
        if (v[1] <= 0) throw new Error('Row "' + lab + '": the total must be greater than zero.');
        return { name: lab, count: v[0], total: v[1] };
      });
      if (!rowsN.length) throw new Error('No rows found.');
      return { rows: rowsN };
    }

    if (kind === 'countsp') {
      var rowsP = sh.body.map(function (r, i) {
        var v = r.filter(isNum).map(toNum);
        var lab = labelOf(r, sh.rowNames, i, 'Category');
        if (!v.length) throw new Error('Row "' + lab + '" has no observed count.');
        return { name: lab, count: v[0], prop: v.length > 1 ? v[1] : null };
      });
      if (rowsP.length < 2) throw new Error('Goodness of fit needs at least two categories.');
      return { rows: rowsP };
    }

    if (kind === 'pvals') {
      var rowsQ = sh.body.map(function (r, i) {
        var v = r.filter(isNum).map(toNum);
        var lab = labelOf(r, sh.rowNames, i, 'Test');
        if (!v.length) throw new Error('Row "' + lab + '" has no p-value.');
        var p = v[v.length - 1];
        if (p < 0 || p > 1) throw new Error('Row "' + lab + '": p-values must fall between 0 and 1, but found ' + p + '.');
        return { name: lab, p: p };
      });
      if (rowsQ.length < 2) throw new Error('Adjustment needs at least two p-values.');
      return { rows: rowsQ };
    }

    if (kind === 'factorial') {
      var rows3 = [];
      sh.body.forEach(function (r, i) {
        var cells = r.filter(function (c) { return c !== ''; });
        if (sh.rowNames[i]) cells = [sh.rowNames[i]].concat(cells);
        if (cells.length < 3) return;
        var val = null;
        for (var j = cells.length - 1; j >= 0; j--) if (isNum(cells[j])) { val = toNum(cells[j]); break; }
        if (val == null) return;
        rows3.push({ a: cells[0], b: cells[1], v: val });
      });
      if (rows3.length < 4) throw new Error('Two-way ANOVA needs one row per observation with three columns: factor A, factor B, and the outcome. Found ' + rows3.length + ' usable rows.');
      return { rows3: rows3, aName: sh.names[0] || 'Factor A', bName: sh.names[1] || 'Factor B' };
    }

    var cn = columnsOf(sh, transpose);
    if (!cn.cols.length) throw new Error('No numeric columns found. Check for stray characters, or for numbers stored as text.');
    var min = test.input.min || 1, max = test.input.max || 99;
    if (cn.cols.length < min) {
      throw new Error('This test needs at least ' + min + ' columns of numbers but found ' + cn.cols.length +
        '. If your groups run across rows instead of down columns, switch "Layout" above.');
    }
    if (kind === 'sample') max = 1;
    if (cn.cols.length > max) {
      var nm = cn.names.map(function (n, i) { return n || ('column ' + (i + 1)); }).join(', ');
      throw new Error(max === 1
        ? 'This test takes a single column of numbers, but found ' + cn.cols.length + ' (' + nm + '). Keep only the column you want to test.'
        : 'This test compares exactly ' + max + ' groups, but found ' + cn.cols.length + ' columns (' + nm + '). Delete the extra columns, or for three or more groups use one-way ANOVA or Kruskal–Wallis.');
    }
    if (kind === 'paired' || kind === 'xy' || kind === 'wide' || kind === 'xyk') {
      var L = cn.cols[0].length;
      if (cn.cols.some(function (c) { return c.length !== L; })) {
        throw new Error('These columns must be the same length, because each row is one participant. Lengths found: ' +
          cn.cols.map(function (c) { return c.length; }).join(', ') + '. Delete rows with a missing value first.');
      }
      if (L < 3) throw new Error('Need at least 3 complete rows.');
    }
    return { groups: cn.cols, names: cn.names };
  }

  function describe(d) {
    var bits = [];
    if (d.groups) bits.push(d.groups.length + ' column' + (d.groups.length > 1 ? 's' : '') + ', n = ' + d.groups.map(function (g) { return g.length; }).join(' / '));
    if (d.matrix) bits.push(d.matrix.length + ' rows × ' + d.matrix[0].length + ' columns');
    if (d.table) bits.push(d.table.length + ' × ' + d.table[0].length + ' table, N = ' + d.table.reduce(function (a, r) { return a + r.reduce(function (x, y) { return x + y; }, 0); }, 0));
    if (d.rows) bits.push(d.rows.length + ' rows');
    if (d.rows3) bits.push(d.rows3.length + ' observations');
    if (d.interviews) {
      var seen = {};
      d.interviews.forEach(function (it) { it.codes.forEach(function (c) { seen[String(c).trim().toLowerCase()] = 1; }); });
      bits.push(d.interviews.length + ' interviews, ' + Object.keys(seen).length + ' distinct codes' + (d.mode === 'matrix' ? ' (0/1 matrix)' : ''));
    }
    if (d.n != null) bits.push(d.k + ' of ' + d.n);
    if (d.n1 != null) bits.push(d.k1 + '/' + d.n1 + ' vs ' + d.k2 + '/' + d.n2);
    return bits.join(' · ');
  }

  return {
    splitRows: splitRows, isNum: isNum, toNum: toNum,
    looksHeader: looksHeader, looksRowLabel: looksRowLabel,
    shape: shape, columnsOf: columnsOf, build: build, describe: describe
  };
})();

  { id: 'pvalue', title: 'p-values',
    body: 'The probability of seeing data at least as extreme as yours if the null hypothesis were true. It is not the probability that the null hypothesis is true, and it says nothing about how large or important an effect is.',
    practice: 'Report the exact value (p = .031 rather than p < .05) alongside an effect size and its confidence interval.',
    tests: ['padjust'] },
  { id: 'ci', title: 'Confidence intervals',
    body: 'A range of values for the population quantity that is compatible with your data. A 95% interval comes from a procedure that captures the true value in 95% of repeated studies; any single interval either does or does not.',
    practice: 'Wide intervals are the honest signature of small samples. Report them rather than leaving them out.',
    tests: ['wilson_batch', 'prop_two'] },
  { id: 'effect', title: 'Effect sizes',
    body: 'How big a difference or association is, in units that do not depend on sample size: d, r, η², odds ratios, Cramér’s V, kappa. Significance tells you whether; effect size tells you how much.',
    practice: 'Report both. Cohen’s small, medium and large labels are rough conventions for when nothing better exists, not verdicts on importance.',
    tests: ['es_convert'] },
  { id: 'power', title: 'Statistical power',
    body: 'The probability that a study detects an effect of a given size if it really exists. It depends on sample size, effect size and the significance level.',
    practice: 'Plan it before collecting data. After a null result, report the smallest effect your sample could have detected rather than a post-hoc power figure computed from the observed effect.',
    tests: ['power', 'es_convert'] },
  { id: 'errors', title: 'Type I and Type II errors',
    body: 'A Type I error is a false positive: declaring an effect that is not there, at rate α (usually .05). A Type II error is a false negative: missing a real effect, at rate β, where power = 1 − β.',
    practice: 'Running many tests inflates false positives; small samples inflate false negatives. Design research often suffers from both at once.',
    tests: ['padjust', 'power'] },
  { id: 'paramnon', title: 'Parametric and non-parametric tests',
    body: 'Parametric tests (t-tests, ANOVA, Pearson) assume the data, or the residuals, follow a known distribution, usually the normal. Non-parametric tests work on ranks or signs, or build the null distribution from the data by permutation, so they need weaker assumptions.',
    practice: 'Choose non-parametric tests for Likert items, clearly skewed data, outliers, or small samples where normality cannot be checked. With well-behaved data, parametric tests have slightly more power.',
    tests: ['mannwhitney', 'wilcoxon', 'kruskal', 'friedman', 'art_anova'] },
  { id: 'normality', title: 'When normality matters',
    body: 'What matters is the sampling distribution of the statistic, not the raw data. With 30 or more per group, t-tests and ANOVA tolerate moderate non-normality well, but not heavy outliers or very unequal spreads.',
    practice: 'Look at the shape as well as Shapiro–Wilk, which flags trivial departures in large samples and misses real ones in small samples.',
    tests: ['descriptives', 'shapiro'] },
  { id: 'design', title: 'Independent and related samples',
    body: 'Independent samples are different people in each group. Related samples (paired, repeated measures) are the same people, or matched pairs, measured more than once. Related designs remove between-person variation and need different tests.',
    practice: 'If each row is one person with several measurements, the samples are related. Getting this wrong is one of the most common analysis errors.',
    tests: ['ttest_paired', 'wilcoxon', 'friedman'] },
  { id: 'multiple', title: 'Multiple comparisons: FWER and FDR',
    body: 'Every test at α = .05 carries a 5% false-positive risk, so testing 13 themes one by one makes at least one false positive likely. Family-wise methods (Bonferroni, Holm) control the chance of any false positive. False-discovery-rate methods (Benjamini–Hochberg) control the expected share of false positives among the findings you report.',
    practice: 'For exploratory theme-by-theme or item-by-item comparisons, Benjamini–Hochberg is the usual choice. For a few confirmatory tests, Holm.',

  { id: 'reliability', title: 'Agreement and reliability',
    body: 'Agreement asks whether coders assigned the same codes. Reliability asks whether they did so more often than chance would predict. Percent agreement ignores chance; kappa, alpha and AC1 correct for it.',
    practice: 'Report a chance-corrected coefficient with its interval. Krippendorff recommends α ≥ .80, with .667 as the lowest value acceptable for tentative conclusions.',

  { id: 'likert', title: 'Likert items and Likert scales',
    body: 'A single Likert item is ordinal: the step from agree to strongly agree need not equal the step from neutral to agree. A Likert scale, the sum or mean of several items measuring one construct, behaves more like an interval measure.',

  { id: 'exact', title: 'Exact and approximate p-values',

  /* ---------------- results log ---------------- */
  function logText() {
    return state.log.slice().reverse().map(function (e) { return e.name + ' (' + fmtTime(e.at) + ')\n' + (e.apa || ''); }).join('\n\n');
  }
  function logMarkdown() {
    var lines = ['# Results log', '', 'Exported ' + fmtTime(new Date().toISOString()), ''];
    state.log.slice().reverse().forEach(function (e) {
      lines.push('## ' + e.name, '', '*' + fmtTime(e.at) + '*', '');
      (e.stats || []).forEach(function (s) { lines.push('- ' + s); });
      if (e.apa) lines.push('', '> ' + e.apa);
      lines.push('');
    });
    lines.push('---', '', 'Exported from Design Research Statistics · ' + COPYRIGHT, '');
    return lines.join('\n');
  }
  function downloadLog() {
    try {
      var url = URL.createObjectURL(new Blob([logMarkdown()], { type: 'text/markdown;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url; a.download = 'results-log.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) { state.error = 'This browser blocked the download. Use Copy all instead.'; render(); }
  }
  function renderLog() {
    var p = el('div', 'panel');
    p.appendChild(el('h2', null, 'Results log'));
    p.appendChild(el('p', 'lede', 'Every test you run is kept here, newest first, so you can assemble a results section from it. It is stored in this browser only.'));

    };

    cl.onclick = function () {

      state.log = []; saveLog(); render();

    br.appendChild(ca); br.appendChild(dl); br.appendChild(cl);
    p.appendChild(br);
    state.log.forEach(function (e) {

  function selectField(label, choices, value, onchange) {
    var fd = el('div', 'field');
    var id = 'f' + Math.random().toString(36).slice(2, 9);
    var lb = el('label', null, label);
    lb.htmlFor = id;
    fd.appendChild(lb);
    var sel = document.createElement('select');
    sel.id = id;
    choices.forEach(function (c, i) {
      var op = document.createElement('option');
      op.value = String(i); op.textContent = c;
      if (i === value) op.selected = true;
      sel.appendChild(op);
    });
    sel.onchange = function () { onchange(parseInt(sel.value, 10)); };
    fd.appendChild(sel);
    return fd;
  }
  function numberField(label, value, attrs, onchange) {
    var fd = el('div', 'field');
    var id = 'f' + Math.random().toString(36).slice(2, 9);
    var lb = el('label', null, label);
    lb.htmlFor = id;
    fd.appendChild(lb);
    var inp = document.createElement('input');
    inp.type = 'number'; inp.id = id;
    if (attrs.min != null) inp.min = attrs.min;
    if (attrs.max != null) inp.max = attrs.max;
    inp.step = attrs.step || 'any';
    inp.value = value == null ? '' : value;
    inp.oninput = function () { onchange(inp.value === '' ? null : parseFloat(inp.value)); };
    fd.appendChild(inp);
    return fd;
  }

  function readFile(f, kind) {
    if (!f) return;
    if (/\.(xlsx|xlsm|xls|ods|numbers)$/i.test(f.name)) {
      state.result = null;
      state.error = 'Spreadsheet files can’t be read directly. Select the cells in your spreadsheet, copy them, and paste them into the box.';
      render();
      return;
    }
    var rd = new FileReader();
    rd.onload = function () { state.texts[kind] = String(rd.result || ''); state.result = null; state.error = null; render(); };
    rd.onerror = function () { state.error = 'That file could not be read.'; render(); };
    rd.readAsText(f);
  }

  function renderInput(t) {
    var box = el('div');
    box.appendChild(el('div', 'sep'));
    var kind = t.input.kind, grid = kind !== 'none' && kind !== 'kn' && kind !== 'kn2';

    if (kind === 'kn' || kind === 'kn2') {
      var fields = kind === 'kn'
        ? [['k', 'Successes'], ['n', 'Total']]
        : [['k1', 'Group 1 successes'], ['n1', 'Group 1 total'], ['k2', 'Group 2 successes'], ['n2', 'Group 2 total']];
      var row = el('div', 'field-row');
      fields.forEach(function (f) {
        row.appendChild(numberField(f[1], state.nums[f[0]], { min: 0, step: 1 }, function (v) { state.nums[f[0]] = v; }));
      });
      box.appendChild(row);
    } else if (grid) {
      box.appendChild(el('div', 'hint', t.input.label));
      var ta = document.createElement('textarea');
      ta.value = state.texts[kind] || '';
      ta.spellcheck = false;
      ta.setAttribute('aria-label', 'Data');
      ta.placeholder = 'Paste straight from a spreadsheet, or type values separated by tabs, commas or spaces.';
      ta.oninput = function () { state.texts[kind] = ta.value; updateNote(); };
      box.appendChild(ta);

      var ctl = el('div', 'field-row');
      ctl.style.marginTop = '10px';
      if (['groups', 'sample', 'paired', 'xy', 'wide', 'xyk', 'ratings', 'items'].indexOf(kind) >= 0) {
        ctl.appendChild(selectField('Layout', ['Columns are variables', 'Rows are variables'], state.grid.orient,
          function (v) { state.grid.orient = v; updateNote(); }));
      }
      ctl.appendChild(selectField('First row', ['Detect automatically', 'Is a header', 'Is data'], state.grid.header,
        function (v) { state.grid.header = v; updateNote(); }));
      ctl.appendChild(selectField('First column', ['Detect automatically', 'Is a label', 'Is data'], state.grid.rowlab,
        function (v) { state.grid.rowlab = v; updateNote(); }));
      box.appendChild(ctl);
      var note = el('div', 'parse-note');
      note.id = 'parse-note';
      box.appendChild(note);
    }

    if (t.options && t.options.length) {
      var st = state.opts[t.id] = state.opts[t.id] || {};

      var or = el('div', 'field-row');
      or.style.marginTop = '14px';
      t.options.forEach(function (o) {
        if (o.when && o.when.in.indexOf(st[o.when.id]) < 0) return;
        var drives = t.options.some(function (x) { return x.when && x.when.id === o.id; });
        if (o.type === 'select') {
          or.appendChild(selectField(o.label, o.choices, st[o.id], function (v) { st[o.id] = v; if (drives) { state.result = null; render(); } }));
        } else {
          or.appendChild(numberField(o.label, st[o.id], o, function (v) { st[o.id] = v; }));
        }
      });
      box.appendChild(or);
    }

    var br = el('div', 'btn-row');
    br.style.marginTop = '16px';

    br.appendChild(run);
    if (EXAMPLES[t.id]) {
      var ex = el('button', 'btn btn-ghost', 'Load example');
      ex.onclick = function () {
        state.texts[kind] = EXAMPLES[t.id];
        state.grid = { orient: 0, header: 0, rowlab: 0 };
        state.result = null; state.error = null;
        render();
      };
      br.appendChild(ex);

    if (grid) {
      var fl = el('label', 'btn btn-ghost file-btn');

      fl.appendChild(fi);

        var cl = el('button', 'btn btn-ghost', 'Clear');
        cl.onclick = function () { state.texts[kind] = ''; state.result = null; state.error = null; render(); };
        br.appendChild(cl);
      }

    box.appendChild(br);
    return box;
  }

  function updateNote() {
    var note = document.getElementById('parse-note');
    if (!note) return;
    var t = BY_ID[state.testId];
    if (!t) return;
    var text = state.texts[t.input.kind];
    if (!text || !text.trim()) { note.textContent = ''; return; }
    try {
      var d = P.build(t, text, state.grid, state.nums);
      note.textContent = 'Read: ' + P.describe(d);
      note.classList.remove('bad');
    } catch (e) {
      note.textContent = e.message;
      note.classList.add('bad');
    }
  }

  /* ---------------- results ---------------- */
  function readout(items, caption, sigP) {
    var ro = el('div', 'readout');

  function renderResult(t, r) {

  function toTSV(tb) {
    return [tb.head].concat(tb.rows).map(function (r) {
      return r.map(function (c) { return String(c == null ? '' : c).replace(/[\t\n]+/g, ' '); }).join('\t');
    }).join('\n');
  }
  function renderTable(tb) {
    var w = el('div', 'tbl-wrap');
    var table = document.createElement('table');
    var cp = document.createElement('caption');
    var cb = el('button', 'copy copy-sm', 'Copy');
    cb.title = 'Copy as tab-separated text. It pastes into Excel or Word as a table.';
    cb.onclick = function () {
      copyText(toTSV(tb), function (ok) { cb.textContent = ok ? 'Copied' : 'Failed'; setTimeout(function () { cb.textContent = 'Copy'; }, 1400); });
    };
    cp.appendChild(cb);
    cp.appendChild(el('span', null, tb.title));
    table.appendChild(cp);
    var thead = document.createElement('thead'), tr = document.createElement('tr');

    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    tb.rows.forEach(function (row) {
      var r2 = document.createElement('tr');
      row.forEach(function (c) { r2.appendChild(el('td', null, c)); });
      tbody.appendChild(r2);
    });
    table.appendChild(tbody);
    w.appendChild(table);

  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { cb(true); }, function () { fallback(); });
      return;
    }
    fallback();
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        cb(!!ok);
      } catch (e) { cb(false); }
    }
  }

  /* ---------------- charts ---------------- */
  function clamp01(v) { return !(v > 0) ? 0 : v > 1 ? 1 : v; }
  function barChart(r) {
    var wrap = el('div', 'chart');
    wrap.appendChild(el('h4', null, r.barsTitle || 'PROPORTIONS WITH CONFIDENCE INTERVALS'));
    r.bars.forEach(function (b) {
      var row = el('div', 'bar-row');
      var lab = el('div', 'bar-lab', b.name);
      lab.title = b.name;
      row.appendChild(lab);
      var track = el('div', 'bar-track');
      var fill = el('div', 'bar-fill');
      fill.style.width = (100 * clamp01(b.p)).toFixed(2) + '%';
      track.appendChild(fill);
      var ci = el('div', 'bar-ci');
      ci.style.left = (100 * clamp01(b.lo)).toFixed(2) + '%';
      ci.style.width = (100 * Math.max(0, clamp01(b.hi) - clamp01(b.lo))).toFixed(2) + '%';
      track.appendChild(ci);
      [b.lo, b.hi].forEach(function (v) {
        var cap = el('div', 'bar-cap');
        cap.style.left = (100 * clamp01(v)).toFixed(2) + '%';
        track.appendChild(cap);
      });
      track.appendChild(el('div', 'bar-val', b.text != null ? b.text : (100 * b.p).toFixed(1) + '%' + (b.label ? '  ' + b.label : '')));
      row.appendChild(track);
      wrap.appendChild(row);
    });
    var ax = el('div', 'bar-row');
    ax.appendChild(el('div'));
    var sc = el('div', 'bar-scale');
    (r.barsScale || ['0%', '25%', '50%', '75%', '100%']).forEach(function (s) { sc.appendChild(el('span', null, s)); });
    ax.appendChild(sc);
    wrap.appendChild(ax);
    return wrap;
  }

  var NEG = ['#B9C3CB', '#8E9DA9', '#667884', '#45565F', '#2A3943'];
  var POS = ['#A9D0CC', '#72B2AC', '#41928C', '#1E6E6B', '#12504D'];
  function likertChart(L) {
    var wrap = el('div', 'chart');
    var refTxt = String(Math.round(L.ref * 100) / 100);
    wrap.appendChild(el('h4', null, 'RESPONSES, CENTRED ON ' + refTxt));
    var cats = L.cats, ref = L.ref;
    var maxD = Math.max(ref - cats[0], cats[cats.length - 1] - ref) || 1;
    function colour(c) {
      if (c === ref) return '#D5DCE2';
      var t = Math.abs(c - ref) / maxD, pal = c < ref ? NEG : POS;
      return pal[Math.min(pal.length - 1, Math.max(0, Math.round(t * (pal.length - 1))))];
    }
    L.items.forEach(function (it) {
      var row = el('div', 'lk-row');
      var lab = el('div', 'bar-lab', it.name);
      lab.title = it.name;
      row.appendChild(lab);
      var left = 0, below = 0, above = 0;
      cats.forEach(function (c, i) {
        if (c < ref) { left += it.pct[i]; below += it.pct[i]; }
        else if (c === ref) left += it.pct[i] / 2;
        else above += it.pct[i];
      });
      row.appendChild(el('span', 'lk-num lk-l', Math.round(below) + '%'));
      var track = el('div', 'lk-track');
      var x = 50 - left / 2;
      cats.forEach(function (c, i) {
        var w = it.pct[i] / 2;
        if (!(w > 0)) return;
        var seg = el('div', 'lk-seg');
        seg.style.left = x.toFixed(3) + '%';
        seg.style.width = w.toFixed(3) + '%';
        seg.style.background = colour(c);
        seg.title = c + ': ' + Math.round(it.pct[i]) + '%';
        track.appendChild(seg);
        x += w;
      });
      track.appendChild(el('div', 'lk-mid'));
      row.appendChild(track);
      row.appendChild(el('span', 'lk-num', Math.round(above) + '%'));
      wrap.appendChild(row);
    });
    var lg = el('div', 'lk-legend');
    lg.appendChild(el('span', 'lk-end', 'lower'));
    cats.forEach(function (c) {
      var s = el('span');
      var sw = el('i');
      sw.style.background = colour(c);
      s.appendChild(sw);
      s.appendChild(document.createTextNode(String(c)));
      lg.appendChild(s);
    });
    lg.appendChild(el('span', 'lk-end', 'higher'));
    wrap.appendChild(lg);
    return wrap;
  }

  function curveChart(C) {
    var wrap = el('div', 'chart');
    wrap.appendChild(el('h4', null, 'CUMULATIVE DISTINCT CODES BY INTERVIEW'));
    var W = 520, Hh = 270, padL = 44, padB = 40, padT = 14, padR = 16;
    var n = C.y.length, ymax = Math.max.apply(null, C.y) || 1, top = ymax * 1.1;
    function X(i) { return padL + (n > 1 ? (i - 1) / (n - 1) : 0.5) * (W - padL - padR); }
    function Y(v) { return Hh - padB - (v / top) * (Hh - padB - padT); }
    var g = [], i;
    g.push('<rect x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (Hh - padB - padT) + '" fill="#F5F7F9" stroke="#DDE3E8"/>');
    var bx = X(C.base);
    g.push('<rect x="' + padL + '" y="' + padT + '" width="' + Math.max(0, bx - padL).toFixed(1) + '" height="' + (Hh - padB - padT) + '" fill="#E4EEED"/>');
    g.push('<text x="' + (padL + 6) + '" y="' + (padT + 14) + '" font-size="10" fill="#1E6E6B">base</text>');
    [0, 0.5, 1].forEach(function (f) {
      var v = Math.round(ymax * f), y = Y(v).toFixed(1);
      g.push('<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#DDE3E8"/>');
      g.push('<text x="' + (padL - 7) + '" y="' + (+y + 4) + '" text-anchor="end" font-size="10" fill="#7E8D99">' + v + '</text>');
    });
    if (C.point) {
      var px = X(C.point);
      if (C.runTo) g.push('<rect x="' + px.toFixed(1) + '" y="' + padT + '" width="' + (X(C.runTo) - px).toFixed(1) + '" height="' + (Hh - padB - padT) + '" fill="#16212B" fill-opacity="0.06"/>');
      g.push('<line x1="' + px.toFixed(1) + '" y1="' + padT + '" x2="' + px.toFixed(1) + '" y2="' + (Hh - padB) + '" stroke="#16212B" stroke-dasharray="3 3"/>');
      var right = px > W - 150;
      g.push('<text x="' + (right ? px - 5 : px + 5).toFixed(1) + '" y="' + (padT + 28) + '" text-anchor="' + (right ? 'end' : 'start') + '" font-size="10.5" fill="#16212B">' + esc(C.label || '') + '</text>');
    }
    var pts = C.y.map(function (v, k) { return X(k + 1).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ');
    g.push('<polyline points="' + pts + '" fill="none" stroke="#1E6E6B" stroke-width="1.8"/>');
    for (i = 0; i < n; i++) g.push('<circle cx="' + X(i + 1).toFixed(1) + '" cy="' + Y(C.y[i]).toFixed(1) + '" r="3" fill="#1E6E6B"/>');
    var step = n <= 16 ? 1 : n <= 32 ? 2 : Math.ceil(n / 16);
    for (i = 1; i <= n; i += step) g.push('<text x="' + X(i).toFixed(1) + '" y="' + (Hh - padB + 14) + '" text-anchor="middle" font-size="10" fill="#7E8D99">' + i + '</text>');
    g.push('<text x="' + (padL + (W - padL - padR) / 2) + '" y="' + (Hh - 6) + '" text-anchor="middle" font-size="11" fill="#4A5C6A">Interview</text>');
    var d = el('div');
    d.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="100%" class="svg-curve" role="img" aria-label="Cumulative distinct codes by interview">' + g.join('') + '</svg>';
    wrap.appendChild(d);
    return wrap;
  }

  function scatterChart(s) {
    var wrap = el('div', 'chart');
    wrap.appendChild(el('h4', null, 'SCATTER'));
    var W = 480, Hh = 300, padL = 48, padB = 42, padT = 12, padR = 14;
    var xs = s.x, ys = s.y;
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
    var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
    var xr = (xmax - xmin) || 1, yr = (ymax - ymin) || 1;
    xmin -= xr * 0.07; xmax += xr * 0.07; ymin -= yr * 0.07; ymax += yr * 0.07;
    function X(v) { return padL + (v - xmin) / (xmax - xmin) * (W - padL - padR); }
    function Y(v) { return Hh - padB - (v - ymin) / (ymax - ymin) * (Hh - padB - padT); }
    var g = [];
    g.push('<rect x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (Hh - padB - padT) + '" fill="#F5F7F9" stroke="#DDE3E8"/>');
    for (var i = 0; i <= 4; i++) {
      var gy = padT + i * (Hh - padB - padT) / 4;
      g.push('<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#DDE3E8"/>');
      g.push('<text x="' + (padL - 7) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10" fill="#7E8D99">' + fmtAxis(ymax - i * (ymax - ymin) / 4) + '</text>');
    }
    if (s.line) {
      g.push('<line x1="' + X(xmin).toFixed(1) + '" y1="' + Y(s.line.b0 + s.line.b1 * xmin).toFixed(1) +
        '" x2="' + X(xmax).toFixed(1) + '" y2="' + Y(s.line.b0 + s.line.b1 * xmax).toFixed(1) + '" stroke="#A65A16" stroke-width="1.5"/>');
    }
    for (i = 0; i < xs.length; i++) {
      g.push('<circle cx="' + X(xs[i]).toFixed(1) + '" cy="' + Y(ys[i]).toFixed(1) + '" r="3.5" fill="#1E6E6B" fill-opacity="0.7"/>');
    }
    g.push('<text x="' + padL + '" y="' + (Hh - 24) + '" font-size="10" fill="#7E8D99">' + fmtAxis(xmin) + '</text>');
    g.push('<text x="' + (W - padR) + '" y="' + (Hh - 24) + '" text-anchor="end" font-size="10" fill="#7E8D99">' + fmtAxis(xmax) + '</text>');
    g.push('<text x="' + (padL + (W - padL - padR) / 2) + '" y="' + (Hh - 7) + '" text-anchor="middle" font-size="11" fill="#4A5C6A">' + esc(s.xn || 'x') + '</text>');
    g.push('<text x="12" y="' + (Hh / 2) + '" text-anchor="middle" font-size="11" fill="#4A5C6A" transform="rotate(-90 12 ' + (Hh / 2) + ')">' + esc(s.yn || 'y') + '</text>');
    var d = el('div');
    d.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="100%" class="svg-scatter" role="img" aria-label="Scatter plot">' + g.join('') + '</svg>';
    wrap.appendChild(d);
    return wrap;
  }
  function fmtAxis(v) {
    var a = Math.abs(v);
    if (a >= 1000 || (a < 0.01 && a > 0)) return v.toPrecision(3);
    return (Math.round(v * 100) / 100).toString();
  }

  /* ---------------- running a test ---------------- */
  function execute(t) {
    state.error = null;
    state.result = null;
    try {
      var d = P.build(t, state.texts[t.input.kind], state.grid, state.nums);
      state.lastData = d;
      var o = state.opts[t.id] = state.opts[t.id] || {};
      (t.options || []).forEach(function (op) {
        if (o[op.id] == null || (typeof o[op.id] === 'number' && isNaN(o[op.id]))) o[op.id] = op.def;
      });
      var r = t.run(d, o);
      r.flags = r.flags || [];
      state.result = r;
      var entry = {
        id: t.id, name: t.name, at: new Date().toISOString(), apa: r.apa || '',
        stats: (r.stats || []).slice(0, 5).map(function (s) { return s.k + (/^[<>≤≥]/.test(String(s.v)) ? ' ' : ' = ') + s.v; })
      };
      if (state.log.length && state.log[0].id === t.id) state.log[0] = entry; else state.log.unshift(entry);
      saveLog();
    } catch (e) {
      state.error = (e && e.message) ? e.message : String(e);
    }
    render();
    var target = document.querySelector('.readout, .err');
    if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ---------------- index rail ---------------- */
  function renderRail() {
    var rail = el('nav', 'rail');
    rail.setAttribute('aria-label', 'Test index');
    var sw = el('div', 'rail-search');
    var inp = document.createElement('input');
    inp.type = 'search';
    inp.placeholder = 'Search ' + TESTS.length + ' tests…';
    inp.value = state.query;
    inp.setAttribute('aria-label', 'Search tests');
    inp.oninput = function () { state.query = inp.value; refreshRail(); };
    sw.appendChild(inp);
    rail.appendChild(sw);
    var list = el('div', 'rail-list');
    list.id = 'rail-list';
    rail.appendChild(list);
    fillRail(list);
    return rail;
  }
  function refreshRail() {
    var list = document.getElementById('rail-list');
    if (!list) return;
    list.innerHTML = '';
    fillRail(list);
  }
  function fillRail(list) {
    var q = state.query.trim().toLowerCase(), found = 0;
    FAMILIES.forEach(function (f) {
      var all = testsIn(f.id);
      var items = q ? all.filter(function (t) {
        return (t.name + ' ' + (t.tags || []).join(' ') + ' ' + t.purpose + ' ' + (t.when || '') + ' ' + f.label).toLowerCase().indexOf(q) >= 0;
      }) : all;
      if (q && !items.length) return;
      found += items.length;
      var isOpen = q ? true : state.openFam === f.id;
      var hb = el('button', 'fam-btn' + (isOpen ? ' open' : ''));
      hb.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      hb.appendChild(el('span', 'fam-name', f.label));
      hb.appendChild(el('span', 'fam-count', String(items.length)));
      hb.onclick = function () { if (q) return; state.openFam = isOpen ? null : f.id; refreshRail(); };
      list.appendChild(hb);
      if (!isOpen) return;
      var box = el('div', 'fam-items');
      items.forEach(function (t) {
        var b = el('button', 'fam-item', t.name);
        if (t.id === state.testId && state.view === 'test') b.setAttribute('aria-current', 'true');
        b.onclick = function () { open(t.id); };
        box.appendChild(b);
      });
      list.appendChild(box);
    });
    if (!found) list.appendChild(el('div', 'rail-empty', 'Nothing matches that. Try a plainer word: agreement, two groups, ordinal, Likert, themes.'));
  }

  /* ---------------- shell ---------------- */
  var MODES = [['guide', 'Guide me', ''], ['coverage', 'All tests', 'all'], ['concepts', 'Concepts', 'concepts'], ['log', 'Log', 'log']];
  function render() {
    app.innerHTML = '';
    var mast = el('header', 'masthead');
    var mi = el('div', 'masthead-in');
    var wm = el('button', 'wordmark');
    wm.appendChild(document.createTextNode('Design Research '));
    wm.appendChild(el('span', null, 'Statistics'));
    wm.onclick = function () { go('guide', ''); };
    mi.appendChild(wm);
    mi.appendChild(el('div', 'tagline', 'Coder agreement and quantitative inference, with the reasoning attached'));
    var modes = el('div', 'modes');
    modes.setAttribute('role', 'tablist');
    MODES.forEach(function (m) {
      var label = m[0] === 'log' && state.log.length ? 'Log · ' + state.log.length : m[1];
      var b = el('button', null, label);
      var on = state.view === m[0] || (m[0] === 'coverage' && state.view === 'test');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.onclick = function () { go(m[0], m[2]); };
      modes.appendChild(b);
    });
    mi.appendChild(modes);
    mast.appendChild(mi);
    app.appendChild(mast);

    var shell = el('div', 'shell' + (state.view === 'guide' ? ' solo' : ''));
    if (state.view !== 'guide') shell.appendChild(renderRail());
    var main = el('main');
    if (state.view === 'guide') main.appendChild(renderGuide());
    else if (state.view === 'test' && BY_ID[state.testId]) main.appendChild(renderTest());
    else if (state.view === 'concepts') main.appendChild(renderConcepts());
    else if (state.view === 'log') main.appendChild(renderLog());
    else main.appendChild(renderCoverage());
    if (state.error && state.view !== 'test') main.appendChild(el('div', 'err', state.error));
    shell.appendChild(main);
    app.appendChild(shell);

    var foot = el('footer', 'foot');
    foot.appendChild(el('p', null,
      'Everything is computed in this page. Your data is never uploaded, and the file keeps working with the network off. ' +
      'The numerical routines are checked against R, SciPy and G*Power reference values, but for anything going into a thesis or a submission, confirm the headline figures in a second package.'));
    foot.appendChild(el('div', 'foot-mark', COPYRIGHT));
    app.appendChild(foot);

    if (state.view === 'test') updateNote();
  }

  window.addEventListener('popstate', function () { fromHash(); render(); });
  window.addEventListener('hashchange', function () { fromHash(); render(); });
  fromHash();
  render();
})();
</script>
</body>
