<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Research Statistics — tests for qualitative and quantitative design science</title>
<meta name="description" content="Inter-coder agreement and quantitative inference for design research. Runs entirely in the browser, recommends a test, and tells you what to do with the result.">
<meta name="color-scheme" content="light">
<meta name="author" content="Mayank Mayookh">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23EEF1F4'/><rect x='6' y='17' width='4' height='9' fill='%231E6E6B'/><rect x='14' y='11' width='4' height='15' fill='%231E6E6B'/><rect x='22' y='6' width='4' height='20' fill='%23A65A16'/></svg>">
<style>:root{
  --paper:#EEF1F4;
  --surface:#FFFFFF;
  --sunk:#F5F7F9;
  --ink:#16212B;
  --ink-2:#4A5C6A;
  --ink-3:#7E8D99;
  --rule:#C3CCD4;
  --rule-2:#DDE3E8;
  --signal:#1E6E6B;
  --signal-d:#144B49;
  --signal-w:#E4EEED;
  --flag:#A65A16;
  --flag-w:#FBF0E4;
  --ok:#2F6B3D;
  --r:3px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.011em;line-height:1.25}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:var(--signal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--rule);background:var(--surface);
  position:sticky;top:0;z-index:40;
}
.masthead-in{
  max-width:1240px;margin:0 auto;padding:14px 22px;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
}
.wordmark{font-size:19px;font-weight:600;letter-spacing:-.02em;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.wordmark span{color:var(--signal)}
.tagline{font-size:13.5px;color:var(--ink-3);flex:1;min-width:180px}
.modes{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:var(--r);border:1px solid var(--rule-2)}
.modes button{
  background:none;border:0;padding:6px 13px;border-radius:2px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--ink-2);
}
.modes button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(22,33,43,.12)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:282px minmax(0,1fr);gap:22px;align-items:start}
.shell.solo{grid-template-columns:minmax(0,1fr);max-width:860px}

/* ---------- index rail ---------- */
.rail{position:sticky;top:76px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
.rail-search{padding:11px;border-bottom:1px solid var(--rule-2)}
.rail-search input{
  width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;
  font:inherit;font-size:14px;background:var(--sunk);
}
.rail-list{max-height:calc(100vh - 190px);overflow-y:auto;padding:6px 0 10px}
.rail-empty{padding:16px 13px;font-size:13.5px;color:var(--ink-3)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:22px;margin-bottom:16px}
.panel-tight{padding:16px 18px}

/* ---------- decision path (signature) ---------- */
.path{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.path-head{padding:22px 24px 6px}
.path-head h2{font-size:22px;letter-spacing:-.02em}
.path-head p{color:var(--ink-2);font-size:15px;max-width:62ch;margin-top:7px}
.rail-steps{padding:6px 24px 22px;counter-reset:step}
/* numbered step markers: a filled disc with the question number reads as progress, never as a box to tick */
.step{position:relative;padding:0 0 0 34px;counter-increment:step}
.step:before{
  content:counter(step);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;
  background:var(--signal);color:#fff;font:600 12px/22px var(--sans);text-align:center;
}
.step:after{
  content:"";position:absolute;left:11px;top:27px;bottom:3px;width:1px;background:var(--rule-2);
}
.step:last-child:after{display:none}
.step.done{padding-bottom:12px}
.step.done .step-q{font-size:12.5px;color:var(--ink-3);margin-bottom:1px}
.step.done .step-a{font-size:14.5px;color:var(--ink-2)}
.step.done:before{background:var(--rule-2);color:var(--ink-2);top:3px}
.step.live{padding-bottom:8px}
.step.live .step-q{font-size:17px;font-weight:600;margin:0 0 11px;letter-spacing:-.01em}
.choices{display:flex;flex-direction:column;gap:7px;max-width:620px}
.choices button{
  text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  padding:10px 13px;cursor:pointer;font-size:14.8px;line-height:1.4;color:var(--ink);
}
.choices button:hover{border-color:var(--signal);background:var(--signal-w)}
.undo{
  background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;padding:4px 0;
  text-decoration:underline;text-underline-offset:2px;
}
.undo:hover{color:var(--signal)}

/* ---------- recommendation cards ---------- */
.verdict{border-top:1px solid var(--rule);background:var(--sunk);padding:20px 24px 24px}
.verdict h3{font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;margin-bottom:12px}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{
  background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:14px 16px;
  display:flex;gap:14px;align-items:flex-start;text-align:left;cursor:pointer;width:100%;
}
.rec:hover{border-color:var(--signal)}
.rec-primary{border-left:3px solid var(--signal)}
.rec-body{flex:1;min-width:0}
.rec-name{font-weight:600;font-size:15.5px;margin-bottom:3px}
.rec-why{font-size:14px;color:var(--ink-2);line-height:1.5}
.tag{
  font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 7px;border-radius:2px;
  white-space:nowrap;margin-top:2px;
}
.tag-primary{background:var(--signal);color:#fff}
.tag-alternative{background:var(--sunk);color:var(--ink-2);border:1px solid var(--rule)}
.tag-companion{background:var(--flag-w);color:var(--flag)}

/* ---------- test detail ---------- */
.t-head{border-bottom:1px solid var(--rule-2);padding-bottom:16px;margin-bottom:18px}
.t-fam{font-size:12px;color:var(--signal);font-weight:600;letter-spacing:.04em;margin-bottom:5px}
.t-head h2{font-size:25px;letter-spacing:-.022em}
.t-purpose{margin-top:9px;font-size:16px;color:var(--ink-2);max-width:68ch}
.meta{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:4px}
.meta h4{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:6px}
.meta p,.meta li{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.meta ul{margin:0;padding-left:17px}
.meta li{margin-bottom:3px}
.caution{
  margin-top:16px;background:var(--flag-w);border-left:3px solid var(--flag);
  padding:12px 15px;font-size:14.5px;color:#6E3C0E;line-height:1.5;border-radius:0 2px 2px 0;
}
.caution strong{color:var(--flag)}

/* ---------- data entry ---------- */
.field-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px}
.field label{font-size:12.5px;color:var(--ink-3);font-weight:500}
.field select,.field input{
  padding:7px 9px;border:1px solid var(--rule);border-radius:2px;font:inherit;font-size:14px;background:var(--surface);
}
textarea{
  width:100%;min-height:170px;padding:12px 13px;border:1px solid var(--rule);border-radius:2px;
  font:400 13.5px/1.6 var(--mono);background:var(--sunk);resize:vertical;color:var(--ink);tab-size:8;
}
textarea:focus{background:var(--surface)}
.hint{font-size:13.5px;color:var(--ink-3);margin:7px 0 10px;line-height:1.5}
.btn{
  background:var(--signal);color:#fff;border:1px solid var(--signal-d);border-radius:2px;
  padding:10px 20px;font-size:15px;font-weight:500;cursor:pointer;
}
.btn:hover{background:var(--signal-d)}
.btn-ghost{background:none;color:var(--signal);border-color:var(--rule)}
.btn-ghost:hover{background:var(--signal-w);color:var(--signal-d)}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.parse-note{font-size:13px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- results ---------- */
.readout{background:var(--sunk);border:1px solid var(--rule-2);border-radius:2px;margin-bottom:16px;overflow:hidden}
.readout dl{display:flex;flex-wrap:wrap;margin:0 -1px -1px 0}
.readout div{flex:1 1 178px;min-width:0;padding:11px 16px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2)}
.readout dt{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.readout dd{margin:0;font:500 17px/1.25 var(--mono);letter-spacing:-.01em;word-break:break-word}
.readout dd.sig{color:var(--signal)}
.readout dd.txt{font:500 14px/1.35 var(--sans);letter-spacing:0}
.readout dd small{font:400 12px var(--sans);color:var(--ink-3);display:block;margin-top:2px}

.flags{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fl{padding:11px 14px;border-radius:2px;font-size:14.3px;line-height:1.5;border-left:3px solid}
.fl-warn{background:var(--flag-w);border-color:var(--flag);color:#6E3C0E}
.fl-info{background:var(--signal-w);border-color:var(--signal);color:#123F3D}

.tbl-wrap{overflow-x:auto;margin-bottom:18px;border:1px solid var(--rule-2);border-radius:2px}
.tbl-wrap td.more{font:400 12px var(--sans);color:var(--ink-3);text-align:left;white-space:normal}
.bar-more{font-size:12px;color:var(--ink-3);margin:6px 0 2px}
table{border-collapse:collapse;width:100%;font-size:13.8px}
caption{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:600;padding:9px 13px;background:var(--sunk);border-bottom:1px solid var(--rule-2);letter-spacing:.03em}
th,td{padding:7px 13px;text-align:right;border-bottom:1px solid var(--rule-2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--surface);color:var(--ink-3);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--rule)}
tbody td{font-family:var(--mono);font-size:13px}
tbody td:first-child{font-family:var(--sans);font-size:13.8px}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FAFBFC}

.apa{background:var(--ink);color:#DCE5EA;padding:14px 16px;border-radius:2px;font:400 13.6px/1.6 var(--mono);margin-bottom:6px;word-break:break-word}
.apa-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.apa-row h4{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em}
.copy{background:none;border:1px solid var(--rule);border-radius:2px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--signal);color:var(--signal)}

.err{background:var(--flag-w);border-left:3px solid var(--flag);padding:13px 15px;border-radius:0 2px 2px 0;font-size:14.5px;color:#6E3C0E}

/* ---------- next steps ---------- */
.next{border-top:1px solid var(--rule-2);margin-top:6px;padding-top:18px}
.next h3{font-size:12.5px;color:var(--ink-3);letter-spacing:.05em;margin-bottom:12px}
.nx{
  display:block;width:100%;text-align:left;background:var(--sunk);border:1px solid var(--rule-2);
  border-radius:2px;padding:13px 15px;margin-bottom:9px;cursor:default;
}
.nx.go{cursor:pointer}
.nx.go:hover{border-color:var(--signal);background:var(--signal-w)}
.nx-t{font-weight:600;font-size:14.8px;margin-bottom:3px}
.nx-b{font-size:14px;color:var(--ink-2);line-height:1.5}
.nx-go{font-size:12.5px;color:var(--signal);font-weight:500;margin-top:6px}

/* ---------- charts ---------- */
.chart{margin-bottom:18px;border:1px solid var(--rule-2);border-radius:2px;padding:14px;overflow-x:auto}
.chart h4{font-size:12.5px;color:var(--ink-3);letter-spacing:.03em;margin-bottom:10px}
svg text{font-family:var(--sans)}

/* ---------- coverage ---------- */
.cov{columns:2;column-gap:26px}
.cov section{break-inside:avoid;margin-bottom:16px}
.cov h4{font-size:13px;color:var(--signal);margin-bottom:5px}
.cov ul{margin:0;padding-left:17px;font-size:14px;color:var(--ink-2)}
.cov li{margin-bottom:2px}

.foot{max-width:1240px;margin:0 auto;padding:6px 22px 40px;font-size:13.2px;color:var(--ink-3);line-height:1.6}
.foot p{max-width:78ch}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding:14px;gap:14px}
  .rail{position:static}
  .rail-list{max-height:none;padding:0}
  .panel{padding:17px 15px}
  .path-head,.rail-steps,.verdict{padding-left:16px;padding-right:16px}
  .readout dl{grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
  .readout dd{font-size:15.5px}
  .t-head h2{font-size:21px}
  .cov{columns:1}
  .masthead-in{padding:11px 15px;gap:10px}
  .tagline{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .rec,.choices button,.nx.go{transition:border-color .12s,background-color .12s}
}
@media print{
  .rail,.masthead,.btn-row,.next{display:none}
  body{background:#fff}
  .panel{border:0;padding:0}
}

/* ---------- pieces referenced by app.js ---------- */
.sep{border-top:1px solid var(--rule-2);margin:20px 0 16px}
.linky{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);text-align:left;font:inherit;
  text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.linky:hover{color:var(--signal);text-decoration-color:var(--signal)}
.readout-cap{font-size:12px;color:var(--ink-3);padding:9px 16px 3px;letter-spacing:.04em}
.parse-note.bad{color:var(--flag)}
.bar-row{display:grid;grid-template-columns:minmax(84px,29%) 1fr;gap:11px;align-items:center;margin-bottom:7px}
.bar-lab{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{position:relative;height:21px;background:var(--sunk);border:1px solid var(--rule-2)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--signal);opacity:.8}
.bar-ci{position:absolute;top:50%;height:1px;background:var(--ink)}
.bar-cap{position:absolute;top:25%;height:50%;width:1px;background:var(--ink)}
.bar-val{position:absolute;right:6px;top:1px;font:400 12px/19px var(--mono);color:var(--ink-2)}
.bar-scale{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--ink-3);margin-top:4px}
.svg-scatter{max-width:480px;display:block}

/* ---------- class accordion in the index ---------- */
.fam-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--rule-2);
  padding:10px 13px;cursor:pointer;font-size:13.8px;font-weight:600;color:var(--ink);text-align:left;font-family:var(--sans)}
.fam-btn:first-child{border-top:0}
.fam-btn:hover{background:var(--sunk)}
.fam-btn.open{color:var(--signal-d)}
.fam-name{display:flex;align-items:baseline}
.fam-name:before{content:"";flex:none;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(-45deg) translateY(-2px);margin:0 11px 0 1px}
.fam-btn.open .fam-name:before{transform:rotate(45deg) translate(-2px,-1px)}
.fam-count{font:500 11.5px var(--mono);color:var(--ink-3);background:var(--sunk);border:1px solid var(--rule-2);border-radius:2px;padding:1px 6px}
.fam-items{padding:0 0 8px}
.fam-item{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:6px 13px 6px 30px;font-size:14px;
  color:var(--ink-2);border-left:2px solid transparent;line-height:1.35;font-family:var(--sans)}
.fam-item:hover{background:var(--sunk);color:var(--ink)}
.fam-item[aria-current=true]{border-left-color:var(--signal);color:var(--ink);font-weight:500;background:var(--signal-w)}

/* ---------- all-tests page ---------- */
.lede{color:var(--ink-2);margin:9px 0 18px;max-width:66ch;font-size:15px}
.cov h3{font-size:15px;display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.cov h3 .count{font:500 12px var(--mono);color:var(--ink-3)}
.cov .blurb{font-size:13.5px;color:var(--ink-3);margin-bottom:7px;line-height:1.45}
.cov section{margin-bottom:20px}
table.pairs td,table.pairs th{text-align:left;white-space:normal;vertical-align:top}
table.pairs tbody td{font-family:var(--sans);font-size:14px}
table.pairs tbody td:first-child{color:var(--ink);font-weight:500;width:32%}
table.pairs .linky{display:block;margin:0 0 4px}

/* ---------- counterpart strip, file button, table copy ---------- */
.counter{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:10px 13px;background:var(--sunk);border:1px solid var(--rule-2);border-radius:2px}
.counter-lab{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;margin-right:3px}
.chip{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:4px 10px;font-size:13.5px;cursor:pointer;color:var(--signal-d);font-family:var(--sans)}
.chip:hover{border-color:var(--signal);background:var(--signal-w)}
.counter-note{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.file-btn{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.file-btn input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file-btn:focus-within{outline:2px solid var(--signal);outline-offset:2px}
caption .copy-sm{float:right;padding:1px 8px;font-size:11.5px;font-weight:500;letter-spacing:0;margin:-2px 0 0 10px;background:var(--surface)}

/* ---------- Likert diverging bars ---------- */
.lk-row{display:grid;grid-template-columns:minmax(84px,27%) 36px 1fr 36px;gap:8px;align-items:center;margin-bottom:7px}
.lk-track{position:relative;height:22px;background:var(--sunk);border:1px solid var(--rule-2)}
.lk-seg{position:absolute;top:0;bottom:0}
.lk-mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink)}
.lk-num{font:400 12px var(--mono);color:var(--ink-2)}
.lk-l{text-align:right}
.lk-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:11px;font:400 12px var(--mono);color:var(--ink-3);padding-left:calc(27% + 52px)}
.lk-legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
.lk-end{font-family:var(--sans);font-size:12px}
.svg-curve{max-width:520px;display:block}

/* ---------- concepts ---------- */
.concept{border-top:1px solid var(--rule-2);padding:16px 0 14px}
.concept h3{font-size:17px;margin-bottom:6px;letter-spacing:-.01em}
.concept p{max-width:72ch;color:var(--ink-2);font-size:15px}
.concept .practice{background:var(--sunk);border-left:3px solid var(--signal);padding:9px 13px;border-radius:0 2px 2px 0;color:var(--ink);margin-top:8px}
.related{font-size:13.5px;color:var(--ink-3);margin-top:9px}

/* ---------- results log ---------- */
.log-item{border-top:1px solid var(--rule-2);padding:14px 0}
.log-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.log-name{font-weight:600;font-size:15px;color:var(--ink)}
.log-time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.log-stats{font:400 12.8px/1.5 var(--mono);color:var(--ink-2);margin-bottom:8px;word-break:break-word}
.apa-sm{font-size:12.8px;padding:10px 12px;margin:0}
.empty{color:var(--ink-3)}

/* ---------- footer mark ---------- */
.foot-mark{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-2);font-size:12.5px;color:var(--ink-3);letter-spacing:.01em}

{
  id: 'partial_corr', name: 'Partial correlation', family: 'param',

  purpose: 'Correlation between two variables with one or more covariates held constant.',

  assumptions: ['Linear relationships throughout.', 'Multivariate normality.'],

  run: function (d) {

{

{
  id: 'mannwhitney', name: 'Mann–Whitney U test', family: 'nonparam',
  tags: ['nonparametric', 'two groups', 'rank', 'ordinal', 'Likert', 'Wilcoxon rank-sum'],
  purpose: 'Compare two independent groups without assuming normality.',
  when: 'Ordinal outcomes, Likert items, small samples, or skewed continuous data. The default two-group test in most design research.',
  assumptions: ['Independent groups.', 'At least ordinal measurement.', 'To read the result as a median difference, the two distributions must have a similar shape. Otherwise it tests stochastic dominance — whether values in one group tend to exceed the other.'],
  input: { kind: 'groups', label: 'One column per group (exactly 2)', min: 2, max: 2 },

{

{
  id: 'kruskal', name: 'Kruskal–Wallis H test', family: 'nonparam',
  tags: ['nonparametric', 'three groups', 'rank', 'ordinal', 'Dunn'],
  purpose: 'Compare three or more independent groups on ranks.',
  when: 'The non-parametric one-way ANOVA. Ideal for comparing students, practitioners and educators on ordinal ratings.',
  assumptions: ['Independent groups.', 'At least ordinal measurement.', 'Similar distribution shapes if you want to read it as a median comparison.'],
  input: { kind: 'groups', label: 'One column per group', min: 2 },
  options: [{ id: 'post', type: 'select', label: 'Post-hoc', choices: ['Dunn with Holm adjustment', 'Dunn with Benjamini–Hochberg', 'Dunn unadjusted', 'none'], def: 0 }],
  run: function (d, o) {
    var k = d.groups.length, all = [], sizes = [], post = o.post == null ? 0 : o.post;
    if (k < 2) H.fail('Kruskal–Wallis needs at least two groups.');

    });

    for (var i2 = 0; i2 < k; i2++) Hstat += Rsum[i2] * Rsum[i2] / sizes[i2];

      apa: 'H(' + df + ') = ' + H.num(Hc, 2) + ', ' + H.pr(p) + ', ε² = ' + H.num(eps2, 3)

{
  id: 'friedman', name: 'Friedman test', family: 'nonparam',
  tags: ['nonparametric', 'repeated', 'related', 'rank', 'within subjects'],
  purpose: 'Compare three or more related conditions on ranks.',
  when: 'Every participant rated all the methods, and the ratings are ordinal.',
  assumptions: ['Same participants across all conditions.', 'At least ordinal measurement.', 'No missing cells.'],
  input: { kind: 'wide', label: 'One row per participant, one column per condition', numeric: true, min: 2 },
  options: [{ id: 'post', type: 'select', label: 'Post-hoc', choices: ['Conover with Holm adjustment', 'Nemenyi', 'none'], def: 0 }],
  run: function (d, o) {
    var k = d.groups.length, n = d.groups[0].length, i, j, post = o.post == null ? 0 : o.post;
    d.groups.forEach(function (g) { if (g.length !== n) H.fail('Every condition must have the same number of rows.'); });
    if (k < 2) H.fail('The Friedman test needs at least two conditions.');
    var rankSums = new Array(k), A1 = 0;
    for (j = 0; j < k; j++) rankSums[j] = 0;
    var rowRanks = [];
    for (i = 0; i < n; i++) {
      var row = []; for (j = 0; j < k; j++) row.push(d.groups[j][i]);
      var rr = S.rank(row);
      rowRanks.push(rr);
      for (j = 0; j < k; j++) { rankSums[j] += rr[j]; A1 += rr[j] * rr[j]; }
    }
    var T = 0; for (j = 0; j < k; j++) T += rankSums[j] * rankSums[j];
    var stat = (12 * T / (n * k * (k + 1))) - 3 * n * (k + 1);
    var tieSum = 0;
    rowRanks.forEach(function (rr2) { (rr2.tieGroups || []).forEach(function (t) { tieSum += t * t * t - t; }); });
    var corr = 1 - tieSum / (n * (k * k * k - k));

        var pp, z;
        if (post === 0) {

          pp = S.tTwoTail(tval, (n - 1) * (k - 1));
          raw.push(pp);
          ph.push([d.names[i] + ' vs ' + d.names[j], H.num(rankSums[i] / n - rankSums[j] / n, 2), H.num(tval, 3), H.pfmt(pp), '']);
        } else {
          z = Math.abs(rankSums[i] - rankSums[j]) / Math.sqrt(n * k * (k + 1) / 6);
          pp = S.ptukeySF(z * Math.SQRT2, k, Infinity);
          ph.push([d.names[i] + ' vs ' + d.names[j], H.num(rankSums[i] / n - rankSums[j] / n, 2), H.num(z, 3), H.pfmt(pp), '—']);
        }

      if (post === 0) { var adj = adjustP(raw, 'holm'); ph.forEach(function (row2, ii) { row2[4] = H.pfmt(adj[ii]); }); }
    }

      stats: [H.stat('χ²', Q), H.stat('df', df, 0), H.pstat(p), H.stat('Participants', n, 0), H.stat('Conditions', k, 0)],
      p: p,
      effects: [H.eff('Kendall’s W', W, 3, W < 0.3 ? 'weak' : W < 0.5 ? 'moderate' : 'strong')],
      flags: (n < 10 ? [H.flag('info', 'With ' + n + ' participants the chi-square approximation is rough. Report the mean ranks and be cautious with borderline p-values.')] : []).concat(capF ? [H.pairCap(k, 'conditions')] : []),
      tables: [
        { title: 'Conditions', head: ['Condition', 'Mdn', 'IQR', 'Mean rank'], rows: d.groups.map(function (g, ii) {
          return [d.names[ii], H.num(S.median(g), 2), H.num(S.iqr(g), 2), H.num(rankSums[ii] / n, 2)]; }) }
      ].concat(ph.length ? [{ title: 'Post-hoc: ' + (post === 0 ? 'Conover' : 'Nemenyi'), head: ['Comparison', 'Mean rank difference', post === 0 ? 't' : 'z', 'p (raw)', 'p (adjusted)'], rows: ph }] : []),
      apa: 'χ²(' + df + ') = ' + H.num(Q, 2) + ', ' + H.pr(p) + ', Kendall’s W = ' + H.num(W, 3)
    };
  },
  next: function (r) {
    if (r.p < 0.05) return [{ title: 'Report mean ranks with the post-hoc', body: 'Readers cannot interpret a Friedman result without seeing the mean rank per condition.' },
      { title: 'Interval data and sphericity satisfied?', body: 'A repeated-measures ANOVA would have more power.', testId: 'anova_rm' }];
    return [];
  }
},
{
  id: 'sign_test', name: 'Sign test', family: 'nonparam',

{

{
  id: 'moods_median', name: "Mood's median test", family: 'nonparam',

},
{
  id: 'ks_two', name: 'Two-sample Kolmogorov–Smirnov test', family: 'nonparam',
  tags: ['distribution', 'nonparametric', 'shape', 'two groups'],
  purpose: 'Test whether two samples come from the same distribution — in shape as well as location.',
  when: 'When a difference in spread or shape matters as much as a difference in centre.',
  assumptions: ['Independent samples.', 'Continuous data — heavy ties make the test conservative.'],
  input: { kind: 'groups', label: 'One column per group (exactly 2)', min: 2, max: 2 },
  run: function (d) {
    var x = Float64Array.from(d.groups[0]).sort(), y = Float64Array.from(d.groups[1]).sort();
    var n1 = x.length, n2 = y.length;
    if (n1 < 1 || n2 < 1) H.fail('Each group needs at least one value.');
    // largest gap between the two empirical CDFs, in one merge pass
    var i = 0, j = 0, D = 0;
    while (i < n1 || j < n2) {
      var v = Math.min(i < n1 ? x[i] : Infinity, j < n2 ? y[j] : Infinity);
      while (i < n1 && x[i] <= v) i++;
      while (j < n2 && y[j] <= v) j++;
      D = Math.max(D, Math.abs(i / n1 - j / n2));
    }
    var all = Float64Array.from(d.groups[0].concat(d.groups[1])).sort(), tied = false;
    for (i = 1; i < all.length; i++) if (all[i] === all[i - 1]) { tied = true; break; }
    var exact = !tied && n1 * n2 < 10000, p;
    if (exact) p = Math.max(0, Math.min(1, 1 - S.psmirnov2x(D, n1, n2)));
    else {

      var lam = Math.sqrt(n1 * n2 / (n1 + n2)) * D;
      p = 0;
      for (var k = 1; k <= 100; k++) p += 2 * Math.pow(-1, k - 1) * Math.exp(-2 * k * k * lam * lam);
      p = Math.max(0, Math.min(1, lam < 0.2 ? 1 : p));

    var flags = [H.flag('info', 'A significant result means the distributions differ somewhere — location, spread or shape. It does not tell you which. Plot both cumulative distributions before interpreting.')];
    if (tied) flags.push(H.flag('warn', 'Tied values are present, so the p-value uses the asymptotic distribution and is conservative. The KS test is designed for continuous data.'));
    return {
      stats: [H.stat('D', D, 4), H.pstat(p), H.stat('n₁, n₂', n1 + ', ' + n2), H.stat('Method', exact ? 'exact' : 'asymptotic')],
      p: p,

},

{

    var diffs = x.map(function (v) { return v - mu; });
    var w = X.wilcoxonCore(diffs, o.alt);
    if (!w) throw new Error('Every value equals the reference (' + mu + '), so there is nothing to test.');
    var above = diffs.filter(function (v) { return v > 0; }).length, below = diffs.filter(function (v) { return v < 0; }).length;
    var pSign = o.alt === 0 ? X.binomTwo(above, above + below) : o.alt === 1 ? X.binomUpper(above, above + below) : X.binomUpper(below, above + below);
    var flags = [];
    if (w.zeros) flags.push(H.flag(w.zeros > x.length / 3 ? 'warn' : 'info', w.zeros + ' of ' + x.length + ' values equal the reference and were dropped, leaving n = ' + w.n + '. Report both numbers.'));
    if (w.tied) flags.push(H.flag('info', 'Tied values are present, so the p-value uses the normal approximation with tie and continuity corrections.'));
    if (w.n > 3 && Math.abs(S.skewness(diffs)) > 1.5) flags.push(H.flag('warn', 'The values are lopsided around the reference (skew = ' + H.num(S.skewness(diffs), 2) + '). Lean on the sign test below, which does not assume symmetry.'));
    var hl = mu + X.hlOne(diffs);
    return {
      stats: [H.stat('V (W⁺)', w.Wp, 1), H.stat('Median', S.median(x)), H.stat('Reference', mu, 2), H.stat('z', w.z), H.pstat(w.p),
              H.stat('n used', w.n, 0, w.zeros ? w.zeros + ' at the reference, dropped' : null), H.stat('Method', w.exact ? 'exact' : 'normal approximation')],
      p: w.p, flags: flags,
      effects: [H.eff('Rank-biserial r', w.rb, 3, H.magnitude('r', w.rb)), H.eff('Hodges–Lehmann estimate', hl, 3, 'pseudo-median of the data')],
      tables: [{ title: 'Robustness check: sign test', head: ['Above reference', 'Below reference', 'At reference', 'Exact p'],
                 rows: [[String(above), String(below), String(x.length - above - below), H.pfmt(pSign)]] }],
      apa: 'One-sample Wilcoxon signed-rank test against ' + mu + ': V = ' + H.num(w.Wp, 1) + ', z = ' + H.num(w.z, 2) + ', ' + H.pr(w.p) +
        ', r = ' + H.num(w.rb, 2) + ' (Mdn = ' + H.num(S.median(x), 2) + ', n = ' + x.length + ')'
    };
  },
  next: function (r) {
    return [
      { title: 'A whole questionnaire of items?', body: 'Likert item analysis runs this test for every item at once, draws the distributions and corrects for multiple testing.', testId: 'likert' },
      { title: 'Data roughly normal?', body: 'The one-sample t-test is the parametric counterpart, with a little more power when its assumptions hold.', testId: 'ttest_one' },
      { title: 'Comparing two groups on the same item', body: 'Mann–Whitney U compares, say, students with practitioners on one rating.', testId: 'mannwhitney' }
    ];
  }
},
{
  id: 'brunner_munzel', name: 'Brunner–Munzel test', family: 'nonparam',
  tags: ['two groups', 'unequal variances', 'stochastic superiority', 'robust', 'Mann-Whitney alternative', 'non-parametric'],
  purpose: 'Compare two independent groups on ranks without assuming they share the same shape or spread.',
  when: 'Where you would use Mann–Whitney, but the groups clearly differ in spread: one group answers consistently while the other is split. Mann–Whitney loses its footing there; Brunner–Munzel does not.',
  assumptions: ['Independent groups.', 'At least ordinal data.', 'About 10 or more per group for the t approximation. Below that, prefer a permutation test.'],
  input: { kind: 'groups', label: 'One column per group (exactly 2)', min: 2, max: 2 },
  options: [{ id: 'alt', type: 'select', label: 'Alternative', choices: ['two-sided', 'group 1 tends to score higher', 'group 1 tends to score lower'], def: 0 }],
  run: function (d, o) {
    var x = d.groups[0], y = d.groups[1];
    if (x.length < 2 || y.length < 2) throw new Error('Each group needs at least two values.');
    var bm = X.brunnerMunzel(x, y, o.alt);
    var sup = 1 - bm.pXY;
    if (bm.degenerate) {
      if (bm.pXY > 0 && bm.pXY < 1) H.fail('Within each group all values are identical, so the Brunner–Munzel variance is zero and the statistic is undefined. Compare the groups descriptively, or use Mann–Whitney.');
      H.fail('The two groups do not overlap at all (every value in one group is above every value in the other), so the Brunner–Munzel statistic is undefined. Complete separation is itself strong evidence: report it with an exact Mann–Whitney or permutation p-value.');
    }
    var flags = [];
    if (Math.min(x.length, y.length) < 10) flags.push(H.flag('warn', 'At least one group has fewer than 10 values. The t approximation is rough at this size; the permutation test gives an exact answer.'));

      stats: [H.stat('W (BM)', bm.W), H.stat('df', bm.df, 2), H.pstat(bm.p),

              H.stat('Mdn₂ (IQR)', H.num(S.median(y), 2) + ' (' + H.num(S.iqr(y), 2) + '), n = ' + y.length)],
      p: bm.p, flags: flags,
      effects: [H.eff('P(' + n1 + ' > ' + n2 + ')', sup, 3, 'ties count half; 0.5 means no tendency')],
      apa: 'Brunner–Munzel test: W = ' + H.num(bm.W, 2) + ', df = ' + H.num(bm.df, 1) + ', ' + H.pr(bm.p) +
        '; the probability that a randomly chosen ' + n1 + ' value exceeds a ' + n2 + ' value was ' + H.num(sup, 2)
    };
  },
  next: function () {
    return [
      { title: 'Very small groups?', body: 'A permutation test gives an exact p-value without leaning on the t approximation.', testId: 'perm_test' },
      { title: 'Spreads similar after all?', body: 'Mann–Whitney U is the familiar report and is fine when the shapes match.', testId: 'mannwhitney' }
    ];
  }
},
{
  id: 'perm_test', name: 'Permutation test (two groups)', family: 'nonparam',
  tags: ['permutation', 'randomisation', 'exact', 'small sample', 'distribution-free', 'two groups', 'usability', 'non-parametric'],
  purpose: 'Compare two independent groups by reshuffling the group labels, so the p-value comes from your own data rather than an assumed distribution.',
  when: 'Small samples, such as a usability study with eight people per condition, where normality cannot be checked and you want an exact p-value for a difference in means or medians.',
  assumptions: ['Under the null hypothesis the group labels are exchangeable. Random assignment to conditions makes this true.', 'Independent observations.'],
  caution: 'A permutation test on means is still pulled around by outliers, because the mean is. Switch the statistic to the median if one extreme value dominates.',
  input: { kind: 'groups', label: 'One column per group (exactly 2)', min: 2, max: 2 },
  options: [
    { id: 'stat', type: 'select', label: 'Statistic', choices: ['difference in means', 'difference in medians'], def: 0 },
    { id: 'alt', type: 'select', label: 'Alternative', choices: ['two-sided', 'group 1 larger', 'group 1 smaller'], def: 0 }],
  run: function (d, o) {
    var x = d.groups[0], y = d.groups[1];
    if (x.length < 2 || y.length < 2) throw new Error('Each group needs at least two values.');
    var med = o.stat === 1, pt = X.permTest(x, y, med, o.alt, 20260923);
    var what = med ? 'medians' : 'means', sup = X.cles(x, y);
    var flags = [];
    flags.push(H.flag('info', pt.exact ? 'Exact: all ' + fmtInt(pt.count) + ' ways of splitting the data into groups of ' + x.length + ' and ' + y.length + ' were evaluated.'

        (pt.count < 2000 ? ' The number of splits was limited to keep the page responsive; with samples this large, Mann–Whitney U or Welch’s t-test gives practically the same answer.' : '')));
    return {
      stats: [H.stat('Difference in ' + what, pt.obs), H.pstat(pt.p),
              H.stat(med ? 'Mdn₁ / Mdn₂' : 'M₁ / M₂', med ? H.num(S.median(x), 2) + ' / ' + H.num(S.median(y), 2) : H.num(S.mean(x), 2) + ' / ' + H.num(S.mean(y), 2)),
              H.stat('n₁ / n₂', x.length + ' / ' + y.length),
              H.stat('Method', pt.exact ? 'exact enumeration' : 'Monte Carlo, ' + fmtInt(pt.count))],
      p: pt.p, flags: flags,
      effects: [H.eff('Probability of superiority', sup, 3, 'chance a group 1 value exceeds a group 2 value'),
                H.eff('Hodges–Lehmann shift', X.hlTwo(x, y), 3, 'median of all pairwise differences')],
      apa: 'A permutation test on the difference in ' + what + ' (' + (pt.exact ? 'exact, ' + fmtInt(pt.count) + ' permutations' : fmtInt(pt.count) + ' random permutations') +
        ') gave a difference of ' + H.num(pt.obs, 2) + ', ' + H.pr(pt.p)
    };

  next: function () {
    return [
      { title: 'Report the conventional test too', body: 'Reviewers often expect Mann–Whitney U or a Welch t-test. Agreement between them and this test is reassuring.', testId: 'mannwhitney' },
      { title: 'Check what the study could detect', body: 'With samples this small, a sensitivity analysis shows the smallest effect you had a fair chance of finding.', testId: 'power' }

  }
},
{
  id: 'jonckheere', name: 'Jonckheere–Terpstra trend test', family: 'nonparam',

  purpose: 'Test whether scores rise (or fall) across groups that have a natural order, such as novice, intermediate and expert.',

      apa: 'A Jonckheere–Terpstra test for ordered alternatives: J = ' + H.num(jt.J, 1) + ', z = ' + H.num(jt.z, 2) + ', ' + H.pr(jt.p) +

  }
},

  }
},

  }
},

{
  id: 'likert', name: 'Likert item analysis', family: 'scales',
  tags: ['Likert', 'questionnaire', 'survey', 'items', 'agreement', 'diverging bars', 'neutral', 'ordinal'],
  purpose: 'Summarise every Likert item at once: its distribution, median, share agreeing and disagreeing, and a test of each item against the neutral point.',
  when: 'Survey items read one at a time, which is how design-research questionnaires are usually analysed: "The method library was easy to search", and so on.',
  assumptions: ['Each item is ordinal, so medians and distributions are reported rather than means.', 'All items share one response scale.', 'Respondents answered independently.'],
  caution: 'Testing many items inflates false positives. The correction is on by default; if you switch it off, say so in the write-up.',
  input: { kind: 'items', label: 'One row per respondent, one column per item, numeric responses (e.g. 1–5). Blank cells are allowed.', numeric: true, cols: 1 },
  options: [
    { id: 'scale', type: 'select', label: 'Response scale', choices: ['Detect from data', '1–5', '1–7', '1–4', '1–6', '0–10'], def: 0 },
    { id: 'ref', type: 'number', label: 'Reference value (blank = scale midpoint)', def: '', step: 'any' },
    { id: 'adj', type: 'select', label: 'Correction across items', choices: ['Benjamini–Hochberg', 'Holm', 'none'], def: 0 }],
  run: function (d, o) {
    var M = d.matrix, w = M[0].length, i, j;
    var cols = [];
    for (j = 0; j < w; j++) {
      var c = [];
      for (i = 0; i < M.length; i++) { var s = M[i][j]; if (s !== '' && s != null && isFinite(parseFloat(s))) c.push(parseFloat(s)); }
      cols.push(c);
    }
    var all = [];
    cols.forEach(function (c) { for (var q = 0; q < c.length; q++) all.push(c[q]); });
    if (!all.length) throw new Error('No numeric responses found.');

    var mn = S.min(all), mx = S.max(all);
    var SC = [null, [1, 5], [1, 7], [1, 4], [1, 6], [0, 10]][o.scale || 0], lo, hi, flags = [];
    if (SC) {

    }
    var ref = (o.ref === '' || o.ref == null || isNaN(o.ref)) ? (lo + hi) / 2 : +o.ref;

    if (hi - lo > 20) flags.push(H.flag('info', 'The responses run from ' + lo + ' to ' + hi + ', which looks like a slider or score rather than Likert categories. The tests still apply; the distribution chart is skipped.'));
    var cats = [];
    if (whole) for (var v = lo; v <= hi; v++) cats.push(v);
    else flags.push(H.flag('info', 'Some values are not whole numbers, so these look like averaged scale scores rather than item responses. The distribution chart is skipped.'));
    var items = [], chart = [];
    cols.forEach(function (c, jj) {
      if (!c.length) return;
      var wc = X.wilcoxonCore(c.map(function (x) { return x - ref; }), 0);
      items.push({
        name: d.names[jj] || ('Item ' + (jj + 1)), n: c.length, c: c, w: wc, p: wc ? wc.p : 1,
        below: c.filter(function (x) { return x < ref; }).length, at: c.filter(function (x) { return x === ref; }).length,
        above: c.filter(function (x) { return x > ref; }).length
      });
      if (whole) chart.push({ name: d.names[jj] || ('Item ' + (jj + 1)), pct: cats.map(function (k) { return 100 * c.filter(function (x) { return x === k; }).length / c.length; }) });
    });
    var meth = ['bh', 'holm', null][o.adj || 0], qLab = ['q (BH)', 'p (Holm)', null][o.adj || 0];
    var ps = items.map(function (it) { return it.p; }), qs = meth ? adjustP(ps, meth) : ps.slice();
    var up = 0, down = 0;

    } else if (m === 6) {
      var F = +o.F, d1 = +o.df1, d2 = +o.df2;
      need(F >= 0 && d1 >= 1 && d2 >= 1, 'Enter F and both degrees of freedom.');
      need(F <= 1e6, 'An F of ' + F + ' is implausibly large; check the value.');

      lead = [H.stat('Partial η²', ep, 3), H.stat("Cohen's f", f6, 3)];
      if (d1 === 1) {

      apa = 'χ² = ' + H.num(chi, 2) + ' with N = ' + NN + ' corresponds to w = ' + H.num(w, 2) + ' and V = ' + H.num(V, 2);
    } else {
      var z = +o.z, N8 = +o.N;
      need(isFinite(z) && N8 >= 2, 'Enter z and N.');

      row("Cohen's d", d8, 3, '2r / √(1 − r²)', 'd');
      lead = [H.stat('r', r8, 3), H.stat("Cohen's d", d8, 3)];

      stats: lead, p: null, flags: flags,
      tables: [{ title: 'Conversions', head: ['Measure', 'Value', 'Formula', 'Conventional reading'], rows: rows }],
      apa: apa

  next: function () {
    return [{ title: 'Plan a sample size', body: 'Carry the converted effect into a power analysis.', testId: 'power' }];
  }
}
];

  /* ---------------- results log ---------------- */
  function logText() {
    return state.log.slice().reverse().map(function (e) { return e.name + ' (' + fmtTime(e.at) + ')\n' + (e.apa || ''); }).join('\n\n');
  }
  function logMarkdown() {
    var lines = ['# Results log', '', 'Exported ' + fmtTime(new Date().toISOString()), ''];
    state.log.slice().reverse().forEach(function (e) {
      lines.push('## ' + e.name, '', '*' + fmtTime(e.at) + '*', '');
      (e.stats || []).forEach(function (s) { lines.push('- ' + s); });
      if (e.apa) lines.push('', '> ' + e.apa);
      lines.push('');
    });
    lines.push('---', '', 'Exported from Design Research Statistics · ' + COPYRIGHT, '');
    return lines.join('\n');
  }
  function downloadLog() {
    try {
      var url = URL.createObjectURL(new Blob([logMarkdown()], { type: 'text/markdown;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url; a.download = 'results-log.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) { state.error = 'This browser blocked the download. Use Copy all instead.'; render(); }
  }
  function renderLog() {
    var p = el('div', 'panel');
    p.appendChild(el('h2', null, 'Results log'));
    p.appendChild(el('p', 'lede', 'Every test you run is kept here, newest first, so you can assemble a results section from it. It is stored in this browser only.'));

    };

  function selectField(label, choices, value, onchange) {
    var fd = el('div', 'field');
    var id = 'f' + Math.random().toString(36).slice(2, 9);
    var lb = el('label', null, label);
    lb.htmlFor = id;
    fd.appendChild(lb);
    var sel = document.createElement('select');
    sel.id = id;
    choices.forEach(function (c, i) {
      var op = document.createElement('option');
      op.value = String(i); op.textContent = c;
      if (i === value) op.selected = true;
      sel.appendChild(op);
    });
    sel.onchange = function () { onchange(parseInt(sel.value, 10)); };
    fd.appendChild(sel);
    return fd;
  }
  function numberField(label, value, attrs, onchange) {
    var fd = el('div', 'field');
    var id = 'f' + Math.random().toString(36).slice(2, 9);
    var lb = el('label', null, label);
    lb.htmlFor = id;
    fd.appendChild(lb);
    var inp = document.createElement('input');
    inp.type = 'number'; inp.id = id;
    if (attrs.min != null) inp.min = attrs.min;
    if (attrs.max != null) inp.max = attrs.max;
    inp.step = attrs.step || 'any';
    inp.value = value == null ? '' : value;
    inp.oninput = function () { onchange(inp.value === '' ? null : parseFloat(inp.value)); };
    fd.appendChild(inp);
    return fd;
  }

  function readFile(f, kind) {
    if (!f) return;
    if (/\.(xlsx|xlsm|xls|ods|numbers)$/i.test(f.name)) {
      state.result = null;
      state.error = 'Spreadsheet files can’t be read directly. Select the cells in your spreadsheet, copy them, and paste them into the box.';
      render();
      return;
    }
    if (f.size > 20 * 1024 * 1024) {
      state.result = null;
      state.error = 'That file is larger than 20 MB. Open it in a spreadsheet and copy only the columns this test needs.';
      render();
      return;
    }
    // Read as UTF-8; Excel on Windows saves CSV in the ANSI code page, so retry as Windows-1252 if UTF-8 fails.
    function read(enc) {
      var rd = new FileReader();
      rd.onload = function () {
        var txt = String(rd.result || ''), head = txt.slice(0, 4096);
        var ctrl = (head.match(/[\u0000-\u0008\u000E-\u001F]/g) || []).length;
        if (/^(PK\u0003\u0004|%PDF|\u00D0\u00CF\u0011\u00E0)/.test(txt) || ctrl > 2) {
          state.result = null;
          state.error = 'That file is not plain text (it looks like a workbook, PDF or image). Save the sheet as CSV, or copy the cells and paste them into the box.';
          render();
          return;
        }
        if (!enc && txt.indexOf('\uFFFD') >= 0) { read('windows-1252'); return; }
        state.texts[kind] = txt; state.result = null; state.error = null; render();
      };
      rd.onerror = function () { state.error = 'That file could not be read.'; render(); };
      if (enc) rd.readAsText(f, enc); else rd.readAsText(f);
    }
    read(null);
  }

  function renderInput(t) {
    var box = el('div');
    box.appendChild(el('div', 'sep'));
    var kind = t.input.kind, grid = kind !== 'none' && kind !== 'kn' && kind !== 'kn2';

    if (kind === 'kn' || kind === 'kn2') {
      var fields = kind === 'kn'
        ? [['k', 'Successes'], ['n', 'Total']]
        : [['k1', 'Group 1 successes'], ['n1', 'Group 1 total'], ['k2', 'Group 2 successes'], ['n2', 'Group 2 total']];
      var row = el('div', 'field-row');
      fields.forEach(function (f) {
        row.appendChild(numberField(f[1], state.nums[f[0]], { min: 0, step: 1 }, function (v) { state.nums[f[0]] = v; }));
      });
      box.appendChild(row);
    } else if (grid) {
      box.appendChild(el('div', 'hint', t.input.label));
      var ta = document.createElement('textarea');
      ta.value = state.texts[kind] || '';
      ta.spellcheck = false;
      ta.setAttribute('aria-label', 'Data');
      ta.placeholder = 'Paste straight from a spreadsheet, or type values separated by tabs, commas or spaces.';
      ta.oninput = function () { state.texts[kind] = ta.value; scheduleNote(); };
      box.appendChild(ta);

      var ctl = el('div', 'field-row');
      ctl.style.marginTop = '10px';
      if (['groups', 'sample', 'paired', 'xy', 'wide', 'xyk', 'ratings', 'items'].indexOf(kind) >= 0) {
        ctl.appendChild(selectField('Layout', ['Columns are variables', 'Rows are variables'], state.grid.orient,
          function (v) { state.grid.orient = v; updateNote(); }));
      }
      ctl.appendChild(selectField('First row', ['Detect automatically', 'Is a header', 'Is data'], state.grid.header,
        function (v) { state.grid.header = v; updateNote(); }));
      ctl.appendChild(selectField('First column', ['Detect automatically', 'Is a label', 'Is data'], state.grid.rowlab,
        function (v) { state.grid.rowlab = v; updateNote(); }));
      box.appendChild(ctl);
      var note = el('div', 'parse-note');
      note.id = 'parse-note';
      box.appendChild(note);
    }

    if (t.options && t.options.length) {
      var st = state.opts[t.id] = state.opts[t.id] || {};
      t.options.forEach(function (o) { if (st[o.id] == null) st[o.id] = o.def; });
      var or = el('div', 'field-row');
      or.style.marginTop = '14px';
      t.options.forEach(function (o) {
        if (o.when && o.when.in.indexOf(st[o.when.id]) < 0) return;
        var drives = t.options.some(function (x) { return x.when && x.when.id === o.id; });
        if (o.type === 'select') {
          or.appendChild(selectField(o.label, o.choices, st[o.id], function (v) { st[o.id] = v; if (drives) { state.result = null; render(); } }));
        } else {
          or.appendChild(numberField(o.label, st[o.id], o, function (v) { st[o.id] = v; }));
        }
      });
      box.appendChild(or);
    }

    var br = el('div', 'btn-row');
    br.style.marginTop = '16px';
    var run = el('button', 'btn', 'Run');

    br.appendChild(run);
    if (EXAMPLES[t.id]) {
      var ex = el('button', 'btn btn-ghost', 'Load example');
      ex.onclick = function () {
        state.texts[kind] = EXAMPLES[t.id];
        state.grid = { orient: 0, header: 0, rowlab: 0 };
        state.result = null; state.error = null;
        render();
      };
      br.appendChild(ex);
    }
    if (grid) {
      var fl = el('label', 'btn btn-ghost file-btn');
      fl.appendChild(document.createTextNode('Open file'));
      var fi = document.createElement('input');
      fi.type = 'file';
      fi.accept = '.csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values';
      fi.setAttribute('aria-label', 'Open a CSV, TSV or text file');
      fi.onchange = function () { readFile(fi.files && fi.files[0], kind); };
      fl.appendChild(fi);
      br.appendChild(fl);
      if (state.texts[kind]) {
        var cl = el('button', 'btn btn-ghost', 'Clear');
        cl.onclick = function () { state.texts[kind] = ''; state.result = null; state.error = null; render(); };
        br.appendChild(cl);
      }
    }
    box.appendChild(br);
    return box;
  }

  var noteTimer = null;
  function scheduleNote() {
    clearTimeout(noteTimer);
    var t = BY_ID[state.testId], len = t ? (state.texts[t.input.kind] || '').length : 0;
    if (len < 20000) updateNote(); else noteTimer = setTimeout(updateNote, 350);
  }
  function updateNote() {
    var note = document.getElementById('parse-note');
    if (!note) return;
    var t = BY_ID[state.testId];
    if (!t) return;
    var text = state.texts[t.input.kind];
    if (!text || !text.trim()) { note.textContent = ''; return; }
    try {
      var d = P.build(t, text, state.grid, state.nums);
      note.textContent = 'Read: ' + P.describe(d) + (d.notes && d.notes.length ? '. ' + d.notes.join(' ') : '');
      note.classList.remove('bad');
    } catch (e) {

  function toTSV(tb) {
    return [tb.head].concat(tb.rows).map(function (r) {
      return r.map(function (c) { return String(c == null ? '' : c).replace(/[\t\n]+/g, ' '); }).join('\t');
    }).join('\n');
  }
  var MAX_ROWS = 500, MAX_BARS = 200;
  function fmtCount(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function renderTable(tb) {
    var w = el('div', 'tbl-wrap');
    var table = document.createElement('table');
    var cp = document.createElement('caption');
    var cb = el('button', 'copy copy-sm', 'Copy');
    cb.title = 'Copy as tab-separated text. It pastes into Excel or Word as a table.';
    cb.onclick = function () {
      copyText(toTSV(tb), function (ok) { cb.textContent = ok ? 'Copied' : 'Failed'; setTimeout(function () { cb.textContent = 'Copy'; }, 1400); });
    };
    cp.appendChild(cb);
    cp.appendChild(el('span', null, tb.title));
    table.appendChild(cp);
    var thead = document.createElement('thead'), tr = document.createElement('tr');
    tb.head.forEach(function (h) { tr.appendChild(el('th', null, h)); });
    thead.appendChild(tr);
    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    // a browser lays out a 100,000-row table for many seconds; show the head of it, copy still takes every row
    var shown = tb.rows.length > MAX_ROWS ? tb.rows.slice(0, MAX_ROWS) : tb.rows;
    shown.forEach(function (row) {
      var r2 = document.createElement('tr');
      row.forEach(function (c) { r2.appendChild(el('td', null, c)); });
      tbody.appendChild(r2);
    });
    if (shown.length < tb.rows.length) {
      var mr = document.createElement('tr'), mc = el('td', 'more', 'Showing the first ' + MAX_ROWS + ' of ' + fmtCount(tb.rows.length) + ' rows. Copy takes the whole table.');
      mc.colSpan = tb.head.length;
      mr.appendChild(mc);
      tbody.appendChild(mr);
    }
    table.appendChild(tbody);
    w.appendChild(table);
    return w;
  }

  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { cb(true); }, function () { fallback(); });
      return;
    }
    fallback();
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        cb(!!ok);
      } catch (e) { cb(false); }
    }
  }

  /* ---------------- charts ---------------- */
  function clamp01(v) { return !(v > 0) ? 0 : v > 1 ? 1 : v; }

  var NEG = ['#B9C3CB', '#8E9DA9', '#667884', '#45565F', '#2A3943'];
  var POS = ['#A9D0CC', '#72B2AC', '#41928C', '#1E6E6B', '#12504D'];
  function likertChart(L) {
    var wrap = el('div', 'chart');
    var refTxt = String(Math.round(L.ref * 100) / 100);
    wrap.appendChild(el('h4', null, 'RESPONSES, CENTRED ON ' + refTxt));
    var cats = L.cats, ref = L.ref;
    var maxD = Math.max(ref - cats[0], cats[cats.length - 1] - ref) || 1;
    function colour(c) {
      if (c === ref) return '#D5DCE2';
      var t = Math.abs(c - ref) / maxD, pal = c < ref ? NEG : POS;
      return pal[Math.min(pal.length - 1, Math.max(0, Math.round(t * (pal.length - 1))))];
    }
    L.items.forEach(function (it) {
      var row = el('div', 'lk-row');
      var lab = el('div', 'bar-lab', it.name);
      lab.title = it.name;
      row.appendChild(lab);
      var left = 0, below = 0, above = 0;
      cats.forEach(function (c, i) {
        if (c < ref) { left += it.pct[i]; below += it.pct[i]; }
        else if (c === ref) left += it.pct[i] / 2;
        else above += it.pct[i];
      });
      row.appendChild(el('span', 'lk-num lk-l', Math.round(below) + '%'));
      var track = el('div', 'lk-track');
      var x = 50 - left / 2;
      cats.forEach(function (c, i) {
        var w = it.pct[i] / 2;
        if (!(w > 0)) return;
        var seg = el('div', 'lk-seg');
        seg.style.left = x.toFixed(3) + '%';
        seg.style.width = w.toFixed(3) + '%';
        seg.style.background = colour(c);
        seg.title = c + ': ' + Math.round(it.pct[i]) + '%';
        track.appendChild(seg);
        x += w;
      });
      track.appendChild(el('div', 'lk-mid'));
      row.appendChild(track);
      row.appendChild(el('span', 'lk-num', Math.round(above) + '%'));
      wrap.appendChild(row);
    });
    var lg = el('div', 'lk-legend');
    lg.appendChild(el('span', 'lk-end', 'lower'));
    cats.forEach(function (c) {
      var s = el('span');
      var sw = el('i');
      sw.style.background = colour(c);
      s.appendChild(sw);
      s.appendChild(document.createTextNode(String(c)));
      lg.appendChild(s);
    });
    lg.appendChild(el('span', 'lk-end', 'higher'));
    wrap.appendChild(lg);
    return wrap;
  }

  function curveChart(C) {
    var wrap = el('div', 'chart');
    wrap.appendChild(el('h4', null, 'CUMULATIVE DISTINCT CODES BY INTERVIEW'));
    var W = 520, Hh = 270, padL = 44, padB = 40, padT = 14, padR = 16;
    var n = C.y.length, ymax = S.max(C.y) || 1, top = ymax * 1.1;
    function X(i) { return padL + (n > 1 ? (i - 1) / (n - 1) : 0.5) * (W - padL - padR); }
    function Y(v) { return Hh - padB - (v / top) * (Hh - padB - padT); }
    var g = [], i;
    g.push('<rect x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (Hh - padB - padT) + '" fill="#F5F7F9" stroke="#DDE3E8"/>');
    var bx = X(C.base);
    g.push('<rect x="' + padL + '" y="' + padT + '" width="' + Math.max(0, bx - padL).toFixed(1) + '" height="' + (Hh - padB - padT) + '" fill="#E4EEED"/>');
    g.push('<text x="' + (padL + 6) + '" y="' + (padT + 14) + '" font-size="10" fill="#1E6E6B">base</text>');
    [0, 0.5, 1].forEach(function (f) {
      var v = Math.round(ymax * f), y = Y(v).toFixed(1);
      g.push('<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#DDE3E8"/>');
      g.push('<text x="' + (padL - 7) + '" y="' + (+y + 4) + '" text-anchor="end" font-size="10" fill="#7E8D99">' + v + '</text>');
    });
    if (C.point) {
      var px = X(C.point);
      if (C.runTo) g.push('<rect x="' + px.toFixed(1) + '" y="' + padT + '" width="' + (X(C.runTo) - px).toFixed(1) + '" height="' + (Hh - padB - padT) + '" fill="#16212B" fill-opacity="0.06"/>');
      g.push('<line x1="' + px.toFixed(1) + '" y1="' + padT + '" x2="' + px.toFixed(1) + '" y2="' + (Hh - padB) + '" stroke="#16212B" stroke-dasharray="3 3"/>');
      var right = px > W - 150;
      g.push('<text x="' + (right ? px - 5 : px + 5).toFixed(1) + '" y="' + (padT + 28) + '" text-anchor="' + (right ? 'end' : 'start') + '" font-size="10.5" fill="#16212B">' + esc(C.label || '') + '</text>');
    }
    var pts = C.y.map(function (v, k) { return X(k + 1).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ');
    g.push('<polyline points="' + pts + '" fill="none" stroke="#1E6E6B" stroke-width="1.8"/>');
    for (i = 0; i < n; i++) g.push('<circle cx="' + X(i + 1).toFixed(1) + '" cy="' + Y(C.y[i]).toFixed(1) + '" r="3" fill="#1E6E6B"/>');
    var step = n <= 16 ? 1 : n <= 32 ? 2 : Math.ceil(n / 16);
    for (i = 1; i <= n; i += step) g.push('<text x="' + X(i).toFixed(1) + '" y="' + (Hh - padB + 14) + '" text-anchor="middle" font-size="10" fill="#7E8D99">' + i + '</text>');
    g.push('<text x="' + (padL + (W - padL - padR) / 2) + '" y="' + (Hh - 6) + '" text-anchor="middle" font-size="11" fill="#4A5C6A">Interview</text>');
    var d = el('div');
    d.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="100%" class="svg-curve" role="img" aria-label="Cumulative distinct codes by interview">' + g.join('') + '</svg>';
    wrap.appendChild(d);
    return wrap;
  }

  function scatterChart(s) {
    var wrap = el('div', 'chart');
    wrap.appendChild(el('h4', null, 'SCATTER'));
    var W = 480, Hh = 300, padL = 48, padB = 42, padT = 12, padR = 14;
    var xs = s.x, ys = s.y;
    var xmin = S.min(xs), xmax = S.max(xs);
    var ymin = S.min(ys), ymax = S.max(ys);
    var xr = (xmax - xmin) || 1, yr = (ymax - ymin) || 1;
    xmin -= xr * 0.07; xmax += xr * 0.07; ymin -= yr * 0.07; ymax += yr * 0.07;
    function X(v) { return padL + (v - xmin) / (xmax - xmin) * (W - padL - padR); }
    function Y(v) { return Hh - padB - (v - ymin) / (ymax - ymin) * (Hh - padB - padT); }
    var g = [];
    g.push('<rect x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (Hh - padB - padT) + '" fill="#F5F7F9" stroke="#DDE3E8"/>');
    for (var i = 0; i <= 4; i++) {
      var gy = padT + i * (Hh - padB - padT) / 4;

      g.push('<text x="' + (padL - 7) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="10" fill="#7E8D99">' + fmtAxis(ymax - i * (ymax - ymin) / 4) + '</text>');
    }
    if (s.line) {
      g.push('<line x1="' + X(xmin).toFixed(1) + '" y1="' + Y(s.line.b0 + s.line.b1 * xmin).toFixed(1) +
        '" x2="' + X(xmax).toFixed(1) + '" y2="' + Y(s.line.b0 + s.line.b1 * xmax).toFixed(1) + '" stroke="#A65A16" stroke-width="1.5"/>');
    }
    for (i = 0; i < xs.length; i++) {
      g.push('<circle cx="' + X(xs[i]).toFixed(1) + '" cy="' + Y(ys[i]).toFixed(1) + '" r="3.5" fill="#1E6E6B" fill-opacity="0.7"/>');
    }
    g.push('<text x="' + padL + '" y="' + (Hh - 24) + '" font-size="10" fill="#7E8D99">' + fmtAxis(xmin) + '</text>');
    g.push('<text x="' + (W - padR) + '" y="' + (Hh - 24) + '" text-anchor="end" font-size="10" fill="#7E8D99">' + fmtAxis(xmax) + '</text>');
    g.push('<text x="' + (padL + (W - padL - padR) / 2) + '" y="' + (Hh - 7) + '" text-anchor="middle" font-size="11" fill="#4A5C6A">' + esc(s.xn || 'x') + '</text>');
    g.push('<text x="12" y="' + (Hh / 2) + '" text-anchor="middle" font-size="11" fill="#4A5C6A" transform="rotate(-90 12 ' + (Hh / 2) + ')">' + esc(s.yn || 'y') + '</text>');
    var d = el('div');
    d.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" width="100%" class="svg-scatter" role="img" aria-label="Scatter plot">' + g.join('') + '</svg>';
    wrap.appendChild(d);
    return wrap;
  }
  function fmtAxis(v) {
    var a = Math.abs(v);
    if (a >= 1000 || (a < 0.01 && a > 0)) return v.toPrecision(3);
    return (Math.round(v * 100) / 100).toString();
  }

  /* ---------------- running a test ---------------- */
  function execute(t) {
    state.error = null;
    state.result = null;
    try {
      var d = P.build(t, state.texts[t.input.kind], state.grid, state.nums);
      state.lastData = d;
      var o = state.opts[t.id] = state.opts[t.id] || {};
      (t.options || []).forEach(function (op) {
        if (o[op.id] == null || (typeof o[op.id] === 'number' && isNaN(o[op.id]))) o[op.id] = op.def;
      });
      var r = t.run(d, o);
      r.flags = r.flags || [];
      (d.notes || []).forEach(function (nt) { r.flags.unshift({ level: 'info', text: nt }); });
      var lead = (r.stats || [])[0];
      if ((r.p != null && !(r.p >= 0 && r.p <= 1)) || (lead && (lead.v === '—' || lead.v === 'NaN'))) {
        throw new Error('These data do not allow this test to be computed: a quantity it needs is undefined (usually a group with a single value, or no variation at all). Check the "Read:" line under the data box, then try a test suited to the data.');
      }
      state.result = r;
      var entry = {
        id: t.id, name: t.name, at: new Date().toISOString(), apa: r.apa || '',
        stats: (r.stats || []).slice(0, 5).map(function (s) { return s.k + (/^[<>≤≥]/.test(String(s.v)) ? ' ' : ' = ') + s.v; })
      };
      if (state.log.length && state.log[0].id === t.id) state.log[0] = entry; else state.log.unshift(entry);
      saveLog();
    } catch (e) {
      state.error = (e && e.message) ? e.message : String(e);
    }
    refreshResult(t);
    var target = document.querySelector('.readout, .err');
    if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ---------------- index rail ---------------- */
  function renderRail() {
    var rail = el('nav', 'rail');
    rail.setAttribute('aria-label', 'Test index');
    var sw = el('div', 'rail-search');
    var inp = document.createElement('input');
    inp.type = 'search';
    inp.placeholder = 'Search ' + TESTS.length + ' tests…';
    inp.value = state.query;
    inp.setAttribute('aria-label', 'Search tests');
    inp.oninput = function () { state.query = inp.value; refreshRail(); };
    sw.appendChild(inp);
    rail.appendChild(sw);
    var list = el('div', 'rail-list');
    list.id = 'rail-list';
    rail.appendChild(list);
    fillRail(list);
    return rail;
  }
  function refreshRail() {
    var list = document.getElementById('rail-list');
    if (!list) return;
    list.innerHTML = '';
    fillRail(list);
  }
  function fillRail(list) {
    var q = state.query.trim().toLowerCase(), found = 0;
    FAMILIES.forEach(function (f) {
      var all = testsIn(f.id);
      var items = q ? all.filter(function (t) {
        return (t.name + ' ' + (t.tags || []).join(' ') + ' ' + t.purpose + ' ' + (t.when || '') + ' ' + f.label).toLowerCase().indexOf(q) >= 0;
      }) : all;
      if (q && !items.length) return;
      found += items.length;
      var isOpen = q ? true : state.openFam === f.id;
      var hb = el('button', 'fam-btn' + (isOpen ? ' open' : ''));
      hb.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      hb.appendChild(el('span', 'fam-name', f.label));
      hb.appendChild(el('span', 'fam-count', String(items.length)));
      hb.onclick = function () { if (q) return; state.openFam = isOpen ? null : f.id; refreshRail(); };
      list.appendChild(hb);
      if (!isOpen) return;
      var box = el('div', 'fam-items');
      items.forEach(function (t) {
        var b = el('button', 'fam-item', t.name);
        if (t.id === state.testId && state.view === 'test') b.setAttribute('aria-current', 'true');
        b.onclick = function () { open(t.id); };
        box.appendChild(b);
      });
      list.appendChild(box);
    });
    if (!found) list.appendChild(el('div', 'rail-empty', 'Nothing matches that. Try a plainer word: agreement, two groups, ordinal, Likert, themes.'));
  }

  /* ---------------- shell ---------------- */
  var MODES = [['guide', 'Guide me', ''], ['coverage', 'All tests', 'all'], ['concepts', 'Concepts', 'concepts'], ['log', 'Log', 'log']];
  function render() {

    var foot = el('footer', 'foot');
    foot.appendChild(el('p', null,
      'Everything is computed in this page. Your data is never uploaded, and the file keeps working with the network off. ' +
      'The numerical routines are checked against SciPy, statsmodels and other published implementations, but for anything going into a thesis or a submission, confirm the headline figures in a second package.'));
    foot.appendChild(el('div', 'foot-mark', COPYRIGHT));
    app.appendChild(foot);

    if (state.view === 'test') updateNote();
  }

  window.addEventListener('popstate', function () { fromHash(); render(); });
  window.addEventListener('hashchange', function () { fromHash(); render(); });
  fromHash();
  render();
})();
</script>
</body>
