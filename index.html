<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Research Statistics — tests for qualitative and quantitative design science</title>
<meta name="description" content="Inter-coder agreement and quantitative inference for design research. Runs entirely in the browser, recommends a test, and tells you what to do with the result.">
<meta name="color-scheme" content="light">
<meta name="author" content="Mayank Mayookh">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23EEF1F4'/><rect x='6' y='17' width='4' height='9' fill='%231E6E6B'/><rect x='14' y='11' width='4' height='15' fill='%231E6E6B'/><rect x='22' y='6' width='4' height='20' fill='%23A65A16'/></svg>">
<style>:root{
  --paper:#EEF1F4;
  --surface:#FFFFFF;
  --sunk:#F5F7F9;
  --ink:#16212B;
  --ink-2:#4A5C6A;
  --ink-3:#7E8D99;
  --rule:#C3CCD4;
  --rule-2:#DDE3E8;
  --signal:#1E6E6B;
  --signal-d:#144B49;
  --signal-w:#E4EEED;
  --flag:#A65A16;
  --flag-w:#FBF0E4;
  --ok:#2F6B3D;
  --r:3px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.011em;line-height:1.25}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:var(--signal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- masthead ---------- */
.masthead{
  border-bottom:1px solid var(--rule);background:var(--surface);
  position:sticky;top:0;z-index:40;
}
.masthead-in{
  max-width:1240px;margin:0 auto;padding:14px 22px;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
}
.wordmark{font-size:19px;font-weight:600;letter-spacing:-.02em;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.wordmark span{color:var(--signal)}
.tagline{font-size:13.5px;color:var(--ink-3);flex:1;min-width:180px}
.modes{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:var(--r);border:1px solid var(--rule-2)}
.modes button{
  background:none;border:0;padding:6px 13px;border-radius:2px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--ink-2);
}
.modes button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(22,33,43,.12)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:282px minmax(0,1fr);gap:22px;align-items:start}
.shell.solo{grid-template-columns:minmax(0,1fr);max-width:860px}

/* ---------- index rail ---------- */
.rail{position:sticky;top:76px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
.rail-search{padding:11px;border-bottom:1px solid var(--rule-2)}
.rail-search input{
  width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;
  font:inherit;font-size:14px;background:var(--sunk);
}
.rail-list{max-height:calc(100vh - 190px);overflow-y:auto;padding:6px 0 10px}
.rail-empty{padding:16px 13px;font-size:13.5px;color:var(--ink-3)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:22px;margin-bottom:16px}
.panel-tight{padding:16px 18px}

/* ---------- decision path (signature) ---------- */
.path{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.path-head{padding:22px 24px 6px}
.path-head h2{font-size:22px;letter-spacing:-.02em}
.path-head p{color:var(--ink-2);font-size:15px;max-width:62ch;margin-top:7px}
.rail-steps{padding:6px 24px 22px}
.step{position:relative;padding:0 0 0 26px}
.step:before{
  content:"";position:absolute;left:3px;top:8px;width:9px;height:9px;
  background:var(--surface);border:2px solid var(--signal);
}
.step:after{
  content:"";position:absolute;left:7px;top:21px;bottom:-4px;width:1px;background:var(--rule-2);
}
.step:last-child:after{display:none}
.step.done{padding-bottom:12px}
.step.done .step-q{font-size:12.5px;color:var(--ink-3);margin-bottom:1px}
.step.done .step-a{font-size:14.5px;color:var(--ink-2)}
.step.done:before{border-color:var(--rule-2);background:var(--rule-2)}
.step.live{padding-bottom:8px}
.step.live .step-q{font-size:17px;font-weight:600;margin:0 0 11px;letter-spacing:-.01em}
.choices{display:flex;flex-direction:column;gap:7px;max-width:620px}
.choices button{
  text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:2px;
  padding:10px 13px;cursor:pointer;font-size:14.8px;line-height:1.4;color:var(--ink);
}
.choices button:hover{border-color:var(--signal);background:var(--signal-w)}
.undo{
  background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;padding:4px 0;
  text-decoration:underline;text-underline-offset:2px;
}
.undo:hover{color:var(--signal)}

/* ---------- recommendation cards ---------- */
.verdict{border-top:1px solid var(--rule);background:var(--sunk);padding:20px 24px 24px}
.verdict h3{font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;margin-bottom:12px}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{
  background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:14px 16px;
  display:flex;gap:14px;align-items:flex-start;text-align:left;cursor:pointer;width:100%;
}
.rec:hover{border-color:var(--signal)}
.rec-primary{border-left:3px solid var(--signal)}
.rec-body{flex:1;min-width:0}
.rec-name{font-weight:600;font-size:15.5px;margin-bottom:3px}
.rec-why{font-size:14px;color:var(--ink-2);line-height:1.5}
.tag{
  font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 7px;border-radius:2px;
  white-space:nowrap;margin-top:2px;
}
.tag-primary{background:var(--signal);color:#fff}
.tag-alternative{background:var(--sunk);color:var(--ink-2);border:1px solid var(--rule)}
.tag-companion{background:var(--flag-w);color:var(--flag)}

/* ---------- test detail ---------- */
.t-head{border-bottom:1px solid var(--rule-2);padding-bottom:16px;margin-bottom:18px}
.t-fam{font-size:12px;color:var(--signal);font-weight:600;letter-spacing:.04em;margin-bottom:5px}
.t-head h2{font-size:25px;letter-spacing:-.022em}
.t-purpose{margin-top:9px;font-size:16px;color:var(--ink-2);max-width:68ch}
.meta{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:4px}
.meta h4{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:6px}
.meta p,.meta li{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.meta ul{margin:0;padding-left:17px}
.meta li{margin-bottom:3px}
.caution{
  margin-top:16px;background:var(--flag-w);border-left:3px solid var(--flag);
  padding:12px 15px;font-size:14.5px;color:#6E3C0E;line-height:1.5;border-radius:0 2px 2px 0;
}
.caution strong{color:var(--flag)}

/* ---------- data entry ---------- */
.field-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px}
.field label{font-size:12.5px;color:var(--ink-3);font-weight:500}
.field select,.field input{
  padding:7px 9px;border:1px solid var(--rule);border-radius:2px;font:inherit;font-size:14px;background:var(--surface);
}
textarea{
  width:100%;min-height:170px;padding:12px 13px;border:1px solid var(--rule);border-radius:2px;
  font:400 13.5px/1.6 var(--mono);background:var(--sunk);resize:vertical;color:var(--ink);tab-size:8;
}
textarea:focus{background:var(--surface)}
.hint{font-size:13.5px;color:var(--ink-3);margin:7px 0 10px;line-height:1.5}
.btn{
  background:var(--signal);color:#fff;border:1px solid var(--signal-d);border-radius:2px;
  padding:10px 20px;font-size:15px;font-weight:500;cursor:pointer;
}
.btn:hover{background:var(--signal-d)}
.btn-ghost{background:none;color:var(--signal);border-color:var(--rule)}
.btn-ghost:hover{background:var(--signal-w);color:var(--signal-d)}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.parse-note{font-size:13px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- results ---------- */
.readout{background:var(--sunk);border:1px solid var(--rule-2);border-radius:2px;margin-bottom:16px;overflow:hidden}
.readout dl{display:flex;flex-wrap:wrap;margin:0 -1px -1px 0}
.readout div{flex:1 1 178px;min-width:0;padding:11px 16px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2)}
.readout dt{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.readout dd{margin:0;font:500 17px/1.25 var(--mono);letter-spacing:-.01em;word-break:break-word}
.readout dd.sig{color:var(--signal)}
.readout dd small{font:400 12px var(--sans);color:var(--ink-3);display:block;margin-top:2px}

.flags{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fl{padding:11px 14px;border-radius:2px;font-size:14.3px;line-height:1.5;border-left:3px solid}
.fl-warn{background:var(--flag-w);border-color:var(--flag);color:#6E3C0E}
.fl-info{background:var(--signal-w);border-color:var(--signal);color:#123F3D}

.tbl-wrap{overflow-x:auto;margin-bottom:18px;border:1px solid var(--rule-2);border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:13.8px}
caption{text-align:left;font-size:12.5px;color:var(--ink-3);font-weight:600;padding:9px 13px;background:var(--sunk);border-bottom:1px solid var(--rule-2);letter-spacing:.03em}
th,td{padding:7px 13px;text-align:right;border-bottom:1px solid var(--rule-2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--surface);color:var(--ink-3);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--rule)}
tbody td{font-family:var(--mono);font-size:13px}
tbody td:first-child{font-family:var(--sans);font-size:13.8px}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#FAFBFC}

.apa{background:var(--ink);color:#DCE5EA;padding:14px 16px;border-radius:2px;font:400 13.6px/1.6 var(--mono);margin-bottom:6px;word-break:break-word}
.apa-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.apa-row h4{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em}
.copy{background:none;border:1px solid var(--rule);border-radius:2px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.copy:hover{border-color:var(--signal);color:var(--signal)}

.err{background:var(--flag-w);border-left:3px solid var(--flag);padding:13px 15px;border-radius:0 2px 2px 0;font-size:14.5px;color:#6E3C0E}

/* ---------- next steps ---------- */
.next{border-top:1px solid var(--rule-2);margin-top:6px;padding-top:18px}
.next h3{font-size:12.5px;color:var(--ink-3);letter-spacing:.05em;margin-bottom:12px}
.nx{
  display:block;width:100%;text-align:left;background:var(--sunk);border:1px solid var(--rule-2);
  border-radius:2px;padding:13px 15px;margin-bottom:9px;cursor:default;
}
.nx.go{cursor:pointer}
.nx.go:hover{border-color:var(--signal);background:var(--signal-w)}
.nx-t{font-weight:600;font-size:14.8px;margin-bottom:3px}
.nx-b{font-size:14px;color:var(--ink-2);line-height:1.5}
.nx-go{font-size:12.5px;color:var(--signal);font-weight:500;margin-top:6px}

/* ---------- charts ---------- */
.chart{margin-bottom:18px;border:1px solid var(--rule-2);border-radius:2px;padding:14px;overflow-x:auto}
.chart h4{font-size:12.5px;color:var(--ink-3);letter-spacing:.03em;margin-bottom:10px}
svg text{font-family:var(--sans)}

/* ---------- coverage ---------- */
.cov{columns:2;column-gap:26px}
.cov section{break-inside:avoid;margin-bottom:16px}
.cov h4{font-size:13px;color:var(--signal);margin-bottom:5px}
.cov ul{margin:0;padding-left:17px;font-size:14px;color:var(--ink-2)}
.cov li{margin-bottom:2px}

.foot{max-width:1240px;margin:0 auto;padding:6px 22px 40px;font-size:13.2px;color:var(--ink-3);line-height:1.6}
.foot p{max-width:78ch}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding:14px;gap:14px}
  .rail{position:static}
  .rail-list{max-height:none;padding:0}
  .panel{padding:17px 15px}
  .path-head,.rail-steps,.verdict{padding-left:16px;padding-right:16px}
  .readout dl{grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
  .readout dd{font-size:15.5px}
  .t-head h2{font-size:21px}
  .cov{columns:1}
  .masthead-in{padding:11px 15px;gap:10px}
  .tagline{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .rec,.choices button,.nx.go{transition:border-color .12s,background-color .12s}
}
@media print{
  .rail,.masthead,.btn-row,.next{display:none}
  body{background:#fff}
  .panel{border:0;padding:0}
}

/* ---------- pieces referenced by app.js ---------- */
.sep{border-top:1px solid var(--rule-2);margin:20px 0 16px}
.linky{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);text-align:left;font:inherit;
  text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.linky:hover{color:var(--signal);text-decoration-color:var(--signal)}
.readout-cap{font-size:12px;color:var(--ink-3);padding:9px 16px 3px;letter-spacing:.04em}
.parse-note.bad{color:var(--flag)}
.bar-row{display:grid;grid-template-columns:minmax(84px,29%) 1fr;gap:11px;align-items:center;margin-bottom:7px}
.bar-lab{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{position:relative;height:21px;background:var(--sunk);border:1px solid var(--rule-2)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--signal);opacity:.8}
.bar-ci{position:absolute;top:50%;height:1px;background:var(--ink)}
.bar-cap{position:absolute;top:25%;height:50%;width:1px;background:var(--ink)}
.bar-val{position:absolute;right:6px;top:1px;font:400 12px/19px var(--mono);color:var(--ink-2)}
.bar-scale{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--ink-3);margin-top:4px}
.svg-scatter{max-width:480px;display:block}

/* ---------- class accordion in the index ---------- */
.fam-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--rule-2);
  padding:10px 13px;cursor:pointer;font-size:13.8px;font-weight:600;color:var(--ink);text-align:left;font-family:var(--sans)}
.fam-btn:first-child{border-top:0}
.fam-btn:hover{background:var(--sunk)}
.fam-btn.open{color:var(--signal-d)}
.fam-name{display:flex;align-items:baseline}
.fam-name:before{content:"";flex:none;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(-45deg) translateY(-2px);margin:0 11px 0 1px}
.fam-btn.open .fam-name:before{transform:rotate(45deg) translate(-2px,-1px)}
.fam-count{font:500 11.5px var(--mono);color:var(--ink-3);background:var(--sunk);border:1px solid var(--rule-2);border-radius:2px;padding:1px 6px}
.fam-items{padding:0 0 8px}
.fam-item{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:6px 13px 6px 30px;font-size:14px;
  color:var(--ink-2);border-left:2px solid transparent;line-height:1.35;font-family:var(--sans)}
.fam-item:hover{background:var(--sunk);color:var(--ink)}
.fam-item[aria-current=true]{border-left-color:var(--signal);color:var(--ink);font-weight:500;background:var(--signal-w)}

/* ---------- all-tests page ---------- */
.lede{color:var(--ink-2);margin:9px 0 18px;max-width:66ch;font-size:15px}
.cov h3{font-size:15px;display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.cov h3 .count{font:500 12px var(--mono);color:var(--ink-3)}
.cov .blurb{font-size:13.5px;color:var(--ink-3);margin-bottom:7px;line-height:1.45}
.cov section{margin-bottom:20px}
table.pairs td,table.pairs th{text-align:left;white-space:normal;vertical-align:top}
table.pairs tbody td{font-family:var(--sans);font-size:14px}
table.pairs tbody td:first-child{color:var(--ink);font-weight:500;width:32%}
table.pairs .linky{display:block;margin:0 0 4px}

/* ---------- counterpart strip, file button, table copy ---------- */
.counter{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:10px 13px;background:var(--sunk);border:1px solid var(--rule-2);border-radius:2px}
.counter-lab{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;margin-right:3px}
.chip{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:4px 10px;font-size:13.5px;cursor:pointer;color:var(--signal-d);font-family:var(--sans)}
.chip:hover{border-color:var(--signal);background:var(--signal-w)}
.counter-note{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.file-btn{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.file-btn input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file-btn:focus-within{outline:2px solid var(--signal);outline-offset:2px}
caption .copy-sm{float:right;padding:1px 8px;font-size:11.5px;font-weight:500;letter-spacing:0;margin:-2px 0 0 10px;background:var(--surface)}

/* ---------- Likert diverging bars ---------- */
.lk-row{display:grid;grid-template-columns:minmax(84px,27%) 36px 1fr 36px;gap:8px;align-items:center;margin-bottom:7px}
.lk-track{position:relative;height:22px;background:var(--sunk);border:1px solid var(--rule-2)}
.lk-seg{position:absolute;top:0;bottom:0}
.lk-mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink)}
.lk-num{font:400 12px var(--mono);color:var(--ink-2)}
.lk-l{text-align:right}
.lk-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:11px;font:400 12px var(--mono);color:var(--ink-3);padding-left:calc(27% + 52px)}
.lk-legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
.lk-end{font-family:var(--sans);font-size:12px}
.svg-curve{max-width:520px;display:block}

/* ---------- concepts ---------- */
.concept{border-top:1px solid var(--rule-2);padding:16px 0 14px}
.concept h3{font-size:17px;margin-bottom:6px;letter-spacing:-.01em}
.concept p{max-width:72ch;color:var(--ink-2);font-size:15px}
.concept .practice{background:var(--sunk);border-left:3px solid var(--signal);padding:9px 13px;border-radius:0 2px 2px 0;color:var(--ink);margin-top:8px}
.related{font-size:13.5px;color:var(--ink-3);margin-top:9px}

/* ---------- results log ---------- */
.log-item{border-top:1px solid var(--rule-2);padding:14px 0}
.log-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.log-name{font-weight:600;font-size:15px;color:var(--ink)}
.log-time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.log-stats{font:400 12.8px/1.5 var(--mono);color:var(--ink-2);margin-bottom:8px;word-break:break-word}
.apa-sm{font-size:12.8px;padding:10px 12px;margin:0}
.empty{color:var(--ink-3)}

/* ---------- footer mark ---------- */
.foot-mark{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-2);font-size:12.5px;color:var(--ink-3);letter-spacing:.01em}

@media (max-width:900px){
  .modes{overflow-x:auto;max-width:100%}
  .modes button{white-space:nowrap;padding:6px 11px}
  .lk-row{grid-template-columns:minmax(70px,30%) 32px 1fr 32px;gap:6px}
  .lk-legend{padding-left:0}
  .counter-note{margin-left:0;width:100%}
}
@media print{
  .counter,.copy-sm,.file-btn{display:none}
}
</style>

      apa: d.groups.map(function (g, i) {

{
  id: 'shapiro', name: 'Shapiro–Wilk normality test', family: 'describe',
  tags: ['normality', 'assumption', 'gaussian'],
  purpose: 'Test whether a sample could plausibly have come from a normal distribution.',
  when: 'As a gate before t-tests, ANOVA, Pearson correlation and regression. For regression, run it on the residuals rather than the raw variable.',
  assumptions: ['Independent observations.', 'n between 3 and about 5000.'],
  caution: 'With large n almost any real dataset fails this test even when the departure is trivial. With small n it fails to detect real departures. Read the histogram and Q–Q plot alongside it.',
  input: { kind: 'groups', label: 'One column per variable' },
  run: function (d) {
    var rows = [], flags = [], anyBad = false;
    d.groups.forEach(function (g, i) {
      var sw = H.shapiroWilk(g);
      if (!sw) { rows.push([d.names[i], g.length, '—', '—', 'n too small']); return; }
      var verdict = sw.p < 0.05 ? 'Not normal' : 'Consistent with normal';
      if (sw.p < 0.05) anyBad = true;
      rows.push([d.names[i], sw.n, H.num(sw.W, 4), H.pfmt(sw.p), verdict]);
    });
    if (anyBad) flags.push(H.flag('warn', 'At least one variable departs from normality. Either transform it, use a rank-based alternative, or rely on the central limit theorem if n per group is comfortably above 30.'));
    var sws = d.groups.map(function (g) { return H.shapiroWilk(g); }).filter(Boolean);
    var worst = null, wi = 0;
    sws.forEach(function (s2, i) { if (!worst || s2.p < worst.p) { worst = s2; wi = i; } });
    var stats = [H.stat('Variables tested', sws.length, 0)];
    if (worst) {
      stats.push(H.stat('Lowest W', worst.W, 4));
      stats.push({ k: 'on', v: d.names[wi] });
      stats.push(H.pstat(worst.p));
    }
    return {
      stats: stats, p: worst ? worst.p : null, flags: flags,
      tables: [{ title: 'Shapiro–Wilk', head: ['Variable', 'n', 'W', 'p', 'Verdict'], rows: rows }],
      apa: sws.length ? d.names.slice(0, sws.length).map(function (nm, i) {
        return 'Shapiro–Wilk for ' + nm + ', W = ' + H.num(sws[i].W, 3) + ', ' + H.pr(sws[i].p);
      }).join('; ') + '.' : 'No variable had enough observations to test.'
    };
  },
  next: function (r, d) {
    return [
      { title: 'If normality holds', body: 'Proceed with t-tests, ANOVA or Pearson correlation.', testId: 'ttest_ind' },
      { title: 'If it does not', body: 'Use Mann–Whitney (2 independent groups), Wilcoxon (2 related), Kruskal–Wallis (3+ independent) or Spearman.', testId: 'mannwhitney' }
    ];
  }
},
{
  id: 'levene', name: "Levene / Brown–Forsythe test", family: 'describe',
  tags: ['variance', 'homogeneity', 'assumption', 'homoscedasticity'],
  purpose: 'Test whether several groups have equal population variances.',
  when: 'Before a Student t-test or a classical one-way ANOVA. The median-centred version (Brown–Forsythe) is the robust default.',
  assumptions: ['Independent groups.'],
  input: { kind: 'groups', label: 'One column per group', min: 2 },
  options: [{ id: 'center', type: 'select', label: 'Centre on', choices: ['median (Brown–Forsythe)', 'mean (original Levene)'], def: 0 }],
  run: function (d, o) {
    var useMedian = o.center === 0;
    var k = d.groups.length, N = 0, z = [], zbarAll = 0;
    d.groups.forEach(function (g) {
      var c = useMedian ? S.median(g) : S.mean(g);
      var zi = g.map(function (v) { return Math.abs(v - c); });
      z.push(zi); N += g.length;
    });
    var allZ = []; z.forEach(function (a) { allZ = allZ.concat(a); });
    zbarAll = S.mean(allZ);
    var numr = 0, den = 0;
    z.forEach(function (zi) {
      var zb = S.mean(zi);
      numr += zi.length * Math.pow(zb - zbarAll, 2);
      zi.forEach(function (v) { den += Math.pow(v - zb, 2); });
    });
    var W = ((N - k) / (k - 1)) * numr / den, p = S.fSF(W, k - 1, N - k);
    var vars = d.groups.map(function (g) { return S.variance(g); });
    var ratio = Math.max.apply(null, vars) / Math.min.apply(null, vars);
    var flags = [];
    if (p < 0.05) flags.push(H.flag('warn', 'Variances differ significantly. Use Welch\'s t-test or Welch\'s ANOVA instead of the pooled versions, and Games–Howell rather than Tukey for post-hoc.'));
    if (ratio > 4) flags.push(H.flag('warn', 'Largest variance is ' + H.num(ratio, 1) + '× the smallest. Even a non-significant Levene test would not reassure me at this ratio.'));
    return {
      stats: [H.stat('W', W), H.stat('df', (k - 1) + ', ' + (N - k)), H.pstat(p), H.stat('Variance ratio', ratio, 2)],
      p: p, flags: flags,
      tables: [{ title: 'Group variances', head: ['Group', 'n', 'Variance', 'SD'], rows: d.groups.map(function (g, i) { return [d.names[i], g.length, H.num(S.variance(g)), H.num(S.sd(g))]; }) }],
      apa: 'Levene’s test, F(' + (k - 1) + ', ' + (N - k) + ') = ' + H.num(W, 2) + ', ' + H.pr(p)
    };
  },
  next: function (r) {
    if (r.p < 0.05) return [
      { title: 'Switch to Welch', body: 'Run the t-test with the Welch correction, or Welch’s ANOVA for 3+ groups.', testId: 'ttest_ind' },
      { title: 'Or go rank-based', body: 'Mann–Whitney and Kruskal–Wallis do not assume equal variances, though they do assume similar distribution shapes if you want to read them as median comparisons.', testId: 'kruskal' }
    ];
    return [{ title: 'Pooled tests are fine', body: 'Proceed with Student’s t-test or classical one-way ANOVA.', testId: 'anova_one' }];
  }
},
{
  id: 'bartlett', name: "Bartlett's test", family: 'describe',
  tags: ['variance', 'homogeneity', 'assumption'],
  purpose: 'Test equality of variances assuming the data are normal.',
  when: 'Only when you are confident the data are normal. Otherwise use Levene, which is far more robust.',
  assumptions: ['Normality within each group — the test is very sensitive to this.'],
  input: { kind: 'groups', label: 'One column per group', min: 2 },
  run: function (d) {
    var k = d.groups.length, N = 0, sp = 0, sumlog = 0, sumInv = 0;
    d.groups.forEach(function (g) { N += g.length; sp += (g.length - 1) * S.variance(g); });
    sp /= (N - k);
    d.groups.forEach(function (g) { sumlog += (g.length - 1) * Math.log(S.variance(g)); sumInv += 1 / (g.length - 1); });
    var C = 1 + (1 / (3 * (k - 1))) * (sumInv - 1 / (N - k));
    var T = ((N - k) * Math.log(sp) - sumlog) / C, p = S.chiSF(T, k - 1);
    return {
      stats: [H.stat('χ²', T), H.stat('df', k - 1, 0), H.pstat(p)],
      p: p, flags: p < 0.05 ? [H.flag('warn', 'Variances are unequal — use Welch-corrected tests.')] : [],
      apa: 'Bartlett’s K² = ' + H.num(T, 2) + ', df = ' + (k - 1) + ', ' + H.pr(p)
    };
  },
  next: function () { return [{ title: 'Cross-check with Levene', body: 'Bartlett is unreliable under non-normality. If Levene disagrees, trust Levene.', testId: 'levene' }]; }
},
{
  id: 'grubbs', name: 'Grubbs outlier test', family: 'describe',
  tags: ['outlier', 'extreme value', 'data screening'],
  purpose: 'Identify whether the single most extreme value in a sample is a statistical outlier.',
  when: 'During data screening, when one value looks like it might be a coding slip or an unusual participant.',
  assumptions: ['The rest of the data are approximately normal.', 'Tests one outlier at a time — rerun after removing.'],
  caution: 'A statistical outlier is not automatically an error. Removing points changes your inference; document every exclusion and give a substantive reason.',
  input: { kind: 'sample', label: 'One numeric column' },
  run: function (d) {
    var x = d.groups[0], n = x.length, m = S.mean(x), s = S.sd(x);
    var maxd = 0, idx = -1;
    for (var i = 0; i < n; i++) { var dv = Math.abs(x[i] - m); if (dv > maxd) { maxd = dv; idx = i; } }
    var G = maxd / s;
    var t2 = n * (n - 2) * G * G / ((n - 1) * (n - 1) - n * G * G);
    var p = t2 > 0 ? Math.min(1, n * 2 * S.tSF(Math.sqrt(t2), n - 2)) : 1;
    var q1 = S.quantile(x, 0.25), q3 = S.quantile(x, 0.75), r = q3 - q1;
    var mild = x.filter(function (v) { return v < q1 - 1.5 * r || v > q3 + 1.5 * r; });
    var ext = x.filter(function (v) { return v < q1 - 3 * r || v > q3 + 3 * r; });
    return {
      stats: [H.stat('Suspect value', x[idx]), H.stat('G', G), H.stat('n', n, 0), H.pstat(p)],
      p: p,
      flags: p < 0.05 ? [H.flag('warn', 'Value ' + H.num(x[idx]) + ' is a significant outlier. Check the source record before deciding anything.')] : [H.flag('info', 'No single value is a significant outlier by Grubbs.')],
      tables: [{ title: 'Tukey fence check', head: ['Rule', 'Count', 'Values'], rows: [
        ['Beyond 1.5 × IQR', mild.length, mild.length ? mild.map(function (v) { return H.num(v, 2); }).join(', ') : '—'],
        ['Beyond 3 × IQR', ext.length, ext.length ? ext.map(function (v) { return H.num(v, 2); }).join(', ') : '—']] }],
      apa: 'Grubbs\u2019 test, G = ' + H.num(G, 2) + ', N = ' + n + ', ' + H.pr(p) +
        (p < 0.05 ? '; the most extreme value (' + H.num(x[idx], 2) + ') was flagged as an outlier.'
                  : '; no value was identified as an outlier.')
    };
  },
  next: function () { return [{ title: 'Re-describe after any exclusion', body: 'If you remove a case, rerun descriptives and normality, and report both the with- and without-outlier results.', testId: 'descriptives' }]; }
},

{
  id: 'cohen_kappa', name: "Cohen's kappa", family: 'agree',
  tags: ['inter-coder', 'inter-rater', 'reliability', 'ICR', 'two coders', 'qualitative', 'kappa'],
  purpose: 'Chance-corrected agreement between exactly two coders applying the same nominal or ordinal scheme.',
  when: 'The standard report for a two-coder reliability check in qualitative coding. Use the weighted version when the categories are ordered, so that a near-miss counts less than a wild disagreement.',
  assumptions: ['Exactly two coders.', 'The same units coded by both.', 'Categories are mutually exclusive and fixed in advance.'],
  caution: 'Kappa is depressed when one category dominates — the "kappa paradox". If agreement looks high but kappa is low, report the prevalence and bias indices too, or switch to Gwet’s AC1.',
  input: { kind: 'ratings', label: 'One row per unit, one column per coder (2 columns)', cols: 2 },
  options: [{ id: 'w', type: 'select', label: 'Weighting', choices: ['unweighted (nominal)', 'linear (ordinal)', 'quadratic (ordinal)'], def: 0 },
            { id: 'conf', type: 'number', label: 'Confidence level', def: 0.95, min: 0.5, max: 0.999, step: 0.01 }],
  run: function (d, o) {
    var mat = d.matrix.filter(function (r) { return r[0] !== '' && r[1] !== '' && r[0] != null && r[1] != null; });
    if (!mat.length) throw new Error('No complete pairs found. Every row needs a code from both coders.');
    var cats = H.categoriesOf(mat), q = cats.length, idx = {};
    cats.forEach(function (c, i) { idx[c] = i; });
    var N = mat.length, i, j;
    var obs = []; for (i = 0; i < q; i++) { obs[i] = []; for (j = 0; j < q; j++) obs[i][j] = 0; }
    mat.forEach(function (r) { obs[idx[r[0]]][idx[r[1]]]++; });
    var pm = obs.map(function (row) { return row.map(function (v) { return v / N; }); });
    var ri = [], cj = [];
    for (i = 0; i < q; i++) { ri[i] = 0; cj[i] = 0; }
    for (i = 0; i < q; i++) for (j = 0; j < q; j++) { ri[i] += pm[i][j]; cj[j] += pm[i][j]; }
    // agreement weights
    var W = []; for (i = 0; i < q; i++) { W[i] = []; for (j = 0; j < q; j++) {
      var dd = q > 1 ? Math.abs(i - j) / (q - 1) : 0;
      W[i][j] = o.w === 0 ? (i === j ? 1 : 0) : (o.w === 1 ? 1 - dd : 1 - dd * dd);
    } }
    var po = 0, pe = 0;
    for (i = 0; i < q; i++) for (j = 0; j < q; j++) { po += W[i][j] * pm[i][j]; pe += W[i][j] * ri[i] * cj[j]; }
    var kappa = (po - pe) / (1 - pe);
    // Everitt / Fleiss delta-method variance
    var wr = [], wc = [];
    for (i = 0; i < q; i++) { wr[i] = 0; for (j = 0; j < q; j++) wr[i] += cj[j] * W[i][j]; }
    for (j = 0; j < q; j++) { wc[j] = 0; for (i = 0; i < q; i++) wc[j] += ri[i] * W[i][j]; }
    var acc = 0;
    for (i = 0; i < q; i++) for (j = 0; j < q; j++)
      acc += pm[i][j] * Math.pow(W[i][j] - (wr[i] + wc[j]) * (1 - kappa), 2);
    var v = (acc - Math.pow(kappa - pe * (1 - kappa), 2)) / (N * Math.pow(1 - pe, 2));
    var se = Math.sqrt(Math.max(v, 0));
    var z = S.normalInv(1 - (1 - (o.conf || 0.95)) / 2);
    var rawAgree = 0; for (i = 0; i < q; i++) rawAgree += obs[i][i];
    // prevalence & bias indices (2x2 only)
    var extra = [], flags = [];
    if (q === 2) {
      var pi = Math.abs(pm[0][0] - pm[1][1]), bi = Math.abs(ri[0] - cj[0]);
      extra.push(['Prevalence index', H.num(pi)]);
      extra.push(['Bias index', H.num(bi)]);
      extra.push(['PABAK', H.num(2 * (rawAgree / N) - 1)]);
      if (pi > 0.3) flags.push(H.flag('warn', 'High prevalence index (' + H.num(pi, 2) + '): one category dominates, which pushes kappa down artificially. Report PABAK or Gwet’s AC1 alongside.'));
    }
    if (kappa < 0.6) flags.push(H.flag('warn', 'κ = ' + H.num(kappa) + ' is below the 0.60 threshold most reviewers expect. Reconcile disagreements, sharpen the codebook definitions, and recode.'));
    if (N < 30) flags.push(H.flag('info', 'Only ' + N + ' units. Kappa is unstable at this size — a common convention is at least 10–20% of the corpus double-coded, with a minimum of about 50 units.'));
    var head = ['Coder 1 \\ 2'].concat(cats);
    var rows = obs.map(function (row, r) { return [cats[r]].concat(row); });
    return {
      stats: [H.stat('κ' + (o.w ? 'w' : ''), kappa), H.stat('SE', se), H.stat(Math.round((o.conf || 0.95) * 100) + '% CI', '[' + H.num(kappa - z * se) + ', ' + H.num(kappa + z * se) + ']'),
              H.stat('Observed agreement', po), H.stat('Expected by chance', pe), H.stat('Units', N, 0), H.pstat(2 * (1 - S.normalCDF(Math.abs(kappa / se))))],
      p: 2 * (1 - S.normalCDF(Math.abs(kappa / se))),
      effects: [H.eff('Strength', H.magnitude('kappa', kappa)), H.eff('Raw agreement', (100 * rawAgree / N).toFixed(1) + '%')],
      flags: flags,
      tables: [{ title: 'Confusion matrix', head: head, rows: rows }].concat(extra.length ? [{ title: 'Paradox diagnostics', head: ['Index', 'Value'], rows: extra }] : []),
      apa: 'κ' + (o.w ? '_w' : '') + ' = ' + H.num(kappa) + ', ' + Math.round((o.conf || 0.95) * 100) + '% CI [' + H.num(kappa - z * se) + ', ' + H.num(kappa + z * se) + '], ' + N + ' units, ' + (100 * rawAgree / N).toFixed(1) + '% raw agreement'
    };
  },
  next: function (r) {
    var out = [];
    var k = parseFloat(r.stats[0].v);
    if (k < 0.6) out.push({ title: 'Reconcile and recode', body: 'Hold a disagreement-resolution session, tighten the code definitions that generated the off-diagonal cells, then re-run on a fresh subsample. Report the final kappa, not the first attempt.' });
    out.push({ title: 'Guard against the kappa paradox', body: 'If one code dominates your corpus, Gwet’s AC1 is far more stable and increasingly accepted.', testId: 'gwet_ac1' });
    out.push({ title: 'More than two coders?', body: 'Fleiss’ kappa handles any number of coders; Krippendorff’s alpha additionally tolerates missing codes and ordinal scales.', testId: 'kripp_alpha' });
    out.push({ title: 'Then analyse the codes themselves', body: 'Once reliability is established, move to frequency analysis of the agreed codes — proportions with Wilson intervals, then group comparisons.', testId: 'wilson_batch' });
    return out;
  }
},
{
  id: 'fleiss_kappa', name: "Fleiss' kappa", family: 'agree',
  tags: ['inter-coder', 'reliability', 'multiple raters', 'ICR', 'qualitative'],
  purpose: 'Chance-corrected agreement among three or more coders on nominal categories.',
  when: 'When a panel rather than a pair coded your material, and each unit received the same number of ratings.',
  assumptions: ['Same number of raters per unit.', 'Nominal categories.', 'Raters are interchangeable — it does not matter which specific person gave which code.'],
  input: { kind: 'ratings', label: 'One row per unit, one column per coder (3+ columns)', cols: 3 },
  run: function (d) {
    var mat = d.matrix.filter(function (r) { return r.filter(function (v) { return v !== '' && v != null; }).length === r.length; });
    var cats = H.categoriesOf(mat), n = H.countMatrix(mat, cats);
    var N = mat.length, m = mat[0].length, q = cats.length, j, i;
    var pj = []; for (j = 0; j < q; j++) { pj[j] = 0; for (i = 0; i < N; i++) pj[j] += n[i][j]; pj[j] /= (N * m); }
    var Pbar = 0;
    for (i = 0; i < N; i++) { var s = 0; for (j = 0; j < q; j++) s += n[i][j] * n[i][j]; Pbar += (s - m) / (m * (m - 1)); }
    Pbar /= N;
    var Pe = 0, p3 = 0; for (j = 0; j < q; j++) { Pe += pj[j] * pj[j]; p3 += Math.pow(pj[j], 3); }
    var kappa = (Pbar - Pe) / (1 - Pe);
    var varK = 2 * (Pe - (2 * m - 3) * Pe * Pe + 2 * (m - 2) * p3) / (N * m * (m - 1) * Math.pow(1 - Pe, 2));
    var se = Math.sqrt(Math.max(varK, 0));
    var z = kappa / se, p = 2 * (1 - S.normalCDF(Math.abs(z)));
    // per-category kappa
    var rows = cats.map(function (c, jj) {
      var pjj = pj[jj], pbj = 0;
      for (var ii = 0; ii < N; ii++) pbj += n[ii][jj] * (m - n[ii][jj]);
      pbj = 1 - pbj / (N * m * (m - 1) * pjj * (1 - pjj));
      return [c, H.num(pjj), H.num(pbj)];
    });
    var flags = [];
    if (kappa < 0.6) flags.push(H.flag('warn', 'κ below 0.60. Look at the per-category table — usually one or two codes are dragging the whole scheme down.'));
    return {
      stats: [H.stat('κ', kappa), H.stat('SE', se), H.stat('95% CI', '[' + H.num(kappa - 1.96 * se) + ', ' + H.num(kappa + 1.96 * se) + ']'),
              H.stat('Units', N, 0), H.stat('Raters', m, 0), H.stat('Observed agreement', Pbar), H.pstat(p)],
      p: p, flags: flags,
      effects: [H.eff('Strength', H.magnitude('kappa', kappa))],
      tables: [{ title: 'Per-category', head: ['Category', 'Proportion', 'κ for this category'], rows: rows }],
      apa: 'Fleiss’ κ = ' + H.num(kappa) + ', 95% CI [' + H.num(kappa - 1.96 * se) + ', ' + H.num(kappa + 1.96 * se) + '], ' + N + ' units × ' + m + ' coders'
    };
  },
  next: function () {
    return [
      { title: 'Missing codes or ordinal scale?', body: 'Fleiss requires a complete, equal-sized rating per unit. Krippendorff’s alpha handles gaps and ordered categories.', testId: 'kripp_alpha' },
      { title: 'Skewed category distribution?', body: 'Gwet’s AC1 is the robust alternative when one code dominates.', testId: 'gwet_ac1' }
    ];
  }
},
{
  id: 'kripp_alpha', name: "Krippendorff's alpha", family: 'agree',
  tags: ['inter-coder', 'reliability', 'ICR', 'missing data', 'ordinal', 'content analysis', 'qualitative'],
  purpose: 'The most general agreement coefficient: any number of coders, missing codes allowed, and nominal, ordinal, interval or ratio measurement.',
  when: 'The safest default for content analysis. It is what methodologists in qualitative research most often ask for, and it degrades gracefully when your coding matrix has holes.',
  assumptions: ['Units are independent.', 'At least some units have two or more codes.'],
  input: { kind: 'ratings', label: 'One row per unit, one column per coder. Leave cells blank where a coder did not code that unit.', cols: 2 },
  options: [{ id: 'metric', type: 'select', label: 'Measurement level', choices: ['nominal', 'ordinal', 'interval', 'ratio'], def: 0 },
            { id: 'boot', type: 'select', label: 'Bootstrap CI', choices: ['off', 'on (2000 resamples)'], def: 1 }],
  run: function (d, o) {
    var metric = ['nominal', 'ordinal', 'interval', 'ratio'][o.metric];
    function alphaOf(units) {

          ['Interaction', H.num(SSab, 2), dfAB, H.num(MSab, 2), H.num(Fab, 3), H.pfmt(pab), H.num(SSab / (SSab + SSw), 3)],

{
  id: 'pearson', name: 'Pearson correlation', family: 'param',

      p: p,

      { title: 'A third variable in play?', body: 'Partial correlation removes the influence of a covariate.', testId: 'partial_corr' },
      { title: 'Correlation is not causation', body: 'This is worth a sentence in the paper rather than a footnote, especially in cross-sectional design research.' }

},
{
  id: 'partial_corr', name: 'Partial correlation', family: 'param',

},
{
  id: 'regress', name: 'Linear regression', family: 'param',
  tags: ['regression', 'prediction', 'OLS', 'multiple', 'model'],
  purpose: 'Model a continuous outcome as a linear function of one or more predictors.',
  when: 'Predicting intention to use from perceived usefulness and ease of use; or any time you need a slope with units attached.',
  assumptions: ['Linearity.', 'Independent residuals.', 'Constant residual variance.', 'Roughly normal residuals.', 'Predictors not too collinear — check the VIF column.'],
  input: { kind: 'xyk', label: 'First column: outcome (Y). Remaining columns: predictors.' },
  run: function (d) {
    var y = d.groups[0], Xc = d.groups.slice(1), n = y.length, k = Xc.length, i, j;
    var X = [];
    for (i = 0; i < n; i++) { X[i] = [1]; for (j = 0; j < k; j++) X[i].push(Xc[j][i]); }
    var p = k + 1;
    var XtX = [], Xty = [];
    for (i = 0; i < p; i++) { XtX[i] = []; Xty[i] = 0; for (j = 0; j < p; j++) { var s = 0; for (var t = 0; t < n; t++) s += X[t][i] * X[t][j]; XtX[i][j] = s; } }
    for (i = 0; i < p; i++) { var s2 = 0; for (t = 0; t < n; t++) s2 += X[t][i] * y[t]; Xty[i] = s2; }
    var inv = matInv(XtX), beta = [];
    for (i = 0; i < p; i++) { var b = 0; for (j = 0; j < p; j++) b += inv[i][j] * Xty[j]; beta[i] = b; }
    var fit = [], res = [], SSE = 0, SST = 0, my = S.mean(y);
    for (t = 0; t < n; t++) {
      var f = 0; for (i = 0; i < p; i++) f += beta[i] * X[t][i];
      fit.push(f); res.push(y[t] - f);
      SSE += Math.pow(y[t] - f, 2); SST += Math.pow(y[t] - my, 2);
    }
    var dfE = n - p, MSE = SSE / dfE, R2 = 1 - SSE / SST;
    var adjR2 = 1 - (1 - R2) * (n - 1) / dfE;
    var F = (SST - SSE) / k / MSE, pF = S.fSF(F, k, dfE);
    var sy = S.sd(y);
    var rows = [], vifs = [];
    for (i = 0; i < p; i++) {
      var se = Math.sqrt(MSE * inv[i][i]), tv = beta[i] / se, pv = S.tTwoTail(tv, dfE);
      var tc = S.tInv(0.975, dfE);
      var name = i === 0 ? '(Intercept)' : (d.names[i] || ('X' + i));
      var stdB = i === 0 ? '' : H.num(beta[i] * S.sd(Xc[i - 1]) / sy, 3);
      var vif = '';
      if (i > 0 && k > 1) {
        var others = Xc.filter(function (_, jj) { return jj !== i - 1; });
        var Cm = [], all2 = [Xc[i - 1]].concat(others);
        for (var a2 = 0; a2 < all2.length; a2++) { Cm[a2] = []; for (var b2 = 0; b2 < all2.length; b2++) Cm[a2][b2] = pearsonR(all2[a2], all2[b2]); }
        try { var Pm = matInv(Cm); vif = H.num(Pm[0][0], 2); vifs.push(Pm[0][0]); } catch (e) { vif = '∞'; vifs.push(Infinity); }
      }
      rows.push([name, H.num(beta[i], 4), H.num(se, 4), stdB, H.num(tv, 3), H.pfmt(pv),
                 '[' + H.num(beta[i] - tc * se, 3) + ', ' + H.num(beta[i] + tc * se, 3) + ']', vif]);
    }
    // Durbin-Watson
    var dwn = 0, dwd = 0;
    for (t = 1; t < n; t++) dwn += Math.pow(res[t] - res[t - 1], 2);
    for (t = 0; t < n; t++) dwd += res[t] * res[t];
    var DW = dwn / dwd;
    var swr = n >= 3 ? H.shapiroWilk(res) : null;
    var flags = [];
    if (vifs.some(function (v) { return v > 10; })) flags.push(H.flag('warn', 'A predictor has VIF above 10. The coefficients are unstable — drop or combine collinear predictors.'));
    else if (vifs.some(function (v) { return v > 5; })) flags.push(H.flag('info', 'A predictor has VIF above 5. Worth watching, especially if the coefficient sign is surprising.'));
    if (swr && swr.p < 0.05) flags.push(H.flag('warn', 'Residuals are non-normal (Shapiro–Wilk ' + H.pr(swr.p) + '). Check for outliers or a missing non-linear term.'));
    if (DW < 1.5 || DW > 2.5) flags.push(H.flag('info', 'Durbin–Watson = ' + H.num(DW, 2) + ' (2.0 means no autocorrelation). If your rows have a time or spatial order, the independence assumption may not hold.'));
    if (n < 10 * k + 20) flags.push(H.flag('info', 'With ' + n + ' cases and ' + k + ' predictors you are near the usual minimum. A common rule is 10–20 cases per predictor.'));
    return {
      stats: [H.stat('R²', R2), H.stat('Adjusted R²', adjR2), H.stat('F', F), H.stat('df', k + ', ' + dfE), H.pstat(pF),
              H.stat('Residual SE', Math.sqrt(MSE)), H.stat('n', n, 0), H.stat('Durbin–Watson', DW, 2)],
      p: pF, flags: flags,
      effects: [H.eff('Cohen’s f²', R2 / (1 - R2), 3, H.magnitude('eta2', R2))],
      tables: [{ title: 'Coefficients', head: ['Term', 'B', 'SE', 'β', 't', 'p', '95% CI', 'VIF'], rows: rows }],
      scatter: k === 1 ? { x: Xc[0], y: y, xn: d.names[1], yn: d.names[0], line: { b0: beta[0], b1: beta[1] } } : null,
      apa: 'R² = ' + H.num(R2, 3) + ', adjusted R² = ' + H.num(adjR2, 3) + ', F(' + k + ', ' + dfE + ') = ' + H.num(F, 2) + ', ' + H.pr(pF)
    };
  },
  next: function () {
    return [
      { title: 'Diagnose before you trust it', body: 'Plot residuals against fitted values. A funnel shape means non-constant variance; a curve means you need a non-linear term.' },
      { title: 'Binary outcome?', body: 'Ordinary least squares is the wrong model for a yes/no outcome. Use logistic regression in R, JASP or Python.' },
      { title: 'Report the model, not just R²', body: 'Give each coefficient with its interval. R² alone tells a reader nothing about direction or magnitude.' }
    ];
  }
},

{
  id: 'mannwhitney', name: 'Mann–Whitney U test', family: 'nonparam',
  tags: ['nonparametric', 'two groups', 'rank', 'ordinal', 'Likert', 'Wilcoxon rank-sum'],
  purpose: 'Compare two independent groups without assuming normality.',
  when: 'Ordinal outcomes, Likert items, small samples, or skewed continuous data. The default two-group test in most design research.',
  assumptions: ['Independent groups.', 'At least ordinal measurement.', 'To read the result as a median difference, the two distributions must have a similar shape. Otherwise it tests stochastic dominance — whether values in one group tend to exceed the other.'],
  input: { kind: 'groups', label: 'One column per group (exactly 2)', min: 2, max: 2 },
  options: [{ id: 'alt', type: 'select', label: 'Alternative', choices: ['two-sided', 'group 1 greater', 'group 1 less'], def: 0 },
            { id: 'exact', type: 'select', label: 'p-value', choices: ['auto (exact when small and untied)', 'normal approximation'], def: 0 }],
  run: function (d, o) {
    var x = d.groups[0], y = d.groups[1], n1 = x.length, n2 = y.length;
    var all = x.concat(y), r = S.rank(all);
    var R1 = 0; for (var i = 0; i < n1; i++) R1 += r[i];

    var U = Math.min(U1, U2);
    var mu = n1 * n2 / 2;
    var ties = r.tieGroups || [], tieCorr = 0;
    ties.forEach(function (t) { tieCorr += t * t * t - t; });
    var N = n1 + n2;
    var sig = Math.sqrt(n1 * n2 / 12 * ((N + 1) - tieCorr / (N * (N - 1))));
    var z = (U1 - mu) / sig;
    var zc = (Math.abs(U1 - mu) - 0.5) / sig;
    var pNorm = o.alt === 0 ? Math.min(1, 2 * (1 - S.normalCDF(zc))) : (o.alt === 1 ? 1 - S.normalCDF(z - 0.5 / sig) : S.normalCDF(z + 0.5 / sig));
    var pExact = null;
    if (o.exact === 0 && ties.length === 0 && n1 <= 20 && n2 <= 20 && n1 * n2 <= 200) {
      var table = [];
      for (var a = 0; a <= n1; a++) { table[a] = []; for (var b = 0; b <= n2; b++) table[a][b] = null; }
      function ways(a2, b2) {
        if (table[a2][b2]) return table[a2][b2];
        var arr = new Array(a2 * b2 + 1);
        for (var t2 = 0; t2 <= a2 * b2; t2++) arr[t2] = 0;
        if (a2 === 0 || b2 === 0) { arr[0] = 1; table[a2][b2] = arr; return arr; }
        var w1 = ways(a2 - 1, b2), w2 = ways(a2, b2 - 1);
        for (t2 = 0; t2 < w1.length; t2++) arr[t2] += w1[t2];
        for (t2 = 0; t2 < w2.length; t2++) arr[t2 + a2] += w2[t2];
        table[a2][b2] = arr; return arr;
      }
      var dist = ways(n1, n2), tot = 0;
      for (i = 0; i < dist.length; i++) tot += dist[i];
      var le = 0; for (i = 0; i <= Math.round(U); i++) le += dist[i];
      pExact = Math.min(1, 2 * le / tot);
      if (o.alt === 1) { var ge = 0; for (i = Math.round(U1); i < dist.length; i++) ge += dist[i]; pExact = ge / tot; }
      if (o.alt === 2) { var le2 = 0; for (i = 0; i <= Math.round(U1); i++) le2 += dist[i]; pExact = le2 / tot; }
    }
    var p = pExact != null ? pExact : pNorm;

              H.stat('Mdn₂ (IQR)', H.num(S.median(y), 2) + ' (' + H.num(S.iqr(y), 2) + '), n = ' + n2),
              H.stat('Mean rank₁', R1 / n1, 2), H.stat('Mean rank₂', (S.sum(r) - R1) / n2, 2),
              H.stat('z', z), H.pstat(p), H.stat('Method', pExact != null ? 'exact' : 'normal approximation with tie and continuity correction')],

      apa: 'U = ' + H.num(U1, 1) + ', z = ' + H.num(z, 2) + ', ' + H.pr(p) + ', r = ' + H.num(rb, 2) +

{
  id: 'wilcoxon', name: 'Wilcoxon signed-rank test', family: 'nonparam',

  run: function (d, o) {
    var x = d.groups[0], y = d.groups[1];

    x.forEach(function (v, i) { var dv = v - y[i]; if (dv === 0) zeros++; else diffs.push(dv); });

    var W = Math.min(Wp, Wm);
    var mu = n * (n + 1) / 4;

    ties.forEach(function (t) { tc += t * t * t - t; });
    var sig = Math.sqrt(n * (n + 1) * (2 * n + 1) / 24 - tc / 48);
    var z = (Wp - mu) / sig;
    var zc = (Math.abs(Wp - mu) - 0.5) / sig;
    var pNorm = o.alt === 0 ? Math.min(1, 2 * (1 - S.normalCDF(zc))) : (o.alt === 1 ? 1 - S.normalCDF(z - 0.5 / sig) : S.normalCDF(z + 0.5 / sig));
    var pExact = null;
    if (n <= 50 && ties.length === 0) {

      cnt[0] = 1;
      for (var r2 = 1; r2 <= n; r2++) for (var s2 = maxW; s2 >= r2; s2--) cnt[s2] += cnt[s2 - r2];
      var tot = Math.pow(2, n), le = 0;
      for (i2 = 0; i2 <= Math.round(W); i2++) le += cnt[i2];
      pExact = Math.min(1, 2 * le / tot);
      if (o.alt === 1) { var ge = 0; for (i2 = Math.round(Wp); i2 <= maxW; i2++) ge += cnt[i2]; pExact = ge / tot; }
      if (o.alt === 2) { var le2 = 0; for (i2 = 0; i2 <= Math.round(Wp); i2++) le2 += cnt[i2]; pExact = le2 / tot; }
    }
    var p = pExact != null ? pExact : pNorm;
    var rb = (Wp - Wm) / (n * (n + 1) / 2);
    var flags = [];
    if (zeros) flags.push(H.flag('info', zeros + ' pair(s) had identical values and were dropped, leaving n = ' + n + '. Report both numbers.'));

    return {
      stats: [H.stat('W⁺', Wp, 1), H.stat('W⁻', Wm, 1), H.stat('Mdn difference', S.median(diffs)),
              H.stat('Mdn₁ / Mdn₂', H.num(S.median(x), 2) + ' / ' + H.num(S.median(y), 2)),
              H.stat('z', z), H.pstat(p), H.stat('Pairs used', n, 0),
              H.stat('Method', pExact != null ? 'exact' : 'normal approximation')],
      p: p, flags: flags,
      effects: [H.eff('Rank-biserial r', rb, 3, H.magnitude('r', rb)), H.eff('r (z/√n)', Math.abs(z) / Math.sqrt(n))],
      apa: 'W = ' + H.num(Wp, 1) + ', z = ' + H.num(z, 2) + ', ' + H.pr(p) + ', r = ' + H.num(rb, 2)
    };
  },
  next: function () {
    return [
      { title: 'If the differences are asymmetric', body: 'The sign test drops the symmetry assumption entirely, at the cost of some power.', testId: 'sign_test' },
      { title: 'Three or more conditions?', body: 'Friedman test, then post-hoc.', testId: 'friedman' }
    ];
  }
},
{
  id: 'kruskal', name: 'Kruskal–Wallis H test', family: 'nonparam',
  tags: ['nonparametric', 'three groups', 'rank', 'ordinal', 'Dunn'],
  purpose: 'Compare three or more independent groups on ranks.',
  when: 'The non-parametric one-way ANOVA. Ideal for comparing students, practitioners and educators on ordinal ratings.',
  assumptions: ['Independent groups.', 'At least ordinal measurement.', 'Similar distribution shapes if you want to read it as a median comparison.'],
  input: { kind: 'groups', label: 'One column per group', min: 2 },
  options: [{ id: 'post', type: 'select', label: 'Post-hoc', choices: ['Dunn with Holm adjustment', 'Dunn with Benjamini–Hochberg', 'Dunn unadjusted', 'none'], def: 0 }],
  run: function (d, o) {
    var k = d.groups.length, all = [], sizes = [];
    d.groups.forEach(function (g) { all = all.concat(g); sizes.push(g.length); });
    var N = all.length, r = S.rank(all);
    var pos = 0, Rsum = [], meanRank = [];
    d.groups.forEach(function (g, i) {
      var s = 0; for (var j = 0; j < g.length; j++) s += r[pos + j];
      Rsum[i] = s; meanRank[i] = s / g.length; pos += g.length;
    });
    var Hstat = 0;
    for (var i2 = 0; i2 < k; i2++) Hstat += Rsum[i2] * Rsum[i2] / sizes[i2];
    Hstat = 12 / (N * (N + 1)) * Hstat - 3 * (N + 1);
    var ties = r.tieGroups || [], tc = 0;
    ties.forEach(function (t) { tc += t * t * t - t; });
    var C = 1 - tc / (N * N * N - N);
    var Hc = C > 0 ? Hstat / C : Hstat;
    var df = k - 1, p = S.chiSF(Hc, df);
    var eps2 = Hc / ((N * N - 1) / (N + 1));
    var etaH = (Hc - k + 1) / (N - k);
    var ph = [], raw = [];
    if (o.post !== 3) {
      for (i2 = 0; i2 < k; i2++) for (var j2 = i2 + 1; j2 < k; j2++) {
        var diff = meanRank[i2] - meanRank[j2];
        var se = Math.sqrt(((N * (N + 1) / 12) - tc / (12 * (N - 1))) * (1 / sizes[i2] + 1 / sizes[j2]));
        var z = diff / se, pp = 2 * (1 - S.normalCDF(Math.abs(z)));
        raw.push(pp);
        ph.push([d.names[i2] + ' vs ' + d.names[j2], H.num(diff, 2), H.num(z, 3), H.pfmt(pp), '', H.num(Math.abs(z) / Math.sqrt(sizes[i2] + sizes[j2]), 2)]);
      }
      var adj = o.post === 0 ? adjustP(raw, 'holm') : (o.post === 1 ? adjustP(raw, 'bh') : raw);
      ph.forEach(function (row, ii) { row[4] = H.pfmt(adj[ii]); });
    }
    var flags = [];
    if (p < 0.05 && o.post === 3) flags.push(H.flag('info', 'Significant overall. Choose a post-hoc method above to find out which groups differ.'));
    if (Math.min.apply(null, sizes) < 5) flags.push(H.flag('warn', 'A group has fewer than 5 cases. The chi-square approximation for H is unreliable at that size.'));
    return {
      stats: [H.stat('H', Hc), H.stat('df', df, 0), H.pstat(p), H.stat('N', N, 0), H.stat('Tie correction', C, 4)],
      p: p, flags: flags,
      effects: [H.eff('ε²', eps2, 3, H.magnitude('eta2', eps2)), H.eff('η²(H)', etaH)],
      tables: [
        { title: 'Groups', head: ['Group', 'n', 'Mdn', 'IQR', 'Mean rank'], rows: d.groups.map(function (g, ii) {
          return [d.names[ii], g.length, H.num(S.median(g), 2), H.num(S.iqr(g), 2), H.num(meanRank[ii], 2)]; }) }
      ].concat(ph.length ? [{ title: 'Dunn post-hoc', head: ['Comparison', 'Rank difference', 'z', 'p (raw)', 'p (adjusted)', 'r'], rows: ph }] : []),
      apa: 'H(' + df + ') = ' + H.num(Hc, 2) + ', ' + H.pr(p) + ', ε² = ' + H.num(eps2, 3)
    };
  },
  next: function (r) {
    if (r.p < 0.05) return [
      { title: 'Report all pairwise comparisons', body: 'Give the full Dunn table with adjusted p-values, and describe each group with its median and IQR.' },
      { title: 'Ordered groups?', body: 'If your groups have a natural order (novice → intermediate → expert), a Jonckheere–Terpstra trend test is more powerful. Run it in R with the DescTools package.' }
    ];
    return [{ title: 'Consider what you could detect', body: 'Rank tests lose power quickly with small groups. Check the detectable effect before concluding there is no difference.', testId: 'power' }];
  }
},
{
  id: 'friedman', name: 'Friedman test', family: 'nonparam',
  tags: ['nonparametric', 'repeated', 'related', 'rank', 'within subjects'],
  purpose: 'Compare three or more related conditions on ranks.',
  when: 'Every participant rated all the methods, and the ratings are ordinal.',
  assumptions: ['Same participants across all conditions.', 'At least ordinal measurement.', 'No missing cells.'],
  input: { kind: 'wide', label: 'One row per participant, one column per condition', numeric: true, min: 2 },
  options: [{ id: 'post', type: 'select', label: 'Post-hoc', choices: ['Conover with Holm adjustment', 'Nemenyi', 'none'], def: 0 }],
  run: function (d, o) {
    var k = d.groups.length, n = d.groups[0].length, i, j;
    d.groups.forEach(function (g) { if (g.length !== n) throw new Error('Every condition must have the same number of rows.'); });
    var rankSums = new Array(k), A1 = 0;
    for (j = 0; j < k; j++) rankSums[j] = 0;
    var rowRanks = [];
    for (i = 0; i < n; i++) {
      var row = []; for (j = 0; j < k; j++) row.push(d.groups[j][i]);
      var rr = S.rank(row);
      rowRanks.push(rr);
      for (j = 0; j < k; j++) { rankSums[j] += rr[j]; A1 += rr[j] * rr[j]; }
    }
    var C1 = n * k * (k + 1) * (k + 1) / 4;
    var T = 0; for (j = 0; j < k; j++) T += rankSums[j] * rankSums[j];
    var stat = (12 * T / (n * k * (k + 1))) - 3 * n * (k + 1);
    var tieSum = 0;
    rowRanks.forEach(function (rr) { (rr.tieGroups || []).forEach(function (t) { tieSum += t * t * t - t; }); });
    var corr = 1 - tieSum / (n * (k * k * k - k));
    var Q = corr > 0 ? stat / corr : stat;
    var df = k - 1, p = S.chiSF(Q, df);
    var W = Q / (n * (k - 1));
    var ph = [], raw = [];
    if (o.post !== 2) {
      var A = A1;
      for (i = 0; i < k; i++) for (j = i + 1; j < k; j++) {
        var pp, z;
        if (o.post === 0) {
          var tval = Math.abs(rankSums[i] - rankSums[j]) / Math.sqrt(2 * n * (A - T / n) / ((n - 1) * (k - 1)));
          pp = S.tTwoTail(tval, (n - 1) * (k - 1));
          raw.push(pp);
          ph.push([d.names[i] + ' vs ' + d.names[j], H.num(rankSums[i] / n - rankSums[j] / n, 2), H.num(tval, 3), H.pfmt(pp), '']);
        } else {
          z = Math.abs(rankSums[i] - rankSums[j]) / Math.sqrt(n * k * (k + 1) / 6);
          pp = S.ptukeySF(z * Math.SQRT2, k, Infinity);
          ph.push([d.names[i] + ' vs ' + d.names[j], H.num(rankSums[i] / n - rankSums[j] / n, 2), H.num(z, 3), H.pfmt(pp), '—']);
        }
      }
      if (o.post === 0) { var adj = adjustP(raw, 'holm'); ph.forEach(function (row, ii) { row[4] = H.pfmt(adj[ii]); }); }
    }
    return {
      stats: [H.stat('χ²', Q), H.stat('df', df, 0), H.pstat(p), H.stat('Participants', n, 0), H.stat('Conditions', k, 0)],
      p: p,
      effects: [H.eff('Kendall’s W', W, 3, W < 0.3 ? 'weak' : W < 0.5 ? 'moderate' : 'strong')],
      flags: n < 10 ? [H.flag('info', 'With ' + n + ' participants the chi-square approximation is rough. Report the mean ranks and be cautious with borderline p-values.')] : [],
      tables: [
        { title: 'Conditions', head: ['Condition', 'Mdn', 'IQR', 'Mean rank'], rows: d.groups.map(function (g, ii) {
          return [d.names[ii], H.num(S.median(g), 2), H.num(S.iqr(g), 2), H.num(rankSums[ii] / n, 2)]; }) }
      ].concat(ph.length ? [{ title: 'Post-hoc: ' + (o.post === 0 ? 'Conover' : 'Nemenyi'), head: ['Comparison', 'Mean rank difference', o.post === 0 ? 't' : 'z', 'p (raw)', 'p (adjusted)'], rows: ph }] : []),
      apa: 'χ²(' + df + ') = ' + H.num(Q, 2) + ', ' + H.pr(p) + ', Kendall’s W = ' + H.num(W, 3)
    };
  },
  next: function (r) {
    if (r.p < 0.05) return [{ title: 'Report mean ranks with the post-hoc', body: 'Readers cannot interpret a Friedman result without seeing the mean rank per condition.' },
      { title: 'Interval data and sphericity satisfied?', body: 'A repeated-measures ANOVA would have more power.', testId: 'anova_rm' }];
    return [];
  }
},
{
  id: 'sign_test', name: 'Sign test', family: 'nonparam',
  tags: ['nonparametric', 'paired', 'direction', 'median'],
  purpose: 'Test whether one of two paired measurements tends to be larger, using only the direction of each difference.',
  when: 'Paired data where the differences are asymmetric, or where only the direction is meaningful.',
  assumptions: ['Paired observations. That is all — this is the most assumption-light paired test there is.'],
  input: { kind: 'paired', label: 'Two numeric columns of equal length' },
  run: function (d) {
    var x = d.groups[0], y = d.groups[1];
    var pos = 0, neg = 0, tie = 0;
    x.forEach(function (v, i) { var dv = v - y[i]; if (dv > 0) pos++; else if (dv < 0) neg++; else tie++; });
    var n = pos + neg;
    if (n === 0) throw new Error('All pairs are tied.');
    var lo = Math.min(pos, neg), s = 0;
    for (var i2 = 0; i2 <= lo; i2++) s += Math.exp(S.logChoose(n, i2) - n * Math.log(2));
    var p = Math.min(1, 2 * s);
    var ci = H.clopper(pos, n);
    return {
      stats: [H.stat('Positive differences', pos, 0), H.stat('Negative differences', neg, 0), H.stat('Ties dropped', tie, 0),
              H.stat('Proportion positive', pos / n), H.stat('95% CI', '[' + H.num(ci.lo) + ', ' + H.num(ci.hi) + ']'), H.pstat(p)],
      p: p,
      effects: [H.eff('Effect', H.num(Math.abs(pos / n - 0.5) * 2, 3), 3, 'departure from an even split')],
      flags: [H.flag('info', 'The sign test ignores the size of each difference, so it has less power than Wilcoxon. Use it when symmetry is doubtful.')],
      apa: 'Sign test, ' + pos + ' positive vs ' + neg + ' negative differences, exact ' + H.pr(p)
    };
  },
  next: function () { return [{ title: 'If the differences are symmetric', body: 'Wilcoxon signed-rank uses the magnitudes too and will detect smaller effects.', testId: 'wilcoxon' }]; }
},
{
  id: 'spearman', name: "Spearman's rank correlation", family: 'nonparam',
  tags: ['correlation', 'nonparametric', 'monotonic', 'ordinal', 'rho'],
  purpose: 'Strength of a monotonic relationship between two variables, using ranks.',
  when: 'Ordinal variables, non-linear but consistently increasing relationships, or data with outliers.',
  assumptions: ['At least ordinal measurement.', 'Monotonic — not necessarily linear.'],
  input: { kind: 'xy', label: 'Two numeric columns of equal length' },
  run: function (d) {
    var x = d.groups[0], y = d.groups[1], n = x.length;
    if (y.length !== n) throw new Error('Both columns must have the same number of rows.');
    var rx = S.rank(x), ry = S.rank(y);
    var rs = pearsonR(rx, ry);
    var t = rs * Math.sqrt((n - 2) / (1 - rs * rs)), p = S.tTwoTail(t, n - 2);
    var z = 0.5 * Math.log((1 + rs) / (1 - rs)), se = 1.06 / Math.sqrt(n - 3);
    var lo = Math.tanh(z - 1.96 * se), hi = Math.tanh(z + 1.96 * se);
    var pr = pearsonR(x, y);
    return {
      stats: [H.stat('ρ', rs), H.stat('95% CI', '[' + H.num(lo) + ', ' + H.num(hi) + ']'), H.stat('t', t), H.stat('df', n - 2, 0), H.pstat(p), H.stat('n', n, 0)],
      p: p,
      effects: [H.eff('ρ²', rs * rs), H.eff('Strength', H.magnitude('r', rs)), H.eff('Pearson r for comparison', pr)],
      flags: n < 10 ? [H.flag('warn', 'With n < 10 the t approximation is poor. Use an exact permutation test, or interpret with caution.')] : [],
      scatter: { x: x, y: y, xn: d.names[0], yn: d.names[1] },
      apa: 'ρ = ' + H.num(rs, 2) + ', ' + H.pr(p) + ', n = ' + n
    };
  },
  next: function () {
    return [{ title: 'Many small ranks with ties?', body: 'Kendall’s tau-b handles ties more gracefully and has a cleaner probabilistic interpretation.', testId: 'kendall_tau' },
            { title: 'Testing many correlations?', body: 'A correlation matrix generates a lot of p-values. Adjust them.', testId: 'padjust' }];
  }
},
{
  id: 'kendall_tau', name: "Kendall's tau-b", family: 'nonparam',
  tags: ['correlation', 'nonparametric', 'ordinal', 'ties', 'concordance'],
  purpose: 'Rank correlation based on concordant and discordant pairs, with a tie correction.',
  when: 'Small samples, many tied values, or when you want a coefficient that means "probability of concordance minus probability of discordance".',
  assumptions: ['At least ordinal measurement.'],
  input: { kind: 'xy', label: 'Two numeric columns of equal length' },
  run: function (d) {
    var x = d.groups[0], y = d.groups[1], n = x.length;
    var conc = 0, disc = 0, tx = 0, ty = 0, i, j;
    for (i = 0; i < n; i++) for (j = i + 1; j < n; j++) {
      var dx = x[i] - x[j], dy = y[i] - y[j], s = dx * dy;
      if (dx === 0 && dy === 0) continue;
      if (dx === 0) { tx++; continue; }
      if (dy === 0) { ty++; continue; }
      if (s > 0) conc++; else disc++;
    }
    var n0 = n * (n - 1) / 2;
    var tau = (conc - disc) / Math.sqrt((n0 - tx) * (n0 - ty));
    var v = (2 * (2 * n + 5)) / (9 * n * (n - 1));
    var z = tau / Math.sqrt(v), p = 2 * (1 - S.normalCDF(Math.abs(z)));
    return {
      stats: [H.stat('τ-b', tau), H.stat('Concordant pairs', conc, 0), H.stat('Discordant pairs', disc, 0),
              H.stat('z', z), H.pstat(p), H.stat('n', n, 0)],
      p: p,
      effects: [H.eff('Strength', H.magnitude('r', tau)), H.eff('Interpretation', H.num((tau + 1) / 2, 3), 3, 'probability that a random pair is concordant')],
      apa: 'τb = ' + H.num(tau, 2) + ', z = ' + H.num(z, 2) + ', ' + H.pr(p)
    };
  },
  next: function () { return [{ title: 'Compare with Spearman', body: 'Tau is usually smaller than rho for the same data. They answer slightly different questions — do not treat a difference between them as a problem.', testId: 'spearman' }]; }
},
{
  id: 'moods_median', name: "Mood's median test", family: 'nonparam',
  tags: ['nonparametric', 'median', 'robust', 'groups'],
  purpose: 'Test whether groups have the same median, using only whether each value falls above or below the pooled median.',
  when: 'When the groups have very different distribution shapes, which makes Kruskal–Wallis hard to interpret as a median comparison.',
  assumptions: ['Independent groups.', 'At least ordinal measurement.'],
  input: { kind: 'groups', label: 'One column per group', min: 2 },
  run: function (d) {
    var all = []; d.groups.forEach(function (g) { all = all.concat(g); });
    var med = S.median(all), k = d.groups.length;
    var T = [[], []];
    d.groups.forEach(function (g) {
      var above = g.filter(function (v) { return v > med; }).length;
      T[0].push(above); T[1].push(g.length - above);
    });
    var rowT = T.map(function (r) { return S.sum(r); }), colT = [], N = 0;
    for (var j = 0; j < k; j++) { colT[j] = T[0][j] + T[1][j]; N += colT[j]; }
    var chi = 0, minE = Infinity;
    for (var i = 0; i < 2; i++) for (j = 0; j < k; j++) {
      var e = rowT[i] * colT[j] / N; minE = Math.min(minE, e);
      chi += Math.pow(T[i][j] - e, 2) / e;
    }
    var p = S.chiSF(chi, k - 1);
    return {
      stats: [H.stat('Grand median', med), H.stat('χ²', chi), H.stat('df', k - 1, 0), H.pstat(p), H.stat('N', N, 0)],
      p: p,
      flags: minE < 5 ? [H.flag('warn', 'Expected counts below 5. Use Fisher\'s exact test on the table below instead.')] : [],
      tables: [{ title: 'Above / below the grand median', head: [''].concat(d.names),
        rows: [['Above'].concat(T[0]), ['At or below'].concat(T[1]), ['Median'].concat(d.groups.map(function (g) { return H.num(S.median(g), 2); }))] }],
      apa: 'Mood’s median test, χ²(' + (k - 1) + ') = ' + H.num(chi, 2) + ', ' + H.pr(p)
    };
  },
  next: function () { return [{ title: 'Usually Kruskal–Wallis is better', body: 'Mood’s test throws away almost all the information in the data and has low power. Prefer Kruskal–Wallis unless the shapes really are incomparable.', testId: 'kruskal' }]; }
},
{
  id: 'ks_two', name: 'Two-sample Kolmogorov–Smirnov test', family: 'nonparam',
  tags: ['distribution', 'nonparametric', 'shape', 'two groups'],
  purpose: 'Test whether two samples come from the same distribution — in shape as well as location.',
  when: 'When a difference in spread or shape matters as much as a difference in centre.',
  assumptions: ['Independent samples.', 'Continuous data — heavy ties make the test conservative.'],
  input: { kind: 'groups', label: 'One column per group (exactly 2)', min: 2, max: 2 },
  run: function (d) {
    var x = d.groups[0].slice().sort(function (a, b) { return a - b; });
    var y = d.groups[1].slice().sort(function (a, b) { return a - b; });
    var n1 = x.length, n2 = y.length;
    var all = x.concat(y).sort(function (a, b) { return a - b; });
    var D = 0;
    all.forEach(function (v) {
      var f1 = 0, f2 = 0, i;
      for (i = 0; i < n1; i++) if (x[i] <= v) f1++;
      for (i = 0; i < n2; i++) if (y[i] <= v) f2++;
      D = Math.max(D, Math.abs(f1 / n1 - f2 / n2));
    });
    var ne = Math.sqrt(n1 * n2 / (n1 + n2));
    var lam = (ne + 0.12 + 0.11 / ne) * D;
    var p = 0;
    for (var j = 1; j <= 100; j++) p += 2 * Math.pow(-1, j - 1) * Math.exp(-2 * j * j * lam * lam);
    p = Math.max(0, Math.min(1, p));
    return {
      stats: [H.stat('D', D, 4), H.pstat(p), H.stat('n₁, n₂', n1 + ', ' + n2)],
      p: p,
      effects: [H.eff('Maximum CDF gap', (100 * D).toFixed(1) + '%')],
      flags: [H.flag('info', 'A significant result means the distributions differ somewhere — location, spread or shape. It does not tell you which. Plot both cumulative distributions before interpreting.')],
      apa: 'D = ' + H.num(D, 3) + ', ' + H.pr(p)
    };
  },
  next: function () { return [{ title: 'Locate the difference', body: 'If you care about centre, follow with Mann–Whitney. If you care about spread, compare variances with Levene.', testId: 'mannwhitney' }]; }
},

{
  id: 'padjust', name: 'Multiple comparison adjustment', family: 'adjust',
  tags: ['correction', 'Bonferroni', 'Holm', 'Benjamini-Hochberg', 'FDR', 'family-wise'],
  purpose: 'Adjust a family of p-values so that testing many hypotheses does not manufacture false positives.',
  when: 'Any time you run more than a handful of tests: one per theme, one per scale item, one per group pair. With 13 themes at α = .05 you expect roughly one false positive by chance alone.',
  assumptions: ['The p-values form a meaningful family — decided in advance, not selected after seeing which were smallest.'],
  caution: 'Bonferroni controls the family-wise error rate and is very conservative. Benjamini–Hochberg controls the false discovery rate and is the better choice for exploratory theme-level analysis, where you can tolerate some false positives among your discoveries.',
  input: { kind: 'pvals', label: 'One row per test: label and p-value' },
  options: [{ id: 'alpha', type: 'number', label: 'Alpha', def: 0.05, min: 0.001, max: 0.2, step: 0.005 }],
  run: function (d, o) {
    var ps = d.rows.map(function (r) { return r.p; }), names = d.rows.map(function (r) { return r.name; });
    var methods = ['bonferroni', 'holm', 'hochberg', 'bh', 'by', 'sidak'];
    var labels = ['Bonferroni', 'Holm', 'Hochberg', 'BH (FDR)', 'BY (FDR)', 'Šidák'];
    var adj = {};
    methods.forEach(function (m) { adj[m] = adjustP(ps, m); });
    var alpha = o.alpha || 0.05;
    var order = ps.map(function (p, i) { return i; }).sort(function (a, b) { return ps[a] - ps[b]; });
    var rows = order.map(function (i, rank) {
      return [rank + 1, names[i], H.pfmt(ps[i])].concat(methods.map(function (m) {
        return H.pfmt(adj[m][i]) + (adj[m][i] < alpha ? ' ✓' : '');
      }));
    });
    var counts = methods.map(function (m) { return adj[m].filter(function (p) { return p < alpha; }).length; });
    var rawCount = ps.filter(function (p) { return p < alpha; }).length;
    var flags = [];
    flags.push(H.flag('info', 'Unadjusted: ' + rawCount + ' of ' + ps.length + ' significant. Holm: ' + counts[1] + '. Benjamini–Hochberg: ' + counts[3] + '.'));
    if (rawCount > counts[3]) flags.push(H.flag('warn', (rawCount - counts[3]) + ' result(s) survive at α = ' + alpha + ' unadjusted but not after FDR control. Do not report those as findings.'));
    var expected = ps.length * alpha;
    flags.push(H.flag('info', 'With ' + ps.length + ' tests at α = ' + alpha + ' you would expect about ' + H.num(expected, 1) + ' false positive(s) by chance alone if every null were true.'));
    return {
      stats: [H.stat('Tests', ps.length, 0), H.stat('Significant (raw)', rawCount, 0), H.stat('Significant (Holm)', counts[1], 0), H.stat('Significant (BH)', counts[3], 0)],
      p: null, flags: flags,
      tables: [{ title: 'Adjusted p-values — ✓ marks significance at α = ' + alpha, head: ['Rank', 'Test', 'p (raw)'].concat(labels), rows: rows }],
      apa: 'p-values adjusted with the Benjamini–Hochberg procedure; ' + counts[3] + ' of ' + ps.length + ' comparisons remained significant at q < ' + alpha
    };
  },

},
{
  id: 'jonckheere', name: 'Jonckheere–Terpstra trend test', family: 'nonparam',
  tags: ['trend', 'ordered groups', 'expertise', 'novice expert', 'dose response', 'ordinal', 'monotonic', 'non-parametric'],
  purpose: 'Test whether scores rise (or fall) across groups that have a natural order, such as novice, intermediate and expert.',
  when: 'Three or more independent groups in a meaningful order, where you predicted a trend before seeing the data. It has more power than Kruskal–Wallis for that hypothesis because it uses the order.',
  assumptions: ['Independent groups, entered left to right in the predicted order.', 'At least ordinal data.', 'The order of the groups was fixed before looking at the results.'],
  caution: 'Choosing the group order after seeing the data turns this into a fishing expedition. If you did not predict an order, use Kruskal–Wallis.',
  input: { kind: 'groups', label: 'One column per group, left to right in the predicted order', min: 2 },
  options: [{ id: 'alt', type: 'select', label: 'Alternative', choices: ['two-sided (a trend either way)', 'increasing left to right', 'decreasing left to right'], def: 0 }],
  run: function (d, o) {

    });

      apa: 'A Jonckheere–Terpstra test for ordered alternatives: J = ' + H.num(jt.J, 1) + ', z = ' + H.num(jt.z, 2) + ', ' + H.pr(jt.p) +

},
{
  id: 'page_l', name: "Page's L trend test", family: 'nonparam',

  assumptions: ['The same participants in every condition, one row each.', 'Conditions entered left to right in the predicted order.', 'At least ordinal data.'],
  caution: "Page's test is one-sided by design: it asks whether scores follow the order you predicted. Decide the order before you look.",

      apa: "Page's trend test: L = " + H.num(pg.L, 1) + ', z = ' + H.num(pg.z, 2) + ', ' + H.pr(pg.p) + ' (one-sided), n = ' + n + ', k = ' + k +

  }
},
{
  id: 'art_anova', name: 'Aligned rank transform ANOVA', family: 'nonparam',
  tags: ['factorial', 'two factors', 'interaction', 'Likert', 'ART', 'non-parametric ANOVA', 'HCI', 'Wobbrock'],
  purpose: 'A non-parametric two-way ANOVA that keeps the two main effects and their interaction separate.',
  when: 'Two crossed factors on a Likert-type, skewed or ordinal outcome, such as expertise crossed with design method. Standard practice in HCI and design research since Wobbrock et al. (2011).',
  assumptions: ['Between-subjects: each participant appears in one cell only.', 'At least ordinal outcome.', 'Equal cell sizes give exact alignment.'],
  caution: 'Ranking the raw data and running an ordinary ANOVA lets main effects leak into the interaction. The alignment step here prevents that for between-subjects designs. For repeated measures, use ARTool in R.',
  input: { kind: 'factorial', label: 'Three columns: factor A, factor B, outcome value' },
  run: function (d) {
    var art = X.artAnova(d.rows3), b0 = art.base;
    var an = d.aName || 'Factor A', bn = d.bName || 'Factor B';
    var flags = [];
    if (!b0.balanced) flags.push(H.flag('warn', 'Cell sizes are unequal (' + Math.min.apply(null, b0.nC) + ' to ' + Math.max.apply(null, b0.nC) + '). Alignment is exact only for balanced designs, and results may differ from ARTool, which uses Type III sums of squares.'));
    flags.push(art.aligned ? H.flag('info', 'Alignment check passed: each aligned response carries only its own effect, the check ARTool reports.')
                           : H.flag('warn', 'Alignment check failed: effects leak between the aligned responses, usually because the design is unbalanced. Treat the results as approximate.'));
    if (art.AB.p < 0.05) flags.push(H.flag('info', 'The interaction is significant, so read each factor within the levels of the other rather than on its own.'));
    var cells = [];
    b0.la.forEach(function (l1) { b0.lb.forEach(function (l2) {
      var v = d.rows3.filter(function (r) { return r.a === l1 && r.b === l2; }).map(function (r) { return r.v; });
      cells.push([l1, l2, v.length, H.num(S.median(v), 2), H.num(S.quantile(v, 0.25), 2) + '–' + H.num(S.quantile(v, 0.75), 2)]);
    }); });
    function row(name, e) { return [name, H.num(e.F, 3), e.df1, e.df2, H.pfmt(e.p), H.num(e.pe, 3)]; }
    function txt(name, e) { return name + ', F(' + e.df1 + ', ' + e.df2 + ') = ' + H.num(e.F, 2) + ', ' + H.pr(e.p); }
    return {
      stats: [H.stat('N', b0.N, 0), H.stat('Design', b0.a + ' × ' + b0.b), H.stat('Balanced', b0.balanced ? 'yes' : 'no'),
              H.stat('F (' + an + ')', art.A.F), H.stat('F (' + bn + ')', art.B.F), H.stat('F (interaction)', art.AB.F), H.pstat(art.AB.p)],
      p: art.AB.p, flags: flags,
      effects: [H.eff('Partial η² (' + an + ')', art.A.pe), H.eff('Partial η² (' + bn + ')', art.B.pe), H.eff('Partial η² (interaction)', art.AB.pe)],
      tables: [
        { title: 'ART ANOVA (each effect from its own aligned ranks)', head: ['Effect', 'F', 'df', 'df error', 'p', 'partial η²'],
          rows: [row(an, art.A), row(bn, art.B), row('Interaction', art.AB)] },
        { title: 'Cell medians', head: [an, bn, 'n', 'Mdn', 'IQR'], rows: cells }],
      apa: 'Aligned rank transform ANOVA: ' + txt(an, art.A) + '; ' + txt(bn, art.B) + '; interaction, F(' + art.AB.df1 + ', ' + art.AB.df2 + ') = ' +
        H.num(art.AB.F, 2) + ', ' + H.pr(art.AB.p)
    };
  },
  next: function (r) {
    if (r.p < 0.05) return [{ title: 'Break down the interaction', body: 'Split the data by one factor and compare the levels of the other within each part, with Kruskal–Wallis (3+ levels) or Mann–Whitney (2 levels), correcting across the comparisons.', testId: 'kruskal' }];
    return [
      { title: 'Follow up a main effect', body: 'For a factor with three or more levels, Kruskal–Wallis with Dunn post-hoc comparisons locates the difference.', testId: 'kruskal' },
      { title: 'Well-behaved data after all?', body: 'The parametric two-way ANOVA is the counterpart.', testId: 'anova_two' }
    ];
  }
},
